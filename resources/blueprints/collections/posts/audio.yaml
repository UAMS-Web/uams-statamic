title: 'Audio Post'
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Entry Header'
        collapsible: true
        fields:
          -
            handle: title
            field: uamsweb_post_settings.title
            config:
              required: true
              validate:
                - required
          -
            import: uamsweb_post_entry_header
      -
        display: 'Featured Image and Cover Image'
        collapsible: true
        fields:
          -
            import: uamsweb_post_cover_image
      -
        display: 'Associations and Curation'
        collapsible: true
        fields:
          -
            import: uamsweb_post_associations
          -
            import: uamsweb_post_curation
      -
        display: 'Text Content Origin and Transparency'
        collapsible: true
        fields:
          -
            handle: digital_source_type
            field: digital_source_type.digital_source_type_text
            config:
              hide_display: true
              fullscreen: false
              border: false
      -
        display: Content
        collapsible: true
        fields:
          -
            handle: intro
            field: uamsweb_common.article
            config:
              display: Introduction
              localizable: false
          -
            handle: series
            field:
              max_items: 1
              mode: select
              taxonomies:
                - audio_series
              type: terms
              display: 'Audio Series'
              localizable: false
          -
            handle: genre
            field: uamsweb_common.genre
            config:
              if:
                series: 'equals empty'
              validate:
                - required
                - sometimes
          -
            handle: segments
            field:
              collapse: true
              type: replicator
              display: 'Audio Segments'
              localizable: false
              validate:
                - required
              sets:
                new_audio_segment_group:
                  display: 'New Audio Segment Group'
                  sets:
                    local_file:
                      display: 'Local Audio File'
                      icon: media-music-sound-equalizer
                      fields:
                        -
                          import: uamsweb_audio_segment_local_file
                new_video_segment_group:
                  display: 'New Video Segment Group'
                  sets:
                    youtube:
                      display: 'YouTube Video'
                      icon: media-webcam-video
                      fields:
                        -
                          import: uamsweb_video_segment_youtube
                    vimeo:
                      display: 'Vimeo Video'
                      icon: media-webcam-video
                      fields:
                        -
                          import: uamsweb_video_segment_vimeo
                    box:
                      display: 'Box.com Video'
                      icon: media-webcam-video
                      fields:
                        -
                          import: uamsweb_video_segment_box
          -
            handle: episode_number
            field:
              type: integer
              display: 'Episode Number'
              localizable: false
              if:
                series: 'not empty'
              validate:
                - required
                - sometimes
          -
            handle: season_number
            field:
              type: integer
              display: 'Season Number'
              instructions: 'Optional. For shows organized into seasons.'
              localizable: false
              if:
                series: 'not empty'
          -
            handle: show_notes
            field: uamsweb_common.article
            config:
              display: 'Show Notes'
              instructions: 'Episode show notes: summary, topics, and links.'
              localizable: false
              if:
                series: 'not empty'
          -
            handle: episode_transcript
            field: uamsweb_common.bard_transcript
            config:
              display: 'Episode Transcript'
              localizable: false
              if:
                series: 'not empty'
          -
            handle: episode_duration
            field:
              type: text
              display: 'Episode Duration'
              instructions: 'Optional. Total run time as `HH:MM:SS` (e.g. `00:42:15`).'
              localizable: false
              if:
                series: 'not empty'
          -
            handle: podcast_credits
            field:
              type: group
              display: 'Episode Credits'
              instructions: 'Credit the people involved in this episode: host, featured guests, and production roles.'
              if:
                series: 'not empty'
              always_save: true
              localizable: false
              fields:
                -
                  import: uamsweb_post_creator_roles_audio
      -
        display: 'Subject Matter'
        collapsible: true
        fields:
          -
            handle: post_categories
            field: uamsweb_post_subject_matter.post_categories
          -
            handle: post_tags
            field: uamsweb_post_subject_matter.post_tags
      -
        display: Behavior
        fields:
          -
            handle: series_boilerplate_display_query
            field: uamsweb_common.true_false
            config:
              display: 'Display Audio Series Boilerplate'
              default: true
              if:
                series: 'not empty'
              validate:
                - required
          -
            import: uamsweb_post_behavior
  scripts:
    display: Scripts
    sections:
      -
        fields:
          -
            import: uamsweb_entry_scripts
  robots:
    display: 'Meta Robots Settings'
    sections:
      -
        fields:
          -
            import: uamsweb_entry_seo_meta
          -
            import: uamsweb_entry_seo_robots
      -
        display: 'Sitemap'
        fields:
          -
            import: uamsweb_entry_sitemap
  sidebar:
    display: Sidebar
    sections:
      -
        display: 'Status and Visibility'
        fields:
          -
            handle: status_and_visibility
            field: uamsweb_common_status.status_and_visibility
            config:
              localizable: false
          -
            handle: password_protected
            field: uamsweb_common_status.password_protected
            config:
              localizable: false
          -
            handle: visibility_password
            field: uamsweb_common_status.visibility_password
            config:
              localizable: false
          -
            handle: is_password_hashed
            field: uamsweb_common_status.is_password_hashed
            config:
              localizable: false
          -
            handle: date
            field: uamsweb_common_status.date
            config: {  }
      -
        display: Meta
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: template
            field:
              type: hidden
              display: Template
              default: posts/audio
              localizable: false
