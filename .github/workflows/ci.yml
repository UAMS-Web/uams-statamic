name: CI

# SCRATCH BRANCH ONLY (UAMS-Web/uams-statamic#1255, question 1). Never merged.
# Splits the cost of the mutation plugin's initial run on ubuntu-latest into
# test execution and coverage collection, by running the same full suite,
# serially, twice on identical runners:
#   - exec: PCOV loaded but disabled (pcov.enabled=0), no coverage report.
#   - pcov: PCOV enabled and `--coverage-php`, the argument pest-plugin-mutate
#     adds for its initial run (Plugins/Mutate.php handleArguments, v5.0.2).
# The difference between the two wall times is the coverage cost.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  initial-run:
    name: Initial run timing (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arm: [exec, pcov]
    steps:
      - uses: actions/checkout@v7

      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sqlite3, pdo_sqlite, dom, gd, fileinfo, bcmath, imagick, zip, exif, sockets
          coverage: pcov
          tools: composer:v2
          ini-values: opcache.enable_cli=on, opcache.jit_buffer_size=64M, opcache.jit=tracing, zend.assertions=1, pcre.jit=0

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      - name: Build Stache seed (testing env)
        run: 'DB_DATABASE=:memory: APP_ENV=testing php artisan test:seed-stache'

      - name: Build route cache (testing env)
        run: APP_ENV=testing php artisan route:cache

      - name: Report versions
        run: |
          php -r 'echo "PHP ", PHP_VERSION, " pcov=", (extension_loaded("pcov") ? phpversion("pcov") : "none"), PHP_EOL;'
          vendor/bin/pest --version
          for p in pestphp/pest-plugin-mutate phpunit/php-code-coverage phpunit/phpunit brianium/paratest; do
            composer show --no-ansi "$p" 2>/dev/null | grep -E '^(name|versions)' || echo "$p: not reported"
          done
          nproc

      # Bounded below the job limit so the progress log survives a long arm.
      - name: Run the full suite serially (${{ matrix.arm }})
        run: |
          set -o pipefail
          if [ "${{ matrix.arm }}" = exec ]; then
            CMD=(php -d pcov.enabled=0 vendor/bin/pest --log-junit junit.xml)
          else
            CMD=(php -d pcov.enabled=1 vendor/bin/pest --coverage-php=coverage.php --log-junit junit.xml)
          fi
          echo "arm=${{ matrix.arm }} cmd=${CMD[*]}"
          start=$(date +%s); echo "start=$(date -u +%FT%TZ)"
          rc=0
          timeout 20400 "${CMD[@]}" > suite.log 2>&1 || rc=$?
          end=$(date +%s)
          echo "end=$(date -u +%FT%TZ) rc=$rc wall=$((end - start))s" | tee timing.txt
          sed -r 's/\x1b\[[0-9;]*m//g' suite.log | grep -E 'Tests:|Duration:' | tee -a timing.txt || true
          ls -l coverage.php 2>/dev/null | tee -a timing.txt || echo "no coverage.php" | tee -a timing.txt
          exit "$rc"

      - name: Upload timing artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: initial-run-${{ matrix.arm }}
          path: |
            timing.txt
            suite.log
            junit.xml
          if-no-files-found: warn

      - name: Clear route cache
        if: always()
        run: php artisan route:clear
