title: 'UAMSWeb Post Creator Roles (full)'
fields:
  -
    handle: host
    field: uamsweb_post_settings.creator_person
    config:
      display: Host
      instructions: "Guides the narrative and acts as the series' voice."
      default: null
      localizable: false
  -
    handle: guest
    field: uamsweb_post_settings.creator_person
    config:
      display: 'Featured Guest'
      instructions: 'Contributes specific knowledge or unique perspectives.'
      default: null
      localizable: false
  -
    handle: writer
    field: uamsweb_post_settings.creator_person
    config:
      display: Writer
      instructions: 'Structures the information into a compelling script.'
      default: null
      localizable: false
  -
    handle: editor
    field: uamsweb_post_settings.creator_person
    config:
      display: 'Editor (Text)'
      instructions: 'Edits and polishes the text content.'
      default: null
      localizable: false
  -
    handle: sound_recordist
    field: uamsweb_post_settings.creator_person
    config:
      display: 'Sound Recordist'
      instructions: 'Captures the auditory "raw assets" on location.'
      default: null
      localizable: false
  -
    handle: videographer
    field: uamsweb_post_settings.creator_person
    config:
      display: Videographer
      instructions: 'Captures the visual "raw assets" on camera.'
      default: null
      localizable: false
  -
    handle: audio_editor
    field: uamsweb_post_settings.creator_person
    config:
      display: 'Audio Editor'
      instructions: 'Refines and sequences sound during post-production.'
      default: null
      localizable: false
  -
    handle: video_editor
    field: uamsweb_post_settings.creator_person
    config:
      display: 'Video Editor'
      instructions: 'Assembles and polishes the visual story in post-production.'
      default: null
      localizable: false
  -
    handle: producer
    field: uamsweb_post_settings.creator_person
    config:
      display: Producer
      instructions: 'Directs the overall vision and manages the project.'
      default: null
      localizable: false
  -
    handle: generic_creator
    field: uamsweb_post_settings.creator_person
    config:
      display: 'Generic Creator'
      instructions: 'A generic creator role that can be used for any creator role.'
      default: null
      localizable: false
