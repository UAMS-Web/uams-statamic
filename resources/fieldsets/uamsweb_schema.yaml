    field: uamsweb_common.url
    config:
      display: 'Main Entity of Page'
      localizable: false
      instructions: 'Indicates a page (or other CreativeWork) for which this thing is the main entity being described.'
  -
    handle: medical_code
    field:
      type: replicator
      display: 'Medical Code(s) for This Entity'
      instructions: |-
        A medical code for the entity, taken from a controlled vocabulary or ontology (e.g., ICD-11, DiseasesDB, MeSH, SNOMED-CT, RxNorm).

        For information on the MedicalCode Schema.org type, visit <a href='https://schema.org/MedicalCode' target='_blank'>https://schema.org/MedicalCode</a>.

        * DiseasesDB (Diseases Database): <a href='http://www.diseasesdatabase.com/' target='_blank'>http://www.diseasesdatabase.com/</a>
        * ICD-10-CM (International Statistical Classification of Diseases and Related Health Problems, Tenth Revision, Clinical Modification): <a href='https://icd10cmtool.cdc.gov/' target='_blank'>https://icd10cmtool.cdc.gov/</a> or <a href='https://www.icd10data.com/' target='_blank'>https://www.icd10data.com/</a>
        * ICD-10-PCS (International Statistical Classification of Diseases and Related Health Problems, Tenth Revision, Procedure Coding System): <a href='https://www.icd10data.com/' target='_blank'>https://www.icd10data.com/</a>
        * ICD-11 (International Statistical Classification of Diseases and Related Health Problems, Eleventh Revision): <a href='https://icd.who.int/browse11/' target='_blank'>https://icd.who.int/browse11/</a>
        * ICHI (International Classification of Health Interventions): <a href='https://icd.who.int/dev11/l-ichi/en' target='_blank'>https://icd.who.int/dev11/l-ichi/en</a>
        * ICPC-3 (International Classification of Primary Care, Third Revision): <a href='https://browser.icpc-3.info/' target='_blank'>https://browser.icpc-3.info/</a>
        * MeSH (Medical Subject Headings): <a href='https://www.ncbi.nlm.nih.gov/mesh/' target='_blank'>https://www.ncbi.nlm.nih.gov/mesh/</a>
        * RxNorm: <a href='https://mor.nlm.nih.gov/RxNav/' target='_blank'>https://mor.nlm.nih.gov/RxNav/</a>
        * SNOMED-CT: <a href='https://browser.ihtsdotools.org/' target='_blank'>https://browser.ihtsdotools.org/</a></p>
      localizable: false
      sets:
        new_set_group:
          display: 'New Code Group'
          sets:
            new_set:
              display: 'New Code'
              fields:
                -
                  handle: codingsystem
                  field:
                    options:
                      -
                        key: DiseasesDB
                        value: DiseasesDB
                      -
                        key: ICD-10-CM-code
                        value: 'ICD-10-CM code'
                      -
                        key: ICD-10-PCS-code
                        value: 'ICD-10-PCS code'
                      -
                        key: ICD-11-code
                        value: 'ICD-11 code'
                      -
                        key: ICHI-procedure-code
                        value: 'ICHI procedure code'
                      -
                        key: ICPC-2-ID
                        value: 'ICPC 2 ID'
                      -
                        key: ICPC-3-ID
                        value: 'ICPC 3 ID'
                      -
                        key: MeSH-descriptor-ID
                        value: 'MeSH descriptor ID'
                      -
                        key: SNOMED-CT-ID
                        value: 'SNOMED-CT ID'
                      -
                        key: RxNorm-ID
                        value: 'RxNorm ID'
                    type: select
                    display: 'Coding System'
                    instructions: |-
                      Select from the list of coding systems or enter a custom option.

                      For information on the codingSystem Schema.org property, visit <a href='https://schema.org/codingSystem' target='_blank'>https://schema.org/codingSystem</a>.
                    validate:
                      - required
                      - sometimes
                -
                  handle: codevalue
                  field:
                    type: text
                    display: 'Code Value'
                    instructions: |-
                      A short textual code that uniquely identifies the value.

                      For information on the codeValue Schema.org property, visit <a href='https://schema.org/codeValue' target='_blank'>https://schema.org/codeValue</a>.
                    validate:
                      - required
                      - sometimes
                -
                  handle: name
                  field:
                    type: text
                    display: 'Name Associated With the Code'
                    validate:
                      - required
                      - sometimes
                -
                  handle: url
                  field: uamsweb_common.url
                  config:
                    display: 'URI or URL of the Code Description or Detail Page'
