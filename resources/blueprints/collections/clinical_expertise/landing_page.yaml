title: 'Landing Page'
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Page Title and Header'
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: true
              listable: true
              display: 'Page Title'
              validate:
                - required
          -
            import: uamsweb_header_selector_landing
      -
        display: 'Page Builder'
        fields:
          -
            import: page_builder
  scripts:
    display: Scripts
    sections:
      -
        fields:
          -
            import: uamsweb_entry_scripts
  seo:
    display: SEO
    sections:
      -
        display: 'Meta'
        fields:
          -
            import: uamsweb_entry_seo_meta
      -
        display: 'Meta Robots Settings'
        fields:
          -
            import: uamsweb_entry_seo_robots
      -
        display: 'Sitemap'
        fields:
          -
            import: uamsweb_entry_sitemap
  sidebar:
    display: Sidebar
    sections:
      -
        display: 'Status and Visibility'
        fields:
          -
            handle: status_and_visibility
            field: uamsweb_common_status.status_and_visibility
            config:
              localizable: false
          -
            handle: password_protected
            field: uamsweb_common_status.password_protected
            config:
              localizable: false
          -
            handle: visibility_password
            field: uamsweb_common_status.visibility_password
            config:
              localizable: false
          -
            handle: is_password_hashed
            field: uamsweb_common_status.is_password_hashed
            config:
              localizable: false
          -
            handle: date
            field: uamsweb_common_status.date_scheduled
            config: {  }
      -
        display: Meta
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - required
              display: Slug
          -
            handle: excerpt
            field: uamsweb_entry_meta.excerpt
            config:
              validate:
                - required
                - 'max:160'
          -
            handle: featured_image
            field: uamsweb_entry_meta.featured_image
          -
            handle: template
            field:
              type: hidden
              display: Template
              default: clinical_expertise/landing_page
              localizable: false
      -
        display: 'Site Navigation'
        fields:
          -
            import: uamsweb_entry_site_navigation
