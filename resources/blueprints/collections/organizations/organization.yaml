tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Title
              instructions: 'The full official name of the organization. Used for display and listing in the control panel.'
              localizable: false
          -
            handle: organization_role
            field:
              type: select
              display: 'Organization Role'
              instructions: 'The kind of organizational unit this entry represents. Determines which pickers (brand, department, service line, …) can select it.'
              options:
                brand: 'Brand Organization'
                college: College
                institute: Institute
                department_academic: 'Department, Academic'
                division_academic: 'Division, Academic'
                program: Program
                program_academic: 'Program, Academic'
                program_academic_degree: 'Program, Academic, Degree'
                department_clinical: 'Department, Clinical'
                department_institutional: 'Department, Institutional'
                service_line: 'Service Line'
                campus: Campus
              cast_booleans: false
              validate:
                - required
              localizable: false
          -
            handle: provenance
            field:
              type: radio
              display: Provenance
              instructions: "For brand organizations only: whether this is a UAMS-owned (first-party) brand or a third-party brand. Other organization roles are UAMS-internal and do not carry provenance — if their effective provenance is ever needed, it's derived from the nearest brand ancestor (first-party cascades; third-party does not presume its descendants are third-party)."
              options:
                first_party: 'First Party (UAMS)'
                third_party: 'Third Party'
              cast_booleans: false
              if:
                organization_role: 'equals brand'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: schema_object
            field:
              collections:
                - schema_objects
              max_items: 1
              query_scopes:
                - entries_by_schema_type_organization
              type: entries
              display: 'Schema Object for the Organization'
              instructions: 'Select a schema object for the organization, if available. When set, the inline fields below are not used.'
              localizable: true
              create: false
              validate:
                - 'entry_schema_type_in:Organization'
          -
            handle: name
            field:
              type: text
              display: 'Organization Name'
              instructions: |-
                Name the organization using only its full official name (e.g., "University of Arkansas for Medical Sciences").

                Do not include the word "The" at the beginning of the name.

                Do not follow the full name with an abbreviation or acronym in parentheses or set off by dashes.
              placeholder: 'e.g., University of Arkansas for Medical Sciences'
              if:
                schema_object: 'equals empty'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: name_pronunciation
            field:
              type: text_phonetic_pair
              display: 'Organization Name Pronunciation'
              text_label: 'Spoken Name (Text)'
              phonetic_label: 'Spoken Name (Phonetic Text)'
              instructions: |-
                Optional. Fill this in only when a speech engine would read the name wrongly -- an acronym such as "UAMS" is the usual case, because it is read as a word rather than as four letters.

                The spoken name may differ from the official name above: enter the form a person would say, then its pronunciation in IPA.

                Leave both boxes empty and the structured data emits the official name as plain text, exactly as it does today.
              quote_straight_on_text: true
              if:
                schema_object: 'equals empty'
              localizable: false
          -
            handle: workday_supervisory_organization_name
            field:
              type: text
              display: 'Workday Supervisory Organization Name'
              instructions: |-
                The supervisory organization name exactly as Workday holds it, including the pipe delimiter and any internal abbreviations (e.g., "COM | IDHI Institute for Dig Hlth & Innv").

                Store it verbatim. It is a reconciliation key, not a label: Workday renames these without changing the ID, and the verbatim string is what a human matches against a Workday export. It is never displayed publicly.
              placeholder: 'e.g., COM | IDHI Institute for Dig Hlth & Innv'
              localizable: false
          -
            handle: workday_supervisory_organization_id
            field:
              type: text
              display: 'Workday Supervisory Organization ID'
              instructions: 'The stable Workday identifier (e.g., "SOC300001877"). This is the join key: it survives renames, so reconciliation keys on it rather than on the name. Eleven UAMS nodes carry no ID; leave it empty for those and for external organizations.'
              placeholder: 'e.g., SOC300001877'
              localizable: false
          -
            handle: inherit_public_label_query
            field:
              type: toggle
              display: 'Inherit Public Label'
              instructions: 'When on, this entry displays the public label of its nearest ancestor whose own toggle is off. When off, this entry uses its own public label and is a valid source for descendants that inherit. Inheritance affects display only — the entry remains itself for relationships and schema.'
              default: false
              localizable: false
          -
            handle: public_label
            field:
              type: text
              display: 'Public Label'
              instructions: 'The editor-authored, public-facing name for this organization (e.g., "Institute for Digital Health and Innovation"). Required when this entry does not inherit. Internal Workday labels must never be copied here verbatim.'
              placeholder: 'e.g., Institute for Digital Health and Innovation'
              if:
                inherit_public_label_query: 'equals false'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: formal_name
            field:
              type: text
              display: 'Formal Name'
              instructions: 'The full name as it reads in running text, such as a person''s title ("professor of the UAMS College of Medicine"). Leave empty to use the public label.'
              placeholder: 'e.g., UAMS College of Medicine'
              localizable: false
          -
            import: uamsweb_schema_basic
          -
            import: uamsweb_schema_descriptions
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
              localizable: false
  computed:
    display: Computed
    sections:
      -
        fields:
          -
            handle: service_line_members
            field:
              type: entries
              display: 'Members of This Service Line'
              instructions: 'Read-only. The locations and providers whose service line is this organization. Only meaningful for a Service Line organization.'
              visibility: computed
              localizable: false
          -
            handle: academic_department_residents
            field:
              type: entries
              display: 'Current Residents of This Academic Department'
              instructions: 'Read-only. The people whose current residency academic department is this organization. Only meaningful for an academic Department or Division organization.'
              visibility: computed
              localizable: false
          -
            handle: academic_department_fellows
            field:
              type: entries
              display: 'Current Fellows of This Academic Department'
              instructions: 'Read-only. The people whose current fellowship academic department is this organization. Only meaningful for an academic Department or Division organization.'
              visibility: computed
              localizable: false
title: Organization
