                          field:
                            type: text
                            display: 'Phone Number Note'
  photos:
    display: Photos
    sections:
      -
        display: 'New Section'
        fields:
          -
            handle: image_parent_override_query
            field: uamsweb_common.true_false
            config:
              display: 'Override Parent Images?'
              clearable: true
              if:
                parent: 'not empty'
              validate:
                - required
                - sometimes
          -
            handle: featured_image_parent_override_query
            field: uamsweb_common.true_false
            config:
              display: 'Override Parent Featured Image?'
              clearable: false
              validate:
                - required
                - sometimes
              if:
                parent: 'not empty'
                image_parent_override_query: 'equals true'
          -
            handle: featured_image
            field: uamsweb_common_images.image_1200x675
            config:
              display: 'Featured Image'
              instructions: |-
                Select an image that will be used on card layouts, schema data, social sharing, etc.

                You can select an image that is also used as the Wayfinding Photo or in the Photo Gallery.

                The photo orientation must be landscape / horizontal.

                Recommended image dimensions: 2400x1350. Minimum image dimensions: 1200x675.
              validate:
                - sometimes
                - 'dimensions:min_width=1200,min_height=675'
              if_any:
                parent: 'equals empty'
                featured_image_parent_override_query: 'equals true'
          -
            handle: wayfinding_image_parent_override_query
            field: uamsweb_common.true_false
            config:
              display: 'Override Parent Wayfinding Photo?'
              instructions: 'To remove the parent wayfinding photo, select "Yes" and leave the image blank.'
              clearable: true
              if:
                parent: 'not empty'
                image_parent_override_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: wayfinding_image
            field: uamsweb_common_images.image_1200x675
            config:
              display: 'Wayfinding Photo'
              instructions: |-
                Select an image that will help the patient find the appropriate facility from the road.

                The photo orientation must be landscape / horizontal.

                Recommended image dimensions: 2400x1350. Minimum image dimensions: 1200x675.
              validate:
                - sometimes
                - 'dimensions:min_width=1200,min_height=675'
              if_any:
                parent: 'equals empty'
                wayfinding_image_parent_override_query: 'equals true'
          -
            handle: interior_wayfinding_image
            field: uamsweb_common_images.image_1200x675
            config:
              display: 'Interior Wayfinding Photo'
              instructions: |-
                Optional. A photo that helps patients navigate once inside the building — hallways, floors, or check-in points. Leave blank to omit it from the profile.

                The photo orientation must be landscape / horizontal.

                Recommended image dimensions: 2400x1350. Minimum image dimensions: 1200x675.
              validate:
                - sometimes
                - 'dimensions:min_width=1200,min_height=675'
          -
            handle: gallery_image_parent_override_query
            field: uamsweb_common.true_false
            config:
              display: 'Override Parent Photo Gallery?'
              instructions: 'To remove the parent gallery, select "Yes" and leave the gallery input empty.'
              clearable: true
              if:
                parent: 'not empty'
                image_parent_override_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: gallery_image
            field: uamsweb_common_images.image_1200x675
            config:
              display: 'Photo Gallery'
              instructions: |-
                You may select up to four images.

                These could include a photo of the interior entrance to the clinic or photos of the clinic in use.

                The photo orientation must be landscape / horizontal.

                Recommended image dimensions: 2400x1350. Minimum image dimensions: 1200x675.
              validate:
                - sometimes
                - 'dimensions:min_width=1200,min_height=675'
              if_any:
                parent: 'equals empty'
                gallery_image_parent_override_query: 'equals true'
  accepted_payment:
    display: 'Accepted Payment'
    sections:
      -
        fields:
          -
            handle: payment_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location accept payment on-site?'
              instructions: 'Turn on to record the payment methods this location accepts at the point of care. Leave off for locations where payment is handled centrally (e.g. through insurance or central billing).'
              clearable: true
              validate:
