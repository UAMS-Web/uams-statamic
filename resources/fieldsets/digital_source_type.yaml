title: 'IPTC Digital Source Type'
fields:
  -
    handle: digital_source_type_preset_text
    field:
      type: select
      display: 'Quick Text Content Preset'
      instructions: 'Select the scenario that best describes how this text content was produced.'
      clearable: true
      options:
        # --- Human-Authored Text ---
        -
          key: humanEdits_text_standard
          value: 'Human-Authored — Human Edited (standard workflow)'
        -
          key: digitalCreation_text_raw
          value: 'Human-Authored — Raw (no outside editing)'
        -
          key: algorithmicallyEnhanced_text_grammarly
          value: 'Human-Authored — Algorithmically Polished (e.g., Grammarly)'
        -
          key: compositeWithTrainedAlgorithmicMedia_text_ai_assisted
          value: 'Human-Authored — AI-Refined (AI-assisted rewriting)'

        # --- Transcripts and Records ---
        -
          key: digitalCapture_text_transcript_auto
          value: 'Transcript: Automated — Raw (e.g., Zoom/Otter output)'
        -
          key: digitalCreation_text_transcript_manual
          value: 'Transcript: Manual — Raw (staff-typed from audio)'
        -
          key: humanEdits_text_transcript_verified
          value: 'Transcript: Human-Verified (edited for accuracy or flow)'
        -
          key: compositeWithTrainedAlgorithmicMedia_text_transcript_summary
          value: 'Transcript: AI-Summarized (rewritten by generative AI)'

        # --- Data-Driven Text ---
        -
          key: dataDrivenMedia_text_report_auto
          value: 'Data/Report: Automated (live API or direct data)'
        -
          key: humanEdits_text_report_annotated
          value: 'Data/Report: Human-Annotated (edited for clarity)'

        # --- AI-Generated Text ---
        -
          key: trainedAlgorithmicMedia_text_ai_raw
          value: 'AI-Drafted — Raw (no human intervention)'
        -
          key: humanEdits_text_ai_verified
          value: 'AI-Drafted — Human Edited and Fact-Checked'
        -
          key: compositeSynthetic_text_ai_hybrid
          value: 'AI-Drafted — Human Composited (merged with human reporting)'
        -
          key: trainedAlgorithmicMedia_text_ai_loop
          value: 'AI-Drafted — AI-Refined (full AI loop)'
      localizable: false
  -
    handle: digital_source_type_text
    field:
      type: group
      display: 'Text Content Origin and Transparency'
      localizable: false
      replicator_preview: false
      fields:
        -
          handle: preset
          field: digital_source_type.digital_source_type_preset_text
          config:
            localizable: false
        -
          import: digital_source_type_questions
          config:
            localizable: false
  -
    handle: digital_source_type_preset_portrait
    field:
      type: select
      display: 'Quick Portrait Preset'
      instructions: 'Select the scenario that best describes how this portrait was produced.'
      clearable: true
      options:
        -
          key: humanEdits_portrait_standard
          value: 'Human-Edited Portrait (Standard Professional/Staff Portrait)'
        -
          key: digitalCapture_portrait_raw
          value: 'Unedited Portrait (Straight-out-of-camera)'
        -
          key: compositeWithTrainedAlgorithmicMedia_portrait_ai_retouch
          value: 'AI-Enhanced Portrait (Background expansion or AI retouching)'
        -
          key: algorithmicallyEnhanced_portrait_auto_fix
          value: 'Auto-Polished Portrait (Noise reduction or Auto-Correction)'
      localizable: false
  -
    handle: digital_source_type_portrait
    field:
      type: group
      display: 'Portrait Content Origin and Transparency'
      localizable: false
      replicator_preview: false
      fields:
        -
          handle: preset
          field: digital_source_type.digital_source_type_preset_portrait
          config:
            localizable: false
        -
          import: digital_source_type_questions
          config:
            localizable: false
  -
    handle: digital_source_type_preset_image
    field:
      type: select
      display: 'Quick Image Content Preset'
      instructions: 'Select the scenario that best describes how this image content was produced.'
      clearable: true
      options:
        # --- Human-Authored Images ---
        -
          key: humanEdits_image_photo_edited
          value: 'Photo — Human-Edited (e.g., Retouched headshot or campus photo)'
        -
          key: digitalCapture_image_photo_raw
          value: 'Photo — Unedited (e.g., Unedited photo straight from camera)'
        -
          key: compositeWithTrainedAlgorithmicMedia_image_photo_ai_refine
          value: 'Photo — AI-Refined (e.g., Background expansion or object removal)'

        # --- Screenshots & Virtual Assets ---
        -
          key: digitalCapture_image_screenshot_raw
          value: 'Screenshot — Unedited (e.g., Snippet of patient portal or website)'
        -
          key: humanEdits_image_screenshot_edited
          value: 'Screenshot — Human-Edited (e.g., Redacted or annotated UI capture)'
        -
          key: compositeWithTrainedAlgorithmicMedia_image_screenshot_ai
          value: 'Screenshot — AI-Refined (e.g., AI-generated background replacement)'

        # --- Automated Processing of Human-Authored Images ---
        -
          key: algorithmicallyEnhanced_image_auto_batch
          value: 'General — Auto-Enhanced (e.g., Batch-sharpened or auto-fixed assets)'

        # --- Data-Driven Images ---
        -
          key: dataDrivenMedia_image_data_raw
          value: 'Data/Report — Raw (e.g., Automated live dashboard or chart)'
        -
          key: humanEdits_image_data_annotated
          value: 'Data/Report — Human-Edited (e.g., Chart with manual annotations)'

        # --- Pure Digital Art ---
        -
          key: humanEdits_image_graphic_manual
          value: 'Graphic — Human-Authored (e.g., Custom vector logo or icon created in Illustrator)'
        -
          key: compositeWithTrainedAlgorithmicMedia_image_graphic_hybrid
          value: 'Graphic — AI-Hybrid (e.g., Manual drawing with AI-generated textures)'

        # --- AI-Generated Images ---
        -
          key: trainedAlgorithmicMedia_image_ai_pure
          value: 'Synthetic — Pure AI-Generated (e.g., AI medical illustration or banner)'
        -
          key: humanEdits_image_ai_retouched
          value: 'Synthetic — AI-Generated + Human Edits (e.g., Manually retouched AI art)'
      localizable: false
  -
    handle: digital_source_type_image
    field:
      type: group
      display: 'Image Content Origin and Transparency'
      localizable: false
      replicator_preview: false
      fields:
        -
          handle: preset
          field: digital_source_type.digital_source_type_preset_image
