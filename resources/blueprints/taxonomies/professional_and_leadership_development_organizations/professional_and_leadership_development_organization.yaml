title: 'Professional and Leadership Development — Hosting Organization'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: 'Term Title'
              instructions: 'This value is only used for display in the control panel.'
              localizable: false
          -
            handle: schema_object
            field:
              collections:
                - schema_objects
              max_items: 1
              query_scopes:
                - entries_by_schema_type_organization
              type: entries
              display: 'Schema Object for the Organization'
              instructions: 'Select a schema object for the organization, if available.'
              localizable: true
              create: false
              validate:
                - 'entry_schema_type_in:Organization'
          -
            handle: name
            field:
              type: text
              display: 'Professional/Leadership Development Organization Name'
              instructions: |-
                Name the taxonomy item using only the full official name of the professional/leadership development organization (e.g., "Wharton School").

                Do not include the word "The" at the beginning of the name.

                Do not follow the full name of the professional/leadership development organization with an abbreviation or acronym in parentheses or set off by dashes.
              if:
                schema_object: 'equals empty'
              validate:
                - required
                - sometimes
              localizable: false
          -
            import: uamsweb_schema_basic
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
              localizable: false
