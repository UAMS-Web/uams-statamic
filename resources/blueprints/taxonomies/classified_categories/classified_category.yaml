title: 'Classified Category'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Title
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'The rules a category carries, such as who may claim UAMS property offered for reallocation.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - max:200
