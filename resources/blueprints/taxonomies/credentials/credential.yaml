tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: 'Title of the Credential'
              localizable: false
              instructions: 'This is only for display in the control panel.'
          -
            handle: abbreviation
            field: uamsweb_common.text_with_phonetic_text
            config:
              display: 'Abbreviation for Display Name'
              localizable: false
              validate:
                - required
          -
            handle: full_name
            field:
              type: text
              display: 'Full Name of the Credential'
              validate:
                - required
              localizable: false
          -
            handle: alternate_name
            field: uamsweb_schema.alternate_name
            config:
              localizable: false
      -
        display: Details
        fields:
          -
            handle: ctdl
            field:
              ceterms_type_filter:
                - Credential
                - Occupation
                - WorkRole
              type: ctdl_class
              display: 'Credential Transparency Description Language Classification'
              validate:
                - required
              localizable: false
          -
            handle: ctdl_info
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Additional Categorization Information'
              localizable: false
              instructions: 'This can be used to provide additional information and/or context for the selected categorization.'
              if:
                ctdl: 'not empty'
          -
            handle: certifications_term
            field:
              max_items: 1
              taxonomies:
                - certifications
              type: terms_search_index
              search_index: certifications
              display: 'Related Certifications Taxonomy Term'
              instructions: 'Select the certifications term that represents this credential (when applicable).'
              localizable: false
              if:
                ctdl.ceterms_credential_type: 'equals Certification'
          -
            handle: subject_matter
            field:
              collections:
                - subject_matter
                - clinical_specializations
              type: entries
              select_across_sites: true
              search_index: subject_concepts
              display: 'Subject Matter'
              instructions: 'Select the subject matter or clinical specialization this credential is related to. A clinical concept is chosen from Clinical Specializations (the NUCC Health Care Provider Taxonomy code set and its UAMS extensions), never from Subject Matter.'
              localizable: false
              validate:
                - required
              create: false
          -
            handle: description
            field:
              type: textarea
              display: 'Description of the Credential'
              instructions: 'Provide a concise summary of the skills, requirements, and professional scope covered by this credential.'
              localizable: false
              if:
                ctdl: 'not empty'
                ctdl.ceterms_type: 'custom notContainsAny:Occupation,WorkRole'
                ctdl.ceterms_credential_type: 'not Certification'
          -
            handle: official_website_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this entity have a website?'
              localizable: false
              validate:
                - required
                - sometimes
              if:
                ctdl: 'not empty'
                ctdl.ceterms_type: 'custom notContainsAny:Occupation,WorkRole'
                ctdl.ceterms_credential_type: 'not Certification'
          -
            handle: official_website
            field: uamsweb_schema.url
            config:
              localizable: false
              if:
                ctdl: 'not empty'
                ctdl.ceterms_type: 'custom notContainsAny:Occupation,WorkRole'
                ctdl.ceterms_credential_type: 'not Certification'
                official_website_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: same_as
            field: uamsweb_schema.same_as
            config:
              localizable: false
              if:
                ctdl: 'not empty'
                ctdl.ceterms_credential_type: 'not Certification'
          -
            handle: additional_type
            field: uamsweb_schema.additional_type
            config:
              localizable: false
              if:
                ctdl: 'not empty'
                ctdl.ceterms_credential_type: 'not Certification'
      -
        display: Classification
        collapsible: true
        fields:
          -
            handle: clinical_query
            field: uamsweb_common.true_false
            config:
              display: 'Is this a clinical credential?'
              validate:
                - required
          -
            handle: clinical_statutory_credential_query
            field: uamsweb_common.true_false
            config:
              display: 'Is this a regulatory designation?'
              instructions: 'Does this degree, license or credential itself authorize the provider to perform their specific clinical role in the setting where they practice, by Arkansas law, an Arkansas state agency rule, or the body that governs that setting (such as the NCAA for collegiate athletics)? Answer no for a credential that only qualifies someone to apply for that authorization.'
              if:
                clinical_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: clinical_justification
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Justification as a Clinical Credential'
              localizable: false
              instructions: 'Justify why this is a clinical credential. For a regulatory designation, cite what authorizes the role (e.g. the Arkansas Code section, the agency rule, or the governing body''s bylaw).'
              validate:
                - sometimes
                - required
              if:
                clinical_query: 'equals true'
          -
            handle: clinical_additional_info
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Additional Information for the Clinical Credential'
              localizable: false
              instructions: 'Optional context about the clinical credential that is not part of its justification.'
              if:
                clinical_query: 'equals true'
      -
        display: 'Specialty/Subspecialty'
        collapsible: true
        fields:
          -
            handle: specialty
            field:
              type: terms_search_index
              display: 'Credential Specialty/Subspecialty'
              instructions: 'The specialty/subspecialty represented by the credential.'
              taxonomies:
                - specialties_aoa
                - specialties_acgme
                - specialties_non_accredited
                - research_specialties_acgme
                - research_specialties_non_accredited
                - other_specialties
              search_index: specialties_all
              max_items: 1
              unless_any:
                ctdl: 'equals empty'
                ctdl.ceterms_type: 'contains_any Occupation,WorkRole'
                ctdl.ceterms_credential_type: 'contains_any Certification,Degree,Diploma'
              localizable: false
      -
        display: 'Credential Audience'
        collapsible: true
        fields:
          -
            handle: audience
            field:
              type: terms_search_index
              display: 'Credential Audience'
              instructions: 'The people becoming credentialed.'
              taxonomies:
                - audiences
              search_index: audiences
              unless_any:
                ctdl: 'equals empty'
                ctdl.ceterms_type: 'contains_any Occupation,WorkRole'
                ctdl.ceterms_credential_type: 'equals Certification'
              localizable: false
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
              localizable: false
title: Credential
