      display: 'Reference Webpage(s) About This Entity'
      instructions: |-
        Reference webpages (e.g., Wikipedia article) or URI-identified RDF class from an external vocabulary (e.g., Wikidata entry, Library of Congress Name Authority File) that unambiguously indicates the entity's identity.

        * Wikipedia: <a href='https://en.wikipedia.org/' target='_blank'>https://en.wikipedia.org/</a>
        * Wikidata: <a href='https://www.wikidata.org/' target='_blank'>https://www.wikidata.org/</a>
        * Library of Congress Name Authority File: <a href='https://id.loc.gov/authorities/names.html' target='_blank'>https://id.loc.gov/authorities/names.html</a>
        * Virtual International Authority File: <a href='https://viaf.org/' target='_blank'>https://viaf.org/</a>
        * FAST Authority File: <a href='https://experimental.worldcat.org/fast/' target='_blank'>https://experimental.worldcat.org/fast/</a>
      localizable: false
      button_label: 'Add Reference Webpage'
      collapse: true
      sets:
        new_set_group:
          display: 'Reference Webpage'
          sets:
            new_set:
              display: 'Reference Webpage'
              fields:
                -
                  handle: url
                  field:
                    placeholder: 'e.g., https://en.wikipedia.org/w/index.php?title=Breast_cancer&oldid=1172745034'
                    type: text
                    display: 'Reference Webpage URI or URL'
                    instructions: 'Add the URI or permalink if it is available. Otherwise, add the URL.'
                    validate:
                      - required
                      - sometimes
                    localizable: false
