title: Topic
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Topic Details'
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: false
              validate:
                - required
              display: 'Topic Title'
          -
            handle: title_options
            field: uamsweb_header_selector_basic.title_options
            config:
              default: graphic
              validate:
                - required
              visibility: hidden
          -
            handle: header_graphic
            field:
              type: group
              display: 'Graphic Header Options'
              localizable: false
              border: false
              hide_display: true
              fullscreen: false
              if:
                title_options: 'equals graphic'
              fields:
                -
                  handle: body
                  field: uamsweb_header_graphic.body
                  config:
                    character_limit: 179
                    display: 'Topic Summary'
                    instructions: 'This text will appear below the topic title. It should be a basic description of the topic. There is a 179-character limit.'
                    localizable: false
                -
                  handle: image
                  field: uamsweb_header_graphic.image
      -
        display: 'Sharing Details'
        fields:
          -
            handle: title_short
            field: uamsweb_common.title_short
            config:
              display: 'Short Topic Title'
              localizable: false
          -
            handle: excerpt
            field: uamsweb_entry_meta.excerpt
            config:
              display: 'Topic Description'
              validate:
                - required
                - 'max:160'
          -
            handle: featured_image_16_9
            field: uamsweb_post_cover_image.featured_image_16_9
            config:
              validate:
                - 'dimensions:min_width=1200,min_height=675'
          -
            handle: featured_image_4_3
            field: uamsweb_post_cover_image.featured_image_4_3
          -
            handle: featured_image_1_1
            field: uamsweb_post_cover_image.featured_image_1_1
          -
            handle: featured_image_credit_query
            field: uamsweb_post_cover_image.featured_image_credit_query
      -
        display: 'Restrict Access'
        fields:
          -
            handle: restriction_query
            field: uamsweb_common.true_false
            config:
              display: 'Enable Content Restriction for This Topic'
              default: false
              validate:
                - required
                - sometimes
              if:
                ancestor_restriction_enabled: true
          -
            handle: restriction_message
            field:
              placeholder: 'e.g., "The content you are trying to access is for certain users only. Please log in to view it."'
              default: 'The content you are trying to access is for certain users only. Please log in to view it.'
              type: textarea
              display: 'Restricted Content Message'
              localizable: false
              if:
                restriction_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: restriction_category
            field:
              options:
                -
                  key: users
                  value: 'Specific Users'
                -
                  key: user_roles
                  value: 'Specific User Roles'
                -
                  key: user_groups
                  value: 'Specific User Groups'
              type: checkboxes
              display: 'Restriction Categories'
              localizable: false
              if:
                restriction_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: restriction_users
            field:
              type: users
              display: 'Restricted to Users'
              localizable: false
              if:
                restriction_query: 'equals true'
                restriction_category: 'contains users'
              validate:
                - required
                - sometimes
          -
            handle: restriction_user_roles
            field:
              type: user_roles
              display: 'Restricted to User Roles'
              localizable: false
              validate:
                - required
                - sometimes
              if:
                restriction_query: 'equals true'
                restriction_category: 'contains user_roles'
          -
            handle: restriction_user_groups
            field:
              type: user_groups
              display: 'Restricted to User Groups'
              localizable: false
              if:
                restriction_query: 'equals true'
                restriction_category: 'contains user_groups'
              validate:
                - required
                - sometimes
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field: uamsweb_common_status.date
            config: {  }
          -
            handle: template
            field:
              default: knowledge_bases/topic
              type: hidden
              display: Template
              localizable: false
          -
            handle: ancestor_restriction_enabled
            field:
              type: hidden
              localizable: false
              visibility: computed
      -
        display: 'Sitemap'
        fields:
          -
            import: uamsweb_entry_sitemap
  knowledge_base_settings:
    display: 'Knowledge Base Settings'
    sections:
      -
        display: 'Knowledge Base'
        fields:
          -
            handle: knowledge_base_title
            field:
              type: text
              display: 'Knowledge Base Title'
              localizable: false
              visibility: computed
          -
            handle: topic_label
            field:
              type: text
              display: 'Topic Label (Plural)'
              localizable: false
              visibility: computed
          -
            handle: topic_label_singular
            field:
              type: text
              display: 'Topic Label (Singular)'
              localizable: false
              visibility: computed
          -
            handle: article_rating_query
            field:
              type: toggle
              display: 'Enable Article Ratings'
              localizable: false
              visibility: computed
          -
            handle: knowledge_base_restriction_enabled
            field:
              type: toggle
              display: 'Enable Content Restriction for This Knowledge Base'
              localizable: false
              visibility: computed
          -
            handle: knowledge_base_restriction_global_query
            field:
              type: toggle
              display: 'Apply Global Content Restriction for This Knowledge Base'
              localizable: false
              visibility: computed
          -
            handle: knowledge_base_restriction_message
            field:
              type: textarea
              display: 'Restricted Content Message'
              localizable: false
              visibility: computed
          -
            handle: knowledge_base_restriction_category
            field:
              options:
                -
                  key: users
                  value: 'Specific Users'
                -
                  key: user_roles
                  value: 'Specific User Roles'
                -
                  key: user_groups
                  value: 'Specific User Groups'
              type: checkboxes
              display: 'Restriction Categories'
              if:
                knowledge_base_restriction_enabled: 'equals true'
                knowledge_base_restriction_global_query: 'equals true'
              localizable: false
              visibility: computed
          -
            handle: knowledge_base_restriction_users
            field:
              type: users
              display: 'Restricted to Users'
              if:
                knowledge_base_restriction_enabled: 'equals true'
                knowledge_base_restriction_global_query: 'equals true'
                knowledge_base_restriction_category: 'contains users'
              localizable: false
              visibility: computed
          -
            handle: knowledge_base_restriction_user_roles
            field:
              type: user_roles
              display: 'Restricted to User Roles'
              localizable: false
              visibility: computed
              if:
                knowledge_base_restriction_enabled: 'equals true'
                knowledge_base_restriction_global_query: 'equals true'
                knowledge_base_restriction_category: 'contains user_roles'
          -
            handle: knowledge_base_restriction_user_groups
            field:
              type: user_groups
              display: 'Restricted to User Groups'
              if:
                knowledge_base_restriction_enabled: 'equals true'
                knowledge_base_restriction_global_query: 'equals true'
                knowledge_base_restriction_category: 'contains user_groups'
              localizable: false
              visibility: computed
      -
        display: Topics
        fields:
          -
            handle: topic_search_query
            field:
              type: toggle
              display: 'Show Search Bar on Topic Pages'
              localizable: false
              visibility: computed
          -
            handle: topic_search_bar_title
            field:
              type: text
              display: 'Topic Search Bar Title'
              localizable: false
              visibility: computed
              if:
                topic_search_query: 'equals true'
          -
            handle: topic_search_placeholder
            field:
              type: text
              display: 'Topic Search Bar Placeholder Text'
              localizable: false
              visibility: computed
              if:
                topic_search_query: 'equals true'
          -
            handle: subtopic_label
            field:
              type: text
              display: 'Subtopics Label (Plural)'
              localizable: false
              visibility: computed
          -
            handle: subtopic_label_singular
            field:
              type: text
              display: 'Subtopics Label (Singular)'
              localizable: false
              visibility: computed
          -
            handle: subtopic_limit
            field:
              type: integer
              display: 'Number of Subtopics to Display'
              localizable: false
              visibility: computed
          -
            handle: subtopic_description_query
            field:
              type: toggle
              display: 'Show Subtopic Descriptions'
              localizable: false
              visibility: computed
          -
            handle: subtopic_image_query
            field:
              type: toggle
              display: 'Show Subtopic Featured Images'
              localizable: false
              visibility: computed
          -
            handle: show_all_subtopics_label
            field:
              type: text
              display: 'Show All Subtopics Link Label'
              localizable: false
              visibility: computed
          -
            handle: topic_article_label
            field:
              type: text
              display: 'Articles Label'
              localizable: false
              visibility: computed
          -
            handle: topic_article_label_singular
            field:
              type: text
              display: 'Articles Label (Singular)'
              localizable: false
              visibility: computed
          -
            handle: topic_article_count
            field:
              type: integer
              display: 'Number of Articles to Display'
              localizable: false
              visibility: computed
          -
            handle: topic_article_show_all_label
            field:
              type: text
              display: 'Show All Articles Link Label'
              localizable: false
              visibility: computed
          -
            handle: topic_article_last_modified_query
            field:
              type: toggle
              display: 'Show Article Last Modified Date'
              localizable: false
              visibility: computed
          -
            handle: topic_article_description_query
            field:
              type: toggle
              display: 'Show Article Excerpts'
              localizable: false
              visibility: computed
          -
            handle: topic_article_image_query
            field:
              type: toggle
              display: 'Show Article Featured Images'
              localizable: false
              visibility: computed
          -
            handle: topic_article_rating_query
            field:
              type: toggle
              display: 'Enable Article Ratings'
              localizable: false
              visibility: computed
          -
            handle: topic_article_view_count_query
            field:
              type: toggle
              display: 'Show Article View Count'
              localizable: false
              visibility: computed
              if:
                topic_article_rating_query: 'equals true'
          -
            handle: topic_article_like_count_query
            field:
              type: toggle
              display: 'Show Article Like Count'
              localizable: false
              visibility: computed
              if:
                topic_article_rating_query: 'equals true'
          -
            handle: topic_article_dislike_count_query
            field:
              type: toggle
              display: 'Show Article Dislike Count'
              localizable: false
              visibility: computed
              if:
                topic_article_rating_query: 'equals true'
