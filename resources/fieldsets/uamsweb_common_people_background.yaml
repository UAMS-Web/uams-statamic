title: 'UAMSWeb Common Reusable Fields, People, Professional Background'
fields:
  -
    handle: professional_and_leadership_development_activities_term
    field:
      type: terms_search_index
      display: 'Professional and Leadership Development Activities'
      taxonomies:
        - professional_and_leadership_development_activities
      search_index: professional_and_leadership_development_activities
      max_items: 1
      width: 100
      localizable: false
  -
    handle: activity_notes
    field:
      type: textarea
      display: Notes
      character_limit: 160
      replicator_preview: false
      localizable: false
  -
    handle: education_organization
    field:
      taxonomies:
        - education_organizations
      search_index: education_organizations
      max_items: 1
      type: terms_search_index
      display: 'Education Organization'
      localizable: false
      validate:
        - required
        - sometimes
  -
    handle: participating_sites
    field:
      taxonomies:
        - education_organizations
      search_index: education_organizations
      max_items: 25
      type: terms_search_index
      display: 'Participating Sites'
      instructions: 'Additional locations where this training actually took place — affiliated hospitals, clinics, or other sites beyond the sponsoring institution. Leave empty when all training occurred at the sponsoring institution.'
      localizable: false
  -
    handle: activity_start_date
    field:
      type: partial_date
      display: 'Date Started'
      width: 50
      localizable: false
  -
    handle: activity_end_date
    field:
      type: partial_date
      display: 'Date Completed'
      width: 50
      localizable: false
  -
    handle: specialty
    field:
      taxonomies:
        - specialties_acgme
        - specialties_aoa
        - specialties_non_accredited
      search_index: medical_specialties_all
      type: terms_search_index
      display: Specialty
      localizable: false
      query_scopes:
        - specialty
      validate:
        - required
        - 'specialty_taxonomy_term_type:specialty'
  -
    handle: education
    field:
      collapse: true
      type: replicator
      display: Education
      button_label: 'Add Education Activity'
      localizable: false
      sets:
        education_set_group:
          display: 'Education Set Group'
          sets:
            post_secondary:
              display: 'Post-Secondary Education'
              fields:
                -
                  handle: activity
                  field:
                    taxonomies:
                      - credentials
                    search_index: credentials
                    max_items: 1
                    type: terms_search_index
                    display: Degree
                    localizable: false
                    validate:
                      - required
                -
                  handle: specialty
                  field:
                    taxonomies:
                      - fields_of_study
                    search_index: fields_of_study
                    type: terms_search_index
                    display: 'Field of Study'
                    localizable: false
                -
                  handle: organization
                  field: uamsweb_common_people_background.education_organization
                  config:
                    localizable: false
                -
                  handle: activity_start_date
                  field: uamsweb_common_people_background.activity_start_date
                  config:
                    localizable: false
                -
                  handle: activity_end_date
                  field: uamsweb_common_people_background.activity_end_date
                  config:
                    display: 'Date Completed/Attained'
                    localizable: false
                -
                  handle: notes
                  field: uamsweb_common_people_background.activity_notes
                  config:
                    localizable: false
            secondary:
              display: 'Secondary Education'
              fields:
                -
                  handle: activity
                  field:
                    type: radio
                    display: 'Diploma Type'
                    options:
                      -
                        key: SecondarySchoolDiploma
                        value: 'Secondary School Diploma'
                      -
                        key: GeneralEducationDevelopment
                        value: 'General Education Development'
                    validate:
                      - required
                    localizable: false
                -
                  handle: organization
                  field: uamsweb_common_people_background.education_organization
                  config:
                    if:
                      activity: 'equals SecondarySchoolDiploma'
                    localizable: false
                -
                  handle: activity_end_date
                  field:
                    type: partial_date
                    display: 'Date Completed/Attained'
                    localizable: false
                -
                  handle: notes
                  field: uamsweb_common_people_background.activity_notes
                  config:
                    localizable: false
  -
    handle: training
