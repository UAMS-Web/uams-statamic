name: Check attribution footer

# Fails when a pull-request body carries the harness attribution footer, which
# UAMS-Web/uams-statamic-archive#2321 forbids in pull-request and issue bodies (UAMS-Web/uams-statamic-archive#2701). The harness tells
# authors to add it, so it arrived on pull request after pull request and was
# removed by hand at the gate. No other check can see a body: the `no-emoji`
# job scans the filesystem, and a body is not on it. This repository squashes,
# so the body is what becomes the commit message on `main`.
#
# The trigger types are the point, and they deliberately differ from
# `clear-handed-back.yml`, which is `synchronize` only. A body can take on the
# footer when the pull request opens, which is where most specimens carried it,
# and through any later edit, so all five types are needed.
#
# Template: .claude/skills/writing-pull-requests/templates/check-attribution-footer.yml
# in UAMS-Web/uams-claude-skills (UAMS-Web/uams-statamic-archive#3107). This header is the only part this copy
# may change: the synced-files skill's check-workflow-copies.mjs fails when the
# rest differs, and scripts/workflow-copies.test.mjs runs it. The checker it
# runs ships in that skill, and is the only copy in this repository.
#
# The body is read from the API rather than from the event payload, so an edit
# that lands between the event and the run is still the text that is checked.
#
# Deliberately NOT gated on RUN_REMOTE_CI, for the same reason as
# `clear-handed-back.yml`: that switch is off for months at a time. The job is
# one checkout, one API read and one Node script with no dependencies.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

# Nothing at the workflow level; the one job states the scopes it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the body for the attribution footer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node .claude/skills/writing-pull-requests/scripts/check-attribution-footer.mjs "$RUNNER_TEMP/body.md"
