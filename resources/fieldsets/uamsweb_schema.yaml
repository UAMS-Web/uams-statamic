title: 'UAMSWeb Schema'
fields:
  -
    handle: additional_type
    field:
      type: replicator
      display: 'More Specific Type(s) for This Entity From External Vocabularies in Microdata Syntax'
      instructions: |-
        The available types on Schema.org are not always the most specific. External vocabularies can be used to associate this entity with a more specific type.

        Add the URI-identified RDF class from an external vocabulary (e.g., Wikidata entry, Library of Congress Name Authority File).

        * Wikidata: <a href='https://www.wikidata.org/' target='_blank'>https://www.wikidata.org/</a>
        * Library of Congress Name Authority File: <a href='https://id.loc.gov/authorities/names.html' target='_blank'>https://id.loc.gov/authorities/names.html</a>
        * Virtual International Authority File: <a href='https://viaf.org/' target='_blank'>https://viaf.org/</a>
        * FAST Authority File: <a href='https://experimental.worldcat.org/fast/' target='_blank'>https://experimental.worldcat.org/fast/</a>
      localizable: false
      sets:
        new_set_group:
          display: 'New Type Group'
          sets:
            new_set:
              display: 'New Type'
              fields:
                -
                  handle: uri
                  field: uamsweb_common.url
                  config:
                    placeholder: 'e.g., http://id.loc.gov/authorities/names/n50065773'
                    display: 'URI-identified RDF class'
  -
    handle: alternate_name
    field:
      type: replicator
      display: 'Alternate Name(s)'
      instructions: 'Acronyms, shortened names or alternate spellings of the entity'
      localizable: false
      collapse: true
      button_label: 'Add Alternate Name'
      sets:
        new_set_group:
          display: 'Alternate Name'
          sets:
            new_set:
              display: 'Alternate Name'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: 'Alternate Name'
                    validate:
                      - required
                      - sometimes
                    localizable: false
  -
    handle: brand_organization
    field:
      max_items: 1
      type: entries
      collections:
        - organizations
      query_scopes:
        - entries_by_provenance_third_party
        - entries_by_organization_role_brand
      display: 'Third-Party Brand Organization (Single)'
      instructions: 'Select the most specific third-party brand organization to associate with this entity.'
      create: false
      select_across_sites: true
      localizable: false
  -
    handle: brand_organizations
    field:
      type: entries
      collections:
        - organizations
      query_scopes:
        - entries_by_provenance_third_party
        - entries_by_organization_role_brand
      display: 'Third-Party Brand Organizations (Multiple)'
      instructions: 'Select one or more of the most specific third-party brand organizations to associate with this entity.'
      create: false
      select_across_sites: true
      localizable: false
  -
    handle: brand_organization_query
    field: uamsweb_common.true_false
    config:
      display: 'Replace the default UAMS brand organization with a third-party brand organization?'
      instructions: 'Leave this off to use the default UAMS brand organization. Turn it on to associate this entity with a specific third-party brand organization instead.'
      clearable: true
      localizable: false
  -
    handle: description
    field: uamsweb_common.excerpt
    config:
      display: Description
      instructions: 'A description of the entity.'
      localizable: false
  -
    handle: disambiguating_description
    field: uamsweb_common.excerpt
    config:
      display: 'Disambiguating Description'
      instructions: 'A short description of the entity used to disambiguate from other, similar entities.'
      localizable: false
  -
    handle: drug
    field:
      type: replicator
      display: 'Chemical or Biologic Substance(s), Used As a Medical Therapy, That Has a Physiological Effect on an Organism'
      instructions: |-
        Here the term drug is used interchangeably with the term medicine although clinical knowledge makes a clear difference between them.

        For information on the Drug Schema.org type, visit <a href='https://schema.org/Drug' target='_blank'>https://schema.org/Drug</a>.
      localizable: false
      sets:
        new_set_group:
          display: 'New Drug Group'
          sets:
            new_set:
              display: 'New Drug'
              fields:
                -
                  handle: proprietaryname
                  field:
                    type: replicator
                    display: 'Proprietary Name'
                    instructions: |-
                      Proprietary name(s) given to the drug, typically by its originator(s) or creator(s). Search RxNorm at <a href='https://mor.nlm.nih.gov/RxNav/' target='_blank'>https://mor.nlm.nih.gov/RxNav/</a> to find or confirm this information.

                      For information on the proprietaryName Schema.org property, visit <a href='https://schema.org/proprietaryName' target='_blank'>https://schema.org/proprietaryName</a>.
                    validate:
                      - required
                      - sometimes
                    sets:
                      new_set_group:
                        display: 'New Name Group'
                        sets:
                          new_set:
                            display: 'New Name'
                            fields:
                              -
                                handle: text
                                field:
                                  placeholder: 'e.g., Lipitor'
                                  type: text
                                  display: 'Individual Proprietary Name'
                                  validate:
                                    - required
                                    - sometimes
                -
                  handle: nonproprietaryname
                  field:
                    type: replicator
                    display: 'Generic Name'
                    instructions: |-
                      The generic name(s) of this drug or supplement. Search RxNorm at <a href='https://mor.nlm.nih.gov/RxNav/' target='_blank'>https://mor.nlm.nih.gov/RxNav/</a> to find or confirm this information.

                      For information on the nonProprietaryName Schema.org property, visit <a href='https://schema.org/nonProprietaryName' target='_blank'>https://schema.org/nonProprietaryName</a>.
                    validate:
                      - required
                      - sometimes
                    sets:
                      new_set_group:
                        display: 'New Name Group'
                        sets:
                          new_set:
                            display: 'New Name'
                            fields:
                              -
                                handle: text
                                field:
                                  placeholder: 'e.g., atorvastatin'
                                  type: text
                                  display: 'Individual Generic Name'
                                  validate:
                                    - required
                                    - sometimes
                -
                  handle: drug_prescription_status
                  field: uamsweb_schema.drug_prescription_status
                -
                  handle: rxcui
                  field: uamsweb_common_identifiers.rxcui
                  config:
                    instructions: |-
                      Search for concept unique identifiers on the National Library of Medicine RxNorm website at <a href='https://mor.nlm.nih.gov/RxNav/' target='_blank'>https://mor.nlm.nih.gov/RxNav/</a>.

                      For information on the rxcui Schema.org property, visit <a href='https://schema.org/rxcui' target='_blank'>https://schema.org/rxcui</a>.
                    validate:
                      - required
                      - sometimes
  -
    handle: drug_prescription_status
    field:
      options:
        -
          key: 'false'
          value: Neither
        -
          key: OTC
          value: OTC
        -
          key: PrescriptionOnly
          value: PrescriptionOnly
      type: radio
      display: 'Drug Prescription Status'
      instructions: |-
        Indicate whether this drug is available by prescription or over-the-counter.

        For information on the DrugPrescriptionStatus Schema.org enumeration type, visit <a href='https://schema.org/DrugPrescriptionStatus' target='_blank'>https://schema.org/DrugPrescriptionStatus</a>.

        For information on the enumeration members of the DrugPrescriptionStatus Schema.org enumeration type, visit the links at <a href='https://schema.org/DrugPrescriptionStatus#subtypes' target='_blank'>https://schema.org/DrugPrescriptionStatus#subtypes</a>.
      cast_booleans: true
      localizable: false
  -
    handle: health_plan_network_id
    field:
      type: text
      display: 'Health Plan Network ID'
      instructions: 'Name or unique ID of network. (Networks are often reused across different insurance plans.)'
      localizable: false
  -
    handle: infectious_agent
    field:
      placeholder: 'e.g., severe acute respiratory syndrome coronavirus 2'
      type: text
      display: 'Infectious Agent'
      instructions: |-
        Indicate the name of the actual infectious agent, such as a specific bacterium.

        For information on the Schema.org infectiousAgent property, visit <a href='https://schema.org/infectiousAgent' target='_blank'>https://schema.org/infectiousAgent</a>
      localizable: false
  -
    handle: infectious_agent_class
    field:
      options:
        -
          key: 'false'
          value: 'None — No available option is relevant to this entity'
        -
          key: Bacteria
          value: null
        -
          key: Fungus
          value: null
        -
          key: MulticellularParasite
          value: null
        -
          key: Prion
          value: null
        -
          key: Protozoa
          value: null
        -
          key: Virus
          value: null
      type: radio
      display: 'Infectious Agent Class'
      instructions: |-
        Select the class of agents or pathogens that transmit this infectious disease. If there is no match, then select "None."

        For information on the Schema.org InfectiousAgentClass enumeration type, visit <a href='https://schema.org/InfectiousAgentClass' target='_blank'>https://schema.org/InfectiousAgentClass</a>.

        For information on each enumeration member, visit the relevant page linked at <a href='https://schema.org/InfectiousAgentClass#subtypes' target='_blank'>https://schema.org/InfectiousAgentClass#subtypes</a>.
      cast_booleans: true
      localizable: false
  -
    handle: iptcdigitalsourceenumeration_multiple
    field:
      options:
        -
          key: 'false'
          value: 'None — No available option is relevant to this entity'
        -
          key: MinorHumanEditsDigitalSource
          value: 'Human-edited media — Augmentation, correction or enhancement by one or more humans using non-generative tools'
        -
          key: CompositeWithTrainedAlgorithmicMediaDigitalSource
          value: 'Edited using Generative AI — Augmentation, correction or enhancement using a Generative AI model, such as with inpainting or outpainting operations'
        -
          key: TrainedAlgorithmicMediaDigitalSource
          value: 'Created using Generative AI — Digital media created algorithmically using an Artificial Intelligence model trained on captured content'
        -
          key: AlgorithmicallyEnhancedDigitalSource
          value: 'Algorithmically Altered Media — Modification or correction by algorithm without changing the main content of the media, initiated or configured by a human, such as sharpening or applying noise reduction'
        -
          key: DigitalCaptureDigitalSource
          value: 'Digital capture sampled from real life — The media was captured from a real-life source using a digital camera or digital recording device'
        -
          key: CompositeDigitalSource
          value: 'Composite of elements — Mix or composite of several elements, any of which may or may not be generative AI'
        -
          key: CompositeCaptureDigitalSource
          value: 'Composite of captured elements — Mix or composite of several elements that are all captures of real life'
        -
          key: CompositeSyntheticDigitalSource
          value: 'Composite including generative AI elements — Mix or composite of several elements, at least one of which is Generative AI'
        -
          key: VirtualRecordingDigitalSource
          value: 'Virtual event recording — Live recording of virtual event based on Generative AI and/or captured elements'
        -
          key: ScreenCaptureDigitalSource
          value: 'Screen capture — A capture of the contents of the screen of a computer or mobile device'
        -
          key: DigitalArtDigitalSource
          value: 'Digital Creation — Media created by a human using non-generative tools'
        -
          key: MultiFrameComputationalCaptureDigitalSource
          value: 'Multi-frame computational capture sampled from real life — The media is the result of capturing multiple frames from a real-life source using a digital camera or digital recording device, then automatically merging them into a single frame using digital signal processing techniques and/or non-generative AI. Includes High Dynamic Range (HDR) processing common in smartphone camera apps.'
        -
          key: NegativeFilmDigitalSource
          value: 'Digitised from a transparent negative — The media was digitised from a negative on film or other transparent medium'
        -
          key: PositiveFilmDigitalSource
          value: 'Digitised from a transparent positive — The media was digitised from a positive on a transparency or other transparent medium'
        -
          key: PrintDigitalSource
          value: 'Digitised from a non-transparent medium — The media was digitised from a non-transparent medium such as a photographic print'
        -
          key: DataDrivenMediaDigitalSource
          value: 'Data-driven media — Digital media representation of data via human programming or creativity'
        -
          key: AlgorithmicMediaDigitalSource
          value: 'Pure algorithmic media — Media created purely by an algorithm not based on any sampled training data (e.g. an image created by software using a mathematical formula)'
      type: checkboxes
      display: 'IPTC Digital Source Type(s) of the Entity'
      instructions: |-
        Select one or more appropriate IPTC digital source types to describe the entity. If there is no match, then select "None."

        For information on each option, visit the relevant page linked at <a href='https://schema.org/IPTCDigitalSourceEnumeration#subtypes' target='_blank'>https://schema.org/IPTCDigitalSourceEnumeration#subtypes</a>.
      cast_booleans: true
      localizable: false
