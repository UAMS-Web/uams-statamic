  mychart_open_scheduling:
    display: 'MyChart Open Scheduling'
    sections:
      -
        display: 'MyChart Open Scheduling Widget Configuration'
        fields:
          -
            handle: mychart_scheduling_query
            field: uamsweb_common.true_false
            config:
              display: 'Allow optional MyChart open scheduling?'
              instructions: 'Grant the ability at the page level to enable MyChart open scheduling.'
              default: false
              validate:
                - required
              localizable: false
          -
            handle: mychart_scheduling_domain
            field:
              type: text
              display: Domain
              instructions: 'Example: "scheduling.uamshealth.com" in https://scheduling.uamshealth.com/MyChart/'
              placeholder: 'e.g., scheduling.uamshealth.com'
              default: scheduling.uamshealth.com
              validate:
                - required
                - sometimes
              if:
                mychart_scheduling_query: 'equals true'
              localizable: false
          -
            handle: mychart_scheduling_instance
            field:
              type: text
              display: Instance
              instructions: 'Example: "MyChart" in https://scheduling.uamshealth.com/MyChart/'
              placeholder: 'e.g., MyChart'
              default: MyChart
              if:
                mychart_scheduling_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: mychart_scheduling_linksource
            field:
              type: text
              display: 'Link Source'
              placeholder: 'e.g., uamshealth.com'
              default: uamshealth.com
              if:
                mychart_scheduling_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
  uams_health_talk_podcast:
    display: 'UAMS Health Talk Podcast'
    sections:
      -
        display: 'Podcast Embed Configuration'
        fields:
          -
            handle: health_talk_query
            field: uamsweb_common.true_false
            config:
              display: 'Show the UAMS Health Talk podcast section on provider profiles?'
              instructions: 'When enabled, a provider whose profile carries a podcast guest name gets a section listing their UAMS Health Talk episodes. Turning this off removes the section and its third-party script from every profile.'
              default: true
              validate:
                - required
              localizable: false
          -
            handle: health_talk_script_url
            field:
              type: text
              display: 'Widget Script URL'
              instructions: 'The RadioMD widget script the embed loads. Changing the host also requires a matching `script-src` / `frame-src` allowance in the site''s Content Security Policy.'
              placeholder: 'e.g., https://radiomd.com/widget/easyXDM.js'
              default: 'https://radiomd.com/widget/easyXDM.js'
              if:
                health_talk_query: 'equals true'
              validate:
                - required
                - sometimes
                - url
              localizable: false
          -
            handle: health_talk_client
            field:
              type: text
              display: 'Client Slug'
              instructions: 'The RadioMD client identifier for UAMS. Issued by RadioMD — not something to guess.'
              placeholder: 'e.g., uams'
              default: uams
              if:
                health_talk_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: health_talk_station_id
            field:
              type: integer
              display: 'Station ID'
              instructions: 'The RadioMD station identifier. Issued by RadioMD — not derivable, and nothing validates it: a wrong value fails silently, showing an empty or wrong episode list rather than an error.'
              default: 303
              if:
                health_talk_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: health_talk_program_id
            field:
              type: integer
              display: 'Program ID'
              instructions: 'The RadioMD program identifier. Issued by RadioMD — not derivable, and, like the station ID, a wrong value fails silently rather than erroring.'
              default: 1837
              if:
                health_talk_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: health_talk_more_url
            field:
              type: text
              display: '"Listen to More Episodes" Destination'
              instructions: 'Where the section''s "Listen to More Episodes" link points. Leave blank to omit the link entirely, which is the default: WordPress sends readers to `/podcast/`, and no equivalent page exists in Statamic yet, so a default would link a 404.'
              placeholder: 'e.g., /health/podcast'
              if:
                health_talk_query: 'equals true'
              localizable: false
  remove_medical_ontology:
    display: 'Remove Medical Ontology'
    sections:
      -
        display: 'Removal Conditions'
        fields:
          -
            handle: remove_ontology_criteria
            field:
              type: replicator
              display: Removals
              localizable: false
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    new_removal:
                      display: 'New Removal'
                      fields:
                        -
                          handle: remove_service_lines
                          field:
                            max_items: 1
                            create: false
                            collections:
                              - organizations
                            query_scopes:
                              - entries_by_organization_role_service_line
                            select_across_sites: true
                            type: entries
                            display: 'Service Line'
                        -
                          handle: remove_regions
                          field:
                            max_items: 1
                            mode: select
                            create: false
                            taxonomies:
                              - regions
                            type: terms
                            display: Region
