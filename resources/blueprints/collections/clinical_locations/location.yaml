title: Location
order: 1
tabs:
  main:
    display: 'General Details'
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              localizable: false
          -
            handle: alternate_name
            field: uamsweb_schema.alternate_name
            config:
              display: 'Alternate Name(s) for the Location'
          -
            handle: generic_name
            field:
              type: text
              display: 'Generic Name'
              instructions: 'An optional plain, patient-facing name for this location. Shown in directory listings where a simpler label reads better than the full (disambiguated) title. Leave blank to use the title. Does not change the entry title or URL.'
              localizable: false
          -
            handle: location_types
            field: uamsweb_common_fad.location_types
            config:
              display: 'Location Type(s)'
              instructions: 'Used for filtering only'
          -
            handle: portals
            field: uamsweb_common_fad.portal
            config:
              display: 'Patient Portal'
              validate:
                - required
          -
            handle: prepend_the
            field: uamsweb_common.true_false
            config:
              display: 'Automatically prepend location name with "the" in phrases?'
              instructions: 'Setting this to "Yes" will add the word "the" before the location name in headings such as "About [Location Name]".'
              clearable: true
              validate:
                - required
          -
            handle: hidden_query
            field: uamsweb_common.true_false
            config:
              display: 'Exclude this location from the primary location list?'
              instructions: 'Setting this to "Yes" will remove this location from the Location archive. This input will not affect whether the location will be displayed on profiles and search results.'
              default: false
              validate:
                - required
          -
            handle: service_line_query
            field: uamsweb_common.true_false
            config:
              display: 'Is this location associated with one or more UAMS Health service lines?'
              clearable: true
              validate:
                - required
          -
            handle: service_line
            field: uamsweb_common_fad.service_line_multiple
            config:
              instructions: 'If the location is not associated with a UAMS Health service line, select the relevant option that begins with "None."'
              if:
                service_line_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: epic_dep_ids_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location have one or more UAMS Health Epic Department (DEP) IDs?'
              clearable: true
              validate:
                - required
          -
            handle: epic_dep_ids
            field: uamsweb_common_fad.epic_dep_ids
            config:
              instructions: "The location's Epic Department (DEP) IDs. Each MyChart open-scheduling widget references one or more of these in its own Department (DEP) ID field. Each ID may be listed once here and must not be declared by another location; IDs are compared ignoring capitalization and surrounding spaces."
              if:
                epic_dep_ids_query: 'equals true'
              validate:
                - required
                - sometimes
                - 'unique_identifier_list:clinical_locations,{id},dep'
          -
            handle: npi_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location have a National Provider Identifier (NPI)?'
              clearable: true
              validate:
                - required
          -
            handle: npi
            field:
              type: replicator
              display: 'National Provider Identifier (NPI)'
              instructions: "This value can be found by searching for the location in the <a href='https://npiregistry.cms.hhs.gov/search' target='_blank'>NPPES NPI Registry</a>. Each NPI may be listed once here and must not be held by another location; NPIs are compared ignoring capitalization and surrounding spaces."
              button_label: 'Add NPI'
              if:
                npi_query: 'equals true'
              validate:
                - required
                - sometimes
                - 'unique_identifier_list:clinical_locations,{id},item'
              localizable: false
              sets:
                new_set_group:
                  display: 'New NPI Group'
                  sets:
                    new_set:
                      display: 'New NPI'
                      fields:
                        -
                          handle: item
                          field: uamsweb_common_identifiers.npi
                          config:
                            display: 'Organizational National Provider Identifier (NPI)'
                            validate:
                              - required
                              - sometimes
  brand:
    display: Brand
    sections:
      -
        fields:
          -
            handle: brand_organization_query
            field: uamsweb_schema.brand_organization_query
            config:
              validate:
                - required
          -
            handle: brand_organization
            field: uamsweb_schema.brand_organization
            config:
              display: 'Third-Party Brand Organization'
              validate:
                - required
                - sometimes
              if:
                brand_organization_query: 'equals true'
  address:
    display: Address
    sections:
      -
        fields:
          -
            handle: parent_address_override_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location have a different address from its parent location?'
              instructions: 'Leave this off to use the address of the location this one sits under. Turn it on, then choose which parts differ: the street address, the facility, the floor or suite, or the entrance map pin. Every part left off still comes from the parent.'
              default: false
              if:
                parent: 'not empty'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: parent_address_override_street_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location have a different street address and region from its parent location?'
              instructions: 'Turn this on when this location sits at a different street address from its parent.'
              default: false
              if:
                parent: 'not empty'
                parent_address_override_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: parent_address_override_facility_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location sit in a different facility from its parent location?'
              instructions: 'Turn this on when this location is in a different building or wing from its parent, or is standalone while its parent is not.'
              default: false
              if:
                parent: 'not empty'
                parent_address_override_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: parent_address_override_unit_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location have a different floor or suite from its parent location?'
              instructions: 'Turn this on when this location checks patients in on another floor or in another suite of the same facility.'
              default: false
              if:
                parent: 'not empty'
                parent_address_override_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: parent_address_override_map_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location have a different entrance map pin from its parent location?'
              instructions: 'Turn this on when patients reach this location through a different entrance from its parent.'
              default: false
              if:
                parent: 'not empty'
                parent_address_override_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: facility_query
            field: uamsweb_common.true_false
            config:
              display: 'Is this location contained within a larger facility rather than being its own standalone facility?'
              clearable: true
              if:
                parent_address_override_query: 'custom parentOverride:facility'
              validate:
                - required
                - sometimes
          -
            handle: facility
            field: uamsweb_common_fad.facility
            config:
              instructions: 'Choose the most specific building or wing where this location is situated.'
              if:
                facility_query: 'equals true'
                parent_address_override_query: 'custom parentOverride:facility'
              validate:
                - required
                - sometimes
          -
            handle: facility_level
            field: uamsweb_common_fad.facility_level
            config:
              instructions: 'Choose the level of the facility where the patient will initially check in.'
              if:
                parent_address_override_query: 'custom parentOverride:unit'
              validate:
                - required
                - sometimes
          -
            handle: suite
            field:
              placeholder: 'e.g., Suite 1A'
              type: text
              display: 'Suite or Other Unit'
              instructions: |-
                Indicate the area where the patient would first check in.

                Do not just include the number (e.g., enter "Suite 1A" not just "1A.").

                Do not include landmarks (i.e., don't say "Next to this other thing").

                If you are putting the name of another clinic here, this location should instead be set as a child of that location.
              if:
                parent_address_override_query: 'custom parentOverride:unit'
              localizable: false
          -
            handle: address
            field:
              type: address
              address_line_2_include: false
              display: Address
              if:
                parent_address_override_query: 'custom parentOverride:street'
              validate:
                - sometimes
                - required
              localizable: false
          -
            handle: map
            field: uamsweb_common_address.map
            config:
              display: 'GPS Location of the Facility Entrance'
              validate:
                - required
                - sometimes
                - lat_lng
              if:
                parent_address_override_query: 'custom parentOverride:map'
          -
            handle: regions
            field: uamsweb_common_address.regions
            config:
              display: 'Arkansas Region'
              max_items: 1
              if:
                parent_address_override_query: 'custom parentOverride:street'
              validate:
                - required
                - sometimes
  parking_information:
    display: 'Parking Information'
    sections:
      -
        fields:
          -
            handle: parent_parking_override_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location have different parking or directions from its parent location?'
              instructions: 'Leave this off to use the parking and directions of the location this one sits under. Turn it on when this location is reached differently — a different parking area, or its own suite-level directions from the parking area to check-in.'
              default: false
              if:
                parent: 'not empty'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: parking_query
            field: uamsweb_common.true_false
            config:
              display: 'Is parking available at this location?'
              default: true
              if:
                facility_query: 'equals false'
                parent_parking_override_query: 'custom parentOverride:parking'
              validate:
                - required
                - sometimes
          -
            handle: parking_facility_inherit_query
            field: uamsweb_common.true_false
            config:
              display: 'Inherit the parking facility from the facility this location is in?'
              instructions: 'Leave this on to use the parking of the building or wing this location sits in. Turn it off to choose a different parking facility for this location.'
              default: true
              if:
                facility_query: 'custom parkingVisible:facilityInherit'
          -
            handle: parking_facility
            field:
              type: entries
              display: 'Main Parking Area for This Location'
              collections:
                - facilities
              query_scopes:
                - entries_by_blueprint_parking_facility
                - entries_by_blueprint_parking_division
              if:
                facility_query: 'custom parkingVisible:facility'
              select_across_sites: true
              max_items: 1
              create: false
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: parking_instructions_inherit_query
            field: uamsweb_common.true_false
            config:
              display: 'Inherit the parking instructions?'
              instructions: 'Leave this on to use the parking instructions from the selected parking facility. Turn it off to write instructions specific to this location.'
              default: true
              if:
                facility_query: 'custom parkingVisible:inheritToggle'
          -
            handle: parking_instructions
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Instructions for Parking in the Main Parking Area'
              instructions: |-
                Indicate whether patients will park in a parking deck or surface-level parking.

                Indicate which parking lot, parking deck or other area in which patients will park when coming to this location.

                If patients will be parking in a specific parking deck, indicate the ideal area of the parking deck in which patients should park. If there is a patient drop-off area, also include details about that.
              if:
                parking_instructions_inherit_query: 'custom parkingVisible:instructions'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: directions_from_parking_inherit_query
            field: uamsweb_common.true_false
            config:
              display: 'Inherit the directions from parking?'
              instructions: 'Leave this on to use the directions from the selected parking facility. Turn it off to write directions specific to this location.'
              default: true
              if:
                facility_query: 'custom parkingVisible:inheritToggle'
          -
            handle: directions_from_parking
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Directions From the Main Parking Area'
              instructions: |-
                Comprehensively describe the path patients should take when coming from their vehicle — whether at the patient drop-off area or in the main parking area — to the entrance or check-in area for the location.

                If the main parking area is a parking deck, include instructions regarding how to locate the appropriate elevators and stairs in the parking deck, then include the parking deck level to which they should take those elevators or stairs.
              if:
                directions_from_parking_inherit_query: 'custom parkingVisible:directions'
              validate:
                - required
                - sometimes
              localizable: false
  description_of_the_location:
    display: 'Description of the Location'
    sections:
      -
        fields:
          -
            handle: about
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Lead Description'
              instructions: 'Lead description for the location — the opening prose only. This field does not allow headings; add any subheaded content as Description Sections below.'
              localizable: false
          -
            handle: description_sections
            field:
              type: replicator
              display: 'Additional Description Sections'
              instructions: 'Optional subheaded sections that follow the lead description. Use a Generic Section for one-off content (its heading becomes a subheading). Use the Affiliation block for affiliations with other medical centers or clinics. Use the Billing or Medical Records blocks to include those standard sections (maintained in Find-a-Doc Settings), optionally modifying the standard copy.'
              button_label: 'Add Section'
              collapse: false
              localizable: false
              sets:
                sections:
                  display: 'Additional Description Sections'
                  sets:
                    section:
                      display: 'Generic Section'
                      instructions: 'A subheading and its content.'
                      fields:
                        -
                          handle: heading
                          field:
                            type: text
                            display: Heading
                            instructions: 'Renders as a subheading above the content.'
                            validate:
                              - required
                        -
                          handle: body
                          field: uamsweb_common.bard_simple_lists_links_h4
                          config:
                            display: Content
                            validate:
                              - required
                    affiliation:
                      display: Affiliation
                      instructions: 'Affiliations with other medical centers or clinics. Rendered under a fixed "Affiliation" subheading.'
                      fields:
                        -
                          handle: body
                          field: uamsweb_common.bard_simple_lists_links
                          config:
                            display: Affiliation
                            validate:
                              - required
                    billing:
                      display: 'Billing (Standard Section)'
                      instructions: 'Adds the standard Billing section (copy maintained in Find-a-Doc Settings). Rendered under a fixed "Billing" subheading. Choose whether to use the standard copy as-is or modify it for this location.'
                      fields:
                        -
                          handle: modification
                          field: uamsweb_common.standard_content_modification
                        -
                          handle: body
                          field: uamsweb_common.bard_simple_lists_links_h4
                          config:
                            display: 'Your Content'
                            if:
                              modification: 'contains_any prepend, append, override'
                            validate:
                              - required
                              - sometimes
                            localizable: false
                    medical_records:
                      display: 'Medical Records (Standard Section)'
                      instructions: 'Adds the standard Medical Records section (copy maintained in Find-a-Doc Settings). Rendered under a fixed "Medical Records" subheading. Choose whether to use the standard copy as-is or modify it for this location.'
                      fields:
                        -
                          handle: modification
                          field: uamsweb_common.standard_content_modification
                        -
                          handle: body
                          field: uamsweb_common.bard_simple_lists_links_h4
                          config:
                            display: 'Your Content'
                            if:
                              modification: 'contains_any prepend, append, override'
                            validate:
                              - required
                              - sometimes
                            localizable: false
          -
            handle: short_desc
            field: uamsweb_common.excerpt
            config:
              display: 'Short Description'
          -
            handle: video_url
            field: uamsweb_common_video.video_url
            config:
              display: 'Featured Video'
          -
            handle: prescription_query
            field: uamsweb_common.true_false
            config:
              display: 'Include information about prescription refills?'
              default: false
              validate:
                - required
          -
            handle: prescription_type
            field:
              options:
                -
                  key: pharm
                  value: 'Preset Text Instructing Patients to Call Their Pharmacy'
                -
                  key: clinic
                  value: 'Preset Text Instructing Patients to Call the Clinic'
                -
                  key: custom
                  value: 'Custom Text'
              default: pharm
              type: radio
              display: 'Which Prescription Information to Include'
              instructions: 'Administrators can change the preset text in Find-a-Doc Settings > Clinical Locations.'
              sortable: false
              validate:
                - required
                - sometimes
              if:
                prescription_query: 'equals true'
              localizable: false
          -
            handle: current_prescription_clinic
            field:
              type: textarea
              display: 'Current Prescription Information Instructing Patients to Call the Clinic'
              visibility: read_only
              if:
                prescription_query: 'equals true'
                prescription_type: 'equals clinic'
              localizable: false
          -
            handle: current_prescription_pharmacy
            field:
              type: textarea
              display: 'Current Prescription Information Instructing Patients to Call Their Pharmacy'
              visibility: read_only
              if:
                prescription_query: 'equals true'
                prescription_type: 'equals pharm'
              localizable: false
          -
            handle: prescription
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Custom Prescription Refills Information'
              if:
                prescription_query: 'equals true'
                prescription_type: 'equals custom'
              validate:
                - required
                - sometimes
              localizable: false
  language_interpreter_assistance:
    display: 'Language Interpreter Assistance'
    sections:
      -
        fields:
          -
            handle: interpreter_query
            field: uamsweb_common.true_false
            config:
              display: 'Does this location offer language interpreter assistance?'
              clearable: true
              validate:
                - required
          -
            handle: interpreter_language
            field: uamsweb_common.language
            config:
              display: 'Language Interpreter Assistance Available at This Location'
              if:
                interpreter_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
  appointment_information:
    display: 'Appointment Information'
    sections:
      -
        fields:
          -
            handle: restricted_access
            field: uamsweb_common.true_false
            config:
              display: 'Is access to this location restricted to specific patients?'
              instructions: 'Turn on for eligibility-restricted locations where only certain patients may book — for example an athletics clinic or a residents-only clinic.'
              default: false
              validate:
                - required
          -
            handle: restricted_access_message
            field: uamsweb_common.article
            config:
              display: 'Eligibility Restriction Message'
              instructions: 'Explain who may make an appointment at this location. Shown on the profile only when access is restricted.'
              if:
                restricted_access: 'equals true'
              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - anchor
              localizable: false
          -
            handle: accepting_new_patients_query
            field: uamsweb_common.true_false
            config:
              display: 'Is this location currently accepting new patients?'
              clearable: true
              validate:
                - required
          -
            handle: appointments_required_query
            field: uamsweb_common.true_false
            config:
              display: 'Is an appointment required for services rendered at this location?'
              clearable: true
              validate:
                - required
          -
            handle: appointments_schedule_query
            field: uamsweb_common.true_false
            config:
              display: 'Can a patient schedule an appointment for services rendered at this location?'
              clearable: true
              if:
                appointments_required_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: setting_up_appointment_info
            field: uamsweb_common.article
            config:
              display: 'Information on Setting up an Appointment'
              buttons:
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - anchor
              if:
                appointments_schedule_query: 'equals true'
              localizable: false
          -
            handle: bring_to_appointment_info
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'What to Bring to Your Visit'
              instructions: 'Leave empty to use the standard What to Bring copy from Find-a-Doc Settings. Enter content here only to override it for this location.'
              localizable: false
          -
            handle: expect_at_appointment_info
            field: uamsweb_common.article
            config:
              display: 'What to Expect at Your Visit'
              instructions: |-
                This section should ideally not contain headings. But if it does ...

                If "Information on Setting up an Appointment" or "What to Bring to Your Visit" has text, use Heading 4 and down. Otherwise, use Heading 3 and down.
              buttons:
                - h3
                - h4
                - h5
                - h6
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - anchor
              localizable: false
          -
            handle: what_to_expect_after
            field: uamsweb_common.article
            config:
              display: 'What to Expect After Your Appointment'
              instructions: 'Optional. What happens after the visit — follow-up, discharge, or next-step guidance. Leave blank to omit this section from the location profile.'
              buttons:
                - h3
                - h4
                - h5
                - h6
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - anchor
              localizable: false
          -
            handle: no_show_cancellation_late_policy
            field: uamsweb_common.article
            config:
              display: 'No Show, Cancellation and Late Arrival Policy'
              instructions: 'Optional. The policy patients should follow if they miss, cancel, or arrive late for an appointment. Leave blank to omit this section from the location profile.'
              buttons:
                - h3
                - h4
                - h5
                - h6
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - anchor
              localizable: false
  contact_information:
    display: 'Contact Information'
    sections:
      -
        fields:
          -
            handle: phone
            field: uamsweb_common_contact.phone
            config:
              display: 'General Information Phone Number'
              instructions: 'The phone number that patients can call for general information related to this location. Format the phone number as 999-999-9999.'
              validate:
                - required
          -
            handle: shared_phone_number
            field: uamsweb_common.true_false
            config:
              display: "Does this Arkansas Children's location use one phone number for both general information and appointments?"
              instructions: 'Turn on when the location publishes a single number for everything. The shared number is then used for both the information and appointment displays.'
              default: false
              if:
                brand_organization_query: 'equals true'
                brand_organization: 'contains b4446161-809f-48fd-8a58-a9c488e8ce67'
              validate:
                - required
                - sometimes
          -
            handle: shared_phone
            field: uamsweb_common_contact.phone
            config:
              display: 'Shared Phone Number'
              instructions: 'The single number used for both general information and appointments. Format the phone number as 999-999-9999.'
              if:
                shared_phone_number: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: conditional_phone_message_brand_organization_query
            field:
              type: html
              display: 'Empty Fields in the "Brand" Tab Are Hiding Additional Contact Information Fields'
              instructions: 'Set a value for the "Primary Brand Organization for This Location" field in the "Brand" tab to reveal the relevant contact information fields.'
              if_any:
                brand_organization_query: 'equals null'
              localizable: false
          -
            handle: conditional_phone_message_brand_organization
            field:
              type: html
              display: 'Empty Fields in the "Brand" Tab Are Hiding Additional Contact Information Fields'
              instructions: 'Set a value for the "Third-Party Brand Organization" field in the "Brand" tab to reveal the relevant contact information fields.'
              if:
                brand_organization_query: 'equals true'
                brand_organization: 'equals empty'
              localizable: false
          -
            handle: conditional_phone_message_appointments_query
            field:
              type: html
              display: 'Empty Fields in the "Appointment Information" Tab Are Hiding Additional Contact Information Fields'
              instructions: 'Set values for the required fields in the "Appointment Information" tab to reveal the relevant contact information fields.'
              if_any:
                appointments_schedule_query: 'equals null'
              localizable: false
          -
            handle: phone_appointment_query
            field: uamsweb_common.true_false
            config:
              display: 'Is there a separate appointment number for patients?'
              clearable: true
              if:
                appointments_schedule_query: 'equals true'
          -
            handle: ac_appointments_query
            field: uamsweb_common.true_false
            config:
              display: "Does this Arkansas Children's location have separate phone numbers for primary care appointments and specialty care appointments?"
              if:
                brand_organization_query: 'equals true'
                brand_organization: 'contains b4446161-809f-48fd-8a58-a9c488e8ce67'
                appointments_schedule_query: 'equals true'
                phone_appointment_query: 'equals true'
              validate:
                - required
                - sometimes
          -
            handle: ac_appointments_primary
            field: uamsweb_common_contact.phone
            config:
              display: "Arkansas Children's Primary Care Appointments Phone Number"
              instructions: 'Leave empty to use the standard Arkansas Children''s primary-care number from Find-a-Doc Settings. Enter a number here only to override it for this location.'
              if:
                brand_organization_query: 'equals true'
