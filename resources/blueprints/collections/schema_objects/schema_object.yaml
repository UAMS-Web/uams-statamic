title: 'Schema Object'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: false
              display: Title
              localizable: false
              validate:
                - required
          -
            handle: source_site
            field:
              max_items: 1
              type: sites
              display: 'Source Site'
              instructions: 'If a site is selected, variables will be localized to the selected site by calling the `source_site` variable.'
              localizable: false
          -
            handle: inherit_from
            field:
              type: entries
              display: 'Also inherit from'
              instructions: 'Additional schema objects from which to inherit properties. Unset properties are filled from these entries (after the parent). Order matters: earlier entries are overridden by later ones and by this entry''s own values.'
              collections:
                - schema_objects
              localizable: false
      -
        display: 'Schema.org Data'
        instructions: 'Select a Schema.org type (e.g., Thing, Person, Organization) and fill in the properties for that type.'
        fields:
          -
            handle: schema
            field:
              type: schema_object
              display: 'Schema.org Object'
              hide_display: true
              localizable: false
              validate:
                - required
