  pest-report:
    name: Pest (parallel band report)
    runs-on: ubuntu-latest
    # Merges the four shards' reports into the one parallel band report the two
    # band checks read, and refuses a band the shards did not run exactly once
    # (#387). Both checks judge the WHOLE band: the skip baseline is a count for
    # the whole band, and the slowest class is judged by its share of the whole
    # band's time. Fed one shard's report, the first compares a quarter of the
    # band with a whole-band baseline and the second divides by a quarter of the
    # band, so neither runs in a shard.
    #
    # The one `needs:` edge in this file, and the reason it is allowed: this job
    # reads the shards' output, so it cannot run before them. It skips when any
    # shard fails, as the checks below skipped in the single job when the band
    # failed; the failed shard already fails the run.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    needs: pest
    if: vars.RUN_REMOTE_CI != 'false'
    env:
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v7

      # Reading XML only: no extensions beyond setup-php's defaults, which include
      # dom, and no Composer install.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Download the shards' reports
        uses: actions/download-artifact@v8
        with:
          pattern: pest-shard-*
          path: shards
          merge-multiple: true

      # Writes junit-parallel.xml, the band report the checks below read, and the
      # per-class timings the next run balances its shards on. Fails, naming what
      # it found, when a shard's files are missing, the shards read different
      # timings or listed different tests, a case ran in two shards, or a class's
      # case count differs from the listing. PHP, not Node, like the checks.
      # REMOTE-ONLY: the local runner writes junit-parallel.xml from one band.
      - name: Merge the shard reports into the parallel band report
        run: php scripts/merge-shard-reports.php --dir=shards --total="$SHARD_TOTAL" --report=junit-parallel.xml --timings=tests/.pest/shards.json

      # A band that silently skips tests reports PASS having tested less than it
      # should have. Skips are how this suite degrades when content or Stache state
      # is unavailable (UAMS-Web/uams-statamic-archive#1738, UAMS-Web/uams-statamic-archive#1740) — deliberate, but invisible to the gate until
      # now. During UAMS-Web/uams-statamic-archive#1726's validation three tests self-skipped and the band still
      # passed, caught only because the count had been predicted by hand. The
      # baseline lives in tests/skip-baseline.json so raising it is a reviewable act.
      # PHP, not Node: this job sets up PHP but not Node. (local-ci.mjs additionally
      # tolerates the guard being absent, since it validates older branches too; CI
      # only ever runs a branch's own workflow, so no counterpart is needed here.)
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check skip baseline (parallel band)
        run: php scripts/check-skip-baseline.php --report=junit-parallel.xml --band=parallel

      # Nothing pinned what the parallel band COSTS, so a change that reclaimed it
      # passed in silence — the gate reports PASS on any duration. It has happened
      # twice: UAMS-Web/uams-statamic-archive#1348 added one `sitemap.xml` route per site (255 on this multisite)
      # and uncached URL generation taxed the render-heavy suite ~2x (UAMS-Web/uams-statamic-archive#1521 →
      # UAMS-Web/uams-statamic-archive#1573), and one class grew to 1085.3s of a 1306s band while eleven of twelve
      # workers idled (UAMS-Web/uams-statamic-archive#1797). Both were found by hand, long after the fact.
      #
      # Guards the slowest CLASS by its SHARE of the band's summed class time, plus
      # a generous absolute backstop. A JUnit `time` is wall-clock per test, so raw
      # class seconds inflate with runner load exactly as band wall time does
      # (UAMS-Web/uams-statamic-archive#2530); a share cancels that inflation, and is what decides whether a class
      # bounds the band, since paratest distributes by class. Reads the reports
      # the two steps above already produced, so it costs no extra run. PHP, not
      # Node, for the same reason as the skip guard: this job sets up PHP only.
      # (local-ci.mjs additionally tolerates the guard being absent, since it
      # validates older branches too.)
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check slowest class (parallel band)
        run: php scripts/check-slowest-class.php --report=junit-parallel.xml --band=parallel

      # The timings a pull request's shards read: written on each push to main,
      # under a key unique to the run, and read back by prefix (see "Restore shard
      # timings"). Never written by a pull request, so a branch cannot change the
      # partition another branch reads. The committed fallback,
      # .github/pest-shards.json, is refreshed by hand from this artifact when the
      # cache is empty for long enough to matter.
      # REMOTE-ONLY: the local runner does not shard.
      - name: Save shard timings for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: tests/.pest/shards.json
          key: pest-shard-timings-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the band report and timings
        uses: actions/upload-artifact@v7
        with:
          name: pest-parallel-band
          path: |
            junit-parallel.xml
            tests/.pest/shards.json
          if-no-files-found: error
          retention-days: 14

  pint:
    name: Pint (changed files)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after the Vite build.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # `ext-imagick` is a declared platform requirement in composer.json, so
          # every `composer install` below platform-checks it (UAMS-Web/uams-statamic-archive#1830). See
          # README_Imagick.md for the manual developer install.
          extensions: imagick
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      # A bare `pint --test` is NOT a substitute for the diff below, and its
      # `0 dirty` is not evidence the tree is clean (UAMS-Web/uams-statamic-archive#2341). Pint's own finder
      # does not descend into dot-directories; the git pathspec here does.
      # Measured with both arms at one moment, two tracked files dirty on disk:
      #   vendor/bin/pint --test               "result":"passed"  exit 0
      #   vendor/bin/pint --test <those paths> "result":"fail"    exit 1
      # The explicit arm failing at the same instant is what makes the bare run's
      # `passed` readable as blindness rather than cleanliness. A whole-tree sweep,
      # if one is ever wanted, must enumerate with `git ls-files -- '*.php'`.
      - name: Determine changed PHP files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.php' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed PHP files: ${files:-<none>}"

      # PARITY: mirrored by scripts/gate-pint.mjs (same
      # diff-filter=ACMR, origin/<base>...HEAD, *.php scope). This step passes
      # the whole changed-file list as one argv because the Ubuntu runner allows
      # a ~2 MB command line; local-ci.mjs additionally chunks the list so a
      # large diff can't overflow Windows' ~32 KB cap (UAMS-Web/uams-statamic-archive#1079).
      - name: Run Pint on changed files
        if: steps.changed.outputs.files != ''
        run: vendor/bin/pint --test ${{ steps.changed.outputs.files }}

      - name: Skip notice
        if: steps.changed.outputs.files == ''
        run: echo "No PHP files changed in this PR/push; skipping Pint."

  rector:
    name: Rector (gating profile)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after Pint. Pint MUST come first there, because the two tools
    # rewrite the same files, and rector.php sets `removeUnusedImports: false`
    # because Rector's remover is not `{@see}`-aware, leaving Pint the sole owner
    # of that operation (UAMS-Web/uams-statamic-archive#1131).
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Rector is a static analyzer: it reads source and resolves classes through
    # the Composer autoloader, so it needs vendor/ but NOT an .env, an app key,
    # a database, Node, or the content/ submodule. `withComposerBased(laravel:,
    # pest:)` in rector.php reads the *installed* package versions to pick its
    # version-gated Laravel/PHPUnit sets, which is why the install must run first.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sqlite3, dom, gd, fileinfo, bcmath, imagick
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      # PARITY: mirrored by scripts/gate-rector.mjs (same gating
      # profile, same --dry-run, same private TMPDIR).
      #
      # The private temp dir is load-bearing, not hygiene. Rector's file cache
      # (sys_get_temp_dir()/rector_cached_files) does NOT key on the active rule
      # set, so a warm cache written by a different profile makes a later run
      # silently UNDER-report — measured while building UAMS-Web/uams-statamic-archive#1720: 124 files cold
      # versus 92 warm. Under-reporting is a false GREEN, so a gate reusing a
      # warm cache can pass on a backlog it never re-analyzed. A fresh dir starts
      # empty, so no `--clear-cache` (which would race a concurrent Rector) is
      # needed. PHP reads TMPDIR on Linux; TMP/TEMP are set too so the one
      # command is portable, matching tests/Feature/RectorProfileSplitTest.php.
      - name: Run Rector (gating profile, dry-run)
        run: |
          RECTOR_TMP="$(mktemp -d)"
          TMPDIR="$RECTOR_TMP" TMP="$RECTOR_TMP" TEMP="$RECTOR_TMP" \
            vendor/bin/rector --dry-run --no-progress-bar

  mutate:
    name: Mutation tooling smoke
    runs-on: ubuntu-latest
    # Local-chain cost rank: after Rector. Cheap (~9s of work) so it sits ahead
    # of the two 2-min+ jobs there.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # This gates the mutation TOOLING, not the mutants. UAMS-Web/uams-statamic-archive#1728 was not a mutant
    # escaping a weak test — it was `pest-plugin-mutate` silently reporting
    # `0 Mutations for 0 Files created` after a `php-code-coverage` bump, which
    # Pest exits 0 on, so nothing anywhere went red. The adversarial-review rule
    # leans on this tool, and until now no gate exercised it at all.
    #
    # Runs one narrowly-scoped mutation pass over a pure, fully-covered class:
    # vendor/ but no .env, no app key, no database, no Node, no content/
    # submodule. Real, diff-scoped mutation runs stay AUTHOR-SIDE by design —
    # see tests/README.md and .claude/rules/adversarial-review.md.
    steps:
      - uses: actions/checkout@v7

      # `coverage: pcov` is the one line that separates this job from rector's
      # setup, and it is not optional: --mutate needs a coverage driver, and
      # without one the plugin reports 0 mutations — the exact false green this
      # job exists to catch. PCOV over Xdebug for speed (coverage-only driver).
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sqlite3, dom, gd, fileinfo, bcmath, imagick
          coverage: pcov
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      # PARITY: mirrored by the mutate job in scripts/local-ci.mjs (same test,
      # same --path/--class scoping, same coverage-driver probe ahead of the run,
      # same two assertions).
      #
      # The exit code alone is NOT sufficient. Pest exits 0 on
      # `0 Mutations for 0 Files created`, so the count and the score are both
      # parsed out of the plugin's own summary. ANSI is stripped before matching
      # because those lines are color-wrapped and an escape-anchored grep reads
      # as a clean miss rather than a parse failure.
      #
      # WHY THIS CLASS: AlertSiteKeyResolver is small, pure, fully covered, and
      # has a mutable surface (8 mutants across ternaries, a foreach, boolean
      # operators and an early return) that a refactor is unlikely to drain to
      # zero — and if one ever does, the count assertion turns this red instead
      # of letting it pass as a silent no-op. It is also the class UAMS-Web/uams-statamic-archive#1730 used to
      # verify the fix for UAMS-Web/uams-statamic-archive#1728, so these numbers are comparable to that ticket.
      - name: Run the mutation-tooling smoke
        run: |
          set -o pipefail

          # Refuse before Pest when no coverage driver is active (UAMS-Web/uams-statamic-archive#3213), with a
          # message that names it rather than the generic no-summary line. The
          # probe mirrors COVERAGE_DRIVER_PROBE in scripts/local-ci.mjs.
          DRIVER="$(php -r 'echo extension_loaded("pcov") && filter_var(ini_get("pcov.enabled"), FILTER_VALIDATE_BOOLEAN) ? "pcov" : (extension_loaded("xdebug") && str_contains((string) ini_get("xdebug.mode"), "coverage") ? "xdebug" : "none");')"
          if [ "$DRIVER" = none ]; then
            echo "::error::No coverage driver is active in this PHP (PCOV, or Xdebug with xdebug.mode including coverage), so the mutation run cannot start. This is a workstation condition, not a branch defect, and it is not a pass. See .claude/skills/pcov-setup/SKILL.md."
            exit 1
          fi

          vendor/bin/pest tests/Unit/Support/UamsAlert/AlertSiteKeyResolverTest.php \
            --mutate --path=app/Support/UamsAlert \
            --class="App\Support\UamsAlert\AlertSiteKeyResolver" \
            --covered-only 2>&1 | tee mutate.log
          PLAIN="$(sed -r 's/\x1b\[[0-9;]*m//g' mutate.log)"

          if ! grep -qiE '[1-9][0-9]* Mutations? for [1-9][0-9]* Files? created' <<<"$PLAIN"; then
            echo "::error::The mutation tooling found nothing to mutate. This is the UAMS-Web/uams-statamic-archive#1728 false green, not a pass."
            grep -iE 'Mutations? for .* Files? created' <<<"$PLAIN" || echo "No mutation summary line was printed at all."
            exit 1
          fi

          if ! grep -qE 'Score:[[:space:]]+100\.00%' <<<"$PLAIN"; then
            echo "::error::Mutation score is below 100% on the smoke's subject."
            grep -E 'Score:' <<<"$PLAIN" || true
            exit 1
          fi

  phpstan:
    name: Larastan (PHPStan)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after the mutation smoke; the two 2-min+ jobs come last there.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Larastan boots the Laravel app — vendor/larastan/larastan/bootstrap.php
    # runs the console kernel — to resolve container bindings and facade/model
    # types, so this job needs the same .env + app key + post-autoload-dump
    # framework prep as the pest job. It does NOT need the content/ submodule,
    # Node, or a warmed stache: PHPStan reads source, not content, and analyzes
    # app/ and tests/ (see phpstan.neon.dist). composer stan pins --memory-limit=2G.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sqlite3, dom, gd, fileinfo, bcmath, imagick
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      # PARITY: mirrored by the phpstan job in scripts/local-ci.mjs
      - name: Run Larastan
        run: composer stan

  build:
    name: Vite build
    runs-on: ubuntu-latest
    # Local-chain cost rank: after the JS unit tests.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7

      # `vite.config.js` imports `@statamic/cms/vite-plugin`, which is provided
      # by the Statamic vendor (under vendor/statamic/cms/packages/cms after
      # `composer install`). The build job therefore needs PHP + composer too.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # `ext-imagick` is a declared platform requirement in composer.json, so
          # every `composer install` below platform-checks it (UAMS-Web/uams-statamic-archive#1830). See
          # README_Imagick.md for the manual developer install.
          extensions: imagick
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by assertNpmFloor() in scripts/local-ci.mjs
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # PARITY: mirrored by the build job in scripts/local-ci.mjs
      - name: Build site assets
        run: npm run build

      - name: Build CP assets
        run: npm run cp:build

  js:
    name: JS unit tests (Vitest)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after spell.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Framework-free: the unit suite (e.g. the coordinate parser) runs on a
    # standalone vitest.config.js, so it needs Node + `npm ci` but no PHP,
    # Composer, or content submodule.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by assertNpmFloor() in scripts/local-ci.mjs
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # PARITY: mirrored by the js job in scripts/local-ci.mjs
      - name: Run JS unit tests
        run: npm run test:js

  spell:
    name: Spell check (cspell)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after the encoding guard.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Blocking gate (UAMS-Web/uams-statamic-archive#1541): the dictionary is clean (0 hits), so a spelling issue
    # fails the job. In scripts/local-ci.mjs, where the cost-ordered chain still
    # runs, a typo skips (and never bills) js, build, pint, phpstan, Pest and the
    # browser smoke; here every job runs in parallel, so it fails this job alone.
    # Framework-free and cheap: Node + the
    # cspell CLI, no PHP, Composer, or content submodule. It supersedes the earlier
    # advisory (`continue-on-error`) phase from UAMS-Web/uams-statamic-archive#1018.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by assertNpmFloor() in scripts/local-ci.mjs
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # PARITY: mirrored by the spell job in scripts/local-ci.mjs (advisory).
      - name: Run cspell
        run: npm run spell

  browser:
    name: CP browser smoke (Pest + Playwright)
    runs-on: ubuntu-latest
    # Local-chain cost rank: LAST, the most expensive job. Here it runs in
    # parallel with the rest.
    # Runs on every PR, like every other job here. The `browser-tests` label gate
    # this job used to carry was REMOVED in UAMS-Web/uams-statamic-archive#1727, along with the opt-in framing
    # in the local-ci mirror.
    #
    # WHY: four CP smokes sat red on `main` for eleven days (2026-07-17 ->
    # 07-28) and no gate reported it. The cause was not cost — the opt-in worked
    # exactly as designed; it just needed a human to remember, and for eleven
    # days nobody did. A label is the same bet on memory, so keeping it here
    # would leave the remote path able to reproduce the identical gap the moment
    # RUN_REMOTE_CI is switched back on. Budget is already handled by the
    # kill-switch below, which is the right lever for cost — a per-suite label
    # is not.
    #
    # `workflow_dispatch` is kept (see the `on:` block) so the job can still be
    # run on demand against a branch; it is no longer the only way in.
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7

      # The served application boots from the same three submodules the `pest`
      # job checks out: collection and asset-container configs in `content/`, the
      # Control Panel login user in `users/`, and the form configurations in
      # `resources/forms/`. Without them every smoke stops at the login screen
      # and fails on whatever it reaches first (#378); tests/Pest.php now refuses
      # the run and names what is missing instead. Same token wiring as `pest`.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sqlite3, dom, gd, fileinfo, bcmath, imagick
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      # The framework has to be booted: `.env` + app key, plus `statamic:install`
      # (run by post-autoload-dump) to publish the Statamic core CP assets the
      # served Control Panel loads.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by assertNpmFloor() in scripts/local-ci.mjs
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # `--with-deps` also installs the Linux system libraries Chromium needs on
      # the runner. (local-ci.mjs omits `--with-deps` — it is a no-op off Linux.)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # tests/Browser also holds front-end theme smokes (the KB rating
      # active-state, the uams_2020 runtime-JS smoke) that load the compiled
      # `public/build` bundle from its Vite manifest. Each CI job is a fresh
      # runner — the `build` job's `public/build` is not shared here — so this
      # job builds the front-end bundle itself, not only the CP bundle below.
      - name: Build front-end assets
        run: npm run build

      # Our custom CP fieldtype components live in this bundle; without it the
      # smoked fieldtype would be unregistered and error in the Control Panel.
      - name: Build CP assets
        run: npm run cp:build

      # PARITY: mirrored by scripts/gate-browser.mjs.
      # tests/Browser holds the CP smokes and the axe-core accessibility gate
      # (UAMS-Web/uams-statamic-archive#1046), which fails on serious/critical WCAG violations.
      - name: Run CP browser smokes + accessibility gate
        run: vendor/bin/pest tests/Browser

  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ubuntu-latest
    # Local-chain position: second. `composer validate` measured ~1.5s against the
    # isolation guard's ~0.8s. The PSR-4 class check added in #322 scans `vendor/`
    # on a local run and took 23s on a loaded Windows machine, so the job is no
    # longer second by cost; it stays here because it needs no install and fails
    # before the later jobs spend real time. Here every job runs in parallel and
    # nothing is gated.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when `composer.lock` no longer matches `composer.json` —
    # the content-hash drift a `composer.json` edit leaves behind when the lock
    # is not refreshed (UAMS-Web/uams-statamic-archive#1726 renamed the root package, UAMS-Web/uams-statamic-archive#1728 added an
    # `extra.patches` entry; both shipped a lock keyed to the pre-change file).
    # Nothing breaks outright, but every `composer install` on every machine then
    # warns "The lock file is not up to date with the latest changes in
    # composer.json" forever, and warning noise is how real warnings get ignored.
    # The second step fails on a class whose file does not match its PSR-4 path.
    # Dependency-free: composer reads the two files and scans the source trees
    # directly, so this needs no `composer install`, no content submodule, and no
    # framework boot.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # `--no-check-publish --no-check-all` scopes this to the checks that apply
      # to an application rather than a published package. They do NOT change
      # pass/fail: bare `composer validate` also exits 0 here and 2 on a stale
      # lock, because warnings only fail under `--strict`. What they change is the
      # OUTPUT — `--no-check-all` drops the "exact version constraints should be
      # avoided" advice against the `statamic/cms`, `statamic/eloquent-driver`,
      # and `studio1902/statamic-peak-tools` pins the dependency-update chore sets
      # deliberately, and `--no-check-publish` declares this a project rather than
      # a package so publish-readiness can never start failing it. Warning noise
      # against deliberate choices is what trains people to ignore gate output,
      # which is the failure this job exists to prevent.
      # Deliberately NOT `--strict`: it exits 1 on a clean checkout even with both
      # flags, because "No license specified" is a general warning that
      # `--no-check-publish` does not suppress. Exit codes verified here: 0 on a
      # clean checkout, 2 once the lock hash goes stale.
      # PARITY: mirrored by the validate job in scripts/local-ci.mjs
      - name: Run composer validate
        run: composer validate --no-check-publish --no-check-all

      # Fails on a class whose file does not match its PSR-4 path: an inline class
      # in a test file, or a misnamed one in `app/`. Pest loads such a class only
      # because the file happens to run, and Composer drops it from the optimized
      # classmap with a warning that fails nothing (#322). `--dev` is required:
      # with no `vendor/` Composer treats the install as non-dev and skips
      # `autoload-dev`, so `tests/` is never scanned and the check passes on
      # anything. `--dry-run` writes no autoload files.
      # PARITY: mirrored by the validate job in scripts/local-ci.mjs
      - name: Run PSR-4 class check
        run: composer dump-autoload --optimize --dev --strict-psr --dry-run --no-scripts

  no-emoji-guard:
    name: No-emoji guard (durable records)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after the composer.lock validation and BEFORE the
    # encoding guard, which is the first job that costs real time (it runs
    # `composer install`). This one is a pure file scan needing only Node, so
    # locally a glyph fails the build without ever billing an install.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when a durable record carries an emoji code point, per
    # .claude/rules/no-emoji-in-durable-records.md (UAMS-Web/uams-statamic-archive#2234). The rule was
    # documented and unenforced: no job looked for a glyph, so the corpus could
    # drift with nothing reporting it. Scope is the paths the rule names --
    # .claude/, docs/ and README.md -- and deliberately not app/, tests/ or
    # resources/, which the rule does not reach in this repository.
    #
    # The scanner is Node rather than a shell one-liner on purpose: a `perl -ne`
    # range scan matches NOTHING without `-CSD` -- no error, exit 0, an accurate
    # file count -- which is how the local-CI glyph probe read zero on every pull
    # request for a night. Node decodes UTF-8 natively, so that class cannot arise.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # PARITY: mirrored by the no-emoji job in scripts/local-ci.mjs
      - name: Run no-emoji guard
        run: node scripts/check-no-emoji.mjs

  content-pointer-guard:
    name: Submodule pointer guard (each on its main)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after the no-emoji guard and BEFORE the encoding
    # guard, the first job that runs `composer install`. It needs only git and Node.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when any submodule gitlink of the validated commit names a
    # commit that is not on that submodule's `main` (UAMS-Web/uams-statamic-archive#2965; every declared
    # submodule since UAMS-Web/uams-statamic-archive#3115, the asset ones included). Such a pointer resolves for
    # whoever has the companion branch fetched and fails for everyone else, a
    # fresh clone and this workflow's pest job included, and it silently undoes
    # itself when the branch is deleted. UAMS-Web/uams-statamic-archive#2863 merged that way. An unchanged
    # pointer passes without a fetch; a moved one costs a bare clone of its
    # repository.
    # Exit 1 is "not on main", 3 is "not present at all", 2 is "could not run",
    # and every one of them fails the step.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The base the pointer is compared with: the pull request's base branch, the
      # previous commit on a push to main (a squash merge is one commit), and main
      # on a manual run, which can be on a branch several commits past its bump.
      # HEAD~1 there would read an earlier bump as unchanged; local-ci compares
      # with origin/main, so the two agree.
      - name: Determine the base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Each moved submodule's clone authenticates through an insteadOf rewrite, as
      # the pest job's submodule checkout does; `gh` uses the same token to name the
      # submodule pull request to land first.
      # PARITY: mirrored by the content-pointer job in scripts/local-ci.mjs
      - name: Run content pointer guard
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git config --global "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf" https://github.com/
          node scripts/check-content-pointer.mjs --base "${{ steps.base.outputs.ref }}"

  encoding-guard:
    name: Encoding guard (Windows-1252 double-encoding)
    runs-on: ubuntu-latest
    # Local-chain cost rank: after the content pointer guard.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails fast if any tracked file contains the cp1252-double-encoded UTF-8
    # byte sequences that produced PRs UAMS-Web/uams-statamic-archive#739, UAMS-Web/uams-statamic-archive#740, UAMS-Web/uams-statamic-archive#741, UAMS-Web/uams-statamic-archive#742 (see
    # joshdaugherty/ipa-unicode-inventory#1 for the full pattern). The script
    # ships with the inventory composer package as of v1.6.2 (see
    # joshdaugherty/ipa-unicode-inventory#4) — we invoke the vendored copy
    # so its detection logic stays in lockstep with the package version we
    # pin. content/ is not initialized — git ls-files does not descend into
    # submodules, so this job naturally scopes to the umbrella repo.
    # Despite the name, the job also runs the other sub-second guards below, ending
    # with the release-notes generator suite (UAMS-Web/uams-statamic-archive#2850), so read the failing step's name.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # `ext-imagick` is a declared platform requirement in composer.json, so
          # every `composer install` below platform-checks it (UAMS-Web/uams-statamic-archive#1830). See
          # README_Imagick.md for the manual developer install.
          extensions: imagick
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # PARITY: mirrored by the encoding job in scripts/local-ci.mjs
      - name: Run encoding guard
        run: node vendor/joshdaugherty/ipa-unicode-inventory/scripts/check-double-encoding.mjs

      # PARITY: mirrored by the encoding job in scripts/local-ci.mjs.
      # Added here rather than as a thirteenth job (UAMS-Web/uams-statamic-archive#2236): it reads one tracked
      # file, needs no install, and belongs beside the other file-content guard.
      - name: Run decision-log order guard
        run: node scripts/check-decision-log-order.mjs

      # PARITY: mirrored by the encoding job in scripts/local-ci.mjs.
      # Reports `@pest-mutate-ignore` annotations that suppress nothing (UAMS-Web/uams-statamic-archive#2316).
      # An inert one is invisible by construction: the mutant simply keeps
      # surviving, which reads as a wrong reason rather than as an annotation
      # that never applied, so nothing is ever red to point at it.
      #
      # Here rather than in a fourteenth job, extending UAMS-Web/uams-statamic-archive#2236's reasoning rather
      # than contradicting it. That note declined a job for a guard needing no
      # install; this one DOES read `vendor/pestphp/pest-plugin-mutate` for the
      # mutator names it validates against — and this job has already installed,
      # so folding it in costs nothing while a separate job would duplicate the
      # whole setup-php-cache-auth-install preamble to run a sub-second script.
      # Third of thirteen in a chain that is explicitly cost-ordered, so it still
      # fails before spell, js, build, pint, rector, mutate, phpstan and pest.
      #
      # Non-zero of ANY kind fails the step, which is the point rather than an
      # incidental: the auditor exits 2 when it cannot run at all (the plugin
      # missing), and treating that as a pass would restore exactly the silent
      # false-clean this guard exists to close.
      #
      # It tokenizes every file under app and tests, which needs more than 128M.
      # This CLI's memory_limit is the -1 (unlimited) default, so the step passes
      # no limit; the local runner gives this and every other PHP process it
      # starts LOCAL_CI_PHP_MEMORY_LIMIT, because a local PHP may cap lower (UAMS-Web/uams-statamic-archive#3212).
      - name: Run mutate-ignore auditor
        run: php scripts/check-mutate-ignore.php app tests

      # Counts how many mutants each `@pest-mutate-ignore` annotation removes (UAMS-Web/uams-statamic-archive#3160),
      # which the auditor above cannot see: breadth is a property of the AST, not of the
      # line. Fails on an annotation that removes more than one mutant of a named mutator
      # or none at all, unless the committed baseline lists it, and on a baseline entry
      # that no longer occurs. Exits 2 when it cannot run, which fails the step too. About
      # a minute over app and tests, measured on macOS; it reuses this job's install.
      # PARITY: mirrored by the encoding job in scripts/local-ci.mjs.
      - name: Run mutate-ignore breadth check
        run: php scripts/check-mutate-ignore-breadth.php --baseline=scripts/check-mutate-ignore-breadth.baseline.json app tests

      # Rejects a raw 0x0D that is not part of a CRLF pair (UAMS-Web/uams-statamic-archive#2495). `eol=lf` normalizes
      # CRLF and never sees a lone CR, and Pint passes it through untouched, so the class
      # reaches `main` past both. Beside the other file-content guards by UAMS-Web/uams-statamic-archive#2236's
      # reasoning: tracked files only, no install, sub-second.
      - name: Run lone-CR guard
        run: node scripts/check-lone-cr.mjs

      # PARITY: mirrored by the encoding job in scripts/local-ci.mjs.
      # Runs the unittest suite the shared `writing-release-notes` skill ships beside
      # `gen_release_notes.py` (UAMS-Web/uams-statamic-archive#2850). Nothing ran it, so release-notes coverage rested
      # on repo-local Pest guards written against an interface the shared script no
      # longer has. Beside the other guards by UAMS-Web/uams-statamic-archive#2236's reasoning: offline, no install,
      # no content, about a second. `python3` comes with the runner image, so no setup
      # step. unittest exits 1 on any failure or error, which fails the step.
      - name: Run release-notes generator suite
        run: python3 .claude/skills/writing-release-notes/gen_release_notes.test.py

  test-isolation-guard:
    name: Test isolation guard (parallel-safety)
    runs-on: ubuntu-latest
    # First (fastest) link in scripts/local-ci.mjs's cost-ordered chain, where a
    # failure here skips, and never bills, the entire rest of the pipeline. Here
    # it runs in parallel with every other job; see the fan-out note in the header.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when a test uses a parallel-unsafe, shared-state pattern
    # (a `Storage::persistentFake` disk, or a hardcoded `framework/testing` path with no
    # per-worker uniqueness token) without quarantining it into the `serial`
    # group — the flake class that keeps surfacing under `pest --parallel`
    # (UAMS-Web/uams-statamic-archive#1136, UAMS-Web/uams-statamic-archive#1149). A pure static scan of tests/, dependency-free: it needs
    # only PHP — no composer install, no content submodule, no framework boot.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # PARITY: mirrored by the isolation job in scripts/local-ci.mjs
      - name: Run test isolation guard
        run: php scripts/check-parallel-safe-tests.php

      # Global-scope test symbols (UAMS-Web/uams-statamic-archive#3112): a `const` or `function` declared in more
      # than one namespace-less file, and a single-segment `use X;` with no named
      # namespace. The shared pest-testing script; formerly Rules C and D above.
      # PARITY: mirrored by the isolation job in scripts/local-ci.mjs
      - name: Run global test symbol check
        run: php .claude/skills/pest-testing/scripts/check-global-test-symbols.php tests
