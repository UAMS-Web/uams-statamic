title: 'Reusable Basic Page Content'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: false
              validate:
                - required
          -
            handle: content
            field: uamsweb_common.article_with_sets
            config:
              display: Content
              localizable: false
              validate:
                - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  computed:
    display: Computed
    sections:
      -
        fields:
          -
            import: uamsweb_computed_content_usage
