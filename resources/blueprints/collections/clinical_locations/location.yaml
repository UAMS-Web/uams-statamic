  mychart_scheduling:
    display: 'MyChart Scheduling'
    sections:
      -
        fields:
          -
            handle: mychart_scheduling_query
            field: uamsweb_common.true_false
            config:
              display: 'Enable MyChart Scheduling?'
              instructions: 'Check with the MyChart team before doing anything here. MyChart open scheduling must also be enabled site-wide in Find-a-Doc Settings (MyChart Open Scheduling); when it is off site-wide, this location-level setting has no effect.'
              default: false
              validate:
                - required
          -
            handle: mychart_scheduling_title_general
            field:
              placeholder: 'Schedule an Appointment Online'
              type: text
              display: 'Appointment Section Title (Optional Override)'
              instructions: |-
                If there are multiple scheduling widgets, this will define the text used in the main section heading. If you do not define a value here, "Schedule an Appointment Online" will be used.

                If you define a value here, use a very short phrase that makes the purpose of the online scheduling section clear to the user. Do not just use the name of a condition or treatment.

                If there is only one scheduling widget, the heading will be defined by a value from within the *MyChart Open Scheduling Widget(s)* repeater instead.
              if:
                mychart_scheduling_query: 'equals true'
              localizable: false
          -
            handle: mychart_scheduling_intro_general
            field:
              placeholder: 'Use your UAMS Health MyChart account to schedule an appointment at this clinic. If you are not a MyChart user, you can continue as a guest.'
              type: textarea
              display: 'Appointment Section Introduction (Optional Override)'
              instructions: |-
                This paragraph introduces the online scheduling section. If you do not define a value here, it will display "Use your UAMS Health MyChart account to schedule an appointment at this clinic. If you are not a MyChart user, you can continue as a guest."

                The paragraph should provide brief general information about MyChart open scheduling.

                There is a 221-character limit.
              if:
                mychart_scheduling_query: 'equals true'
              character_limit: 221
              localizable: false
          -
            handle: mychart_scheduling_options
            field:
              type: replicator
              display: 'MyChart Open Scheduling Widget Option(s)'
              instructions: 'Define the information for each specific open scheduling widget. One or more must be defined.'
              button_label: 'Add Scheduling Option'
              validate:
                - required
                - sometimes
              if:
                mychart_scheduling_query: 'equals true'
              localizable: false
              sets:
                new_set_group:
                  display: 'New Option Group'
                  sets:
                    new_set:
                      display: 'New Option'
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: 'Standalone Heading Text'
                            instructions: |-
                              If this is the only scheduling widget, this value will replace the main section heading (defined by *Appointment Section Title*).

                              Use a very short phrase that makes the purpose of this specific scheduling widget clear to the user. Do not just use the name of a condition or treatment.
                            validate:
                              - required
                        -
                          handle: intro
                          field:
                            character_limit: 221
                            type: textarea
                            display: 'Standalone Appointment Section Introduction (Optional Override)'
                            instructions: |-
                              If this is the only scheduling widget, you can define a value here to replace the main section introduction (defined by *Appointment Section Introduction*) if that general introduction does not adequately introduce this specific widget.

                              If used, this paragraph should provide general information about MyChart open scheduling and a brief overview of anything necessary for users to know about this specific scheduling widget.

                              There is a 221-character limit.
                        -
                          handle: item_title_nested
                          field:
                            type: text
                            display: 'Nested Heading Text'
                            instructions: |-
                              If this is one of multiple scheduling widgets, this field defines the text of the heading immediately preceding this specific scheduling widget. This heading will be nested below the main section heading (defined by *Appointment Section Title*) in the heading outline. This will also set the label of the multiple-choice option the user can select to display this specific scheduling widget.

                              Use a very short phrase, a visit type name or a treatment name that makes the purpose of this specific scheduling widget clear to the user.
                            validate:
                              - required
                        -
                          handle: item_intro_nested
                          field:
                            character_limit: 221
                            type: textarea
                            display: 'Nested Appointment Section Introduction (Optional)'
                            instructions: |-
                              If this is one of multiple scheduling widgets, this field defines the paragraph introducing this specific scheduling widget. If used, this paragraph will not need to cover information addressed in the *Appointment Section Introduction* field but should provide a brief overview of any information necessary for users to know about this specific scheduling widget.

                              There is a 221-character limit.
                        -
                          handle: vt
                          field:
                            type: text
                            display: 'Visit Type (PRC) ID from Epic'
                            instructions: 'A single visit type available for scheduling in this specific widget.'
                            validate:
                              - required
                        -
                          handle: ser
                          field:
                            type: text
                            display: 'Provider (SER) ID from Epic'
                            instructions: |-
                              ID for one or more providers available for scheduling in this specific widget. Separate multiple values with a comma (<code>,</code>).

                              If you specify a department, you *can* omit the list of provider IDs so all providers who are enabled for open scheduling in that department with that visit type are automatically included in the widget.

                              **Be sure to include an ID for either a provider or a department (or both). Otherwise, *all* providers and departments with that visit type will be displayed.**
                        -
                          handle: dep
                          field: uamsweb_common_fad.epic_dep_ids
                          config:
                            display: 'Department (DEP) ID(s) from UAMS Health Epic'
                            validate:
                              - 'dep_in_declared_list:epic_dep_ids'
                            instructions: |-
                              The departments available for scheduling in this specific widget. Each must be one of the location's Department (DEP) IDs (declared in General Details).

                              If you specify a provider, you *can* omit the departments so all departments enabled for open scheduling with that provider and visit type are automatically included in the widget.

                              **Be sure to include either a provider or a department (or both). Otherwise, *all* providers and departments with that visit type will be displayed.**
                        -
                          handle: fallback
                          field: uamsweb_common.article
                          config:
                            display: 'Fallback Information'
                            instructions: |-
                              This is an optional paragraph that appears after this specific scheduling widget where you can present users an alternative scheduling options. Keep it as brief as possible, limiting it to one to three sentences in a single paragraph. Add tel links to any phone number (e.g., <code>tel:501-555-6162</code>).

                              Example Paragraph: "If you are unable to register for your appointment using the method above, call 501-555-6162 to schedule an appointment. This line is staffed Monday through Friday from 10 a.m. – 5:30 p.m. If the lines are busy, you will be prompted to leave a voicemail."
                            buttons:
                              - italic
                              - removeformat
                              - anchor
  external_website:
    display: 'External Website'
    sections:
      -
        fields:
          -
            handle: link_message
            field:
              type: html
              display: 'External Website Instructions'
              instructions: |-
                Include a title and URL for a link to an external non-UAMS website if the location is a non-UAMS location where our providers practice.

                This link should only be used when it is critical to the patient experience (e.g., for becoming a patient, making an appointment, receiving follow-up information). This must not be used as a link to secondary things like a social media account.'
              if:
                parent: 'equals empty'
              localizable: false
          -
            handle: external_website_url
            field:
              type: text
              input_type: url
              display: 'Non-UAMS URL'
              if:
                parent: 'equals empty'
              validate:
                - non_first_party_url
              localizable: false
          -
            handle: external_website_label
            field:
              type: text
              display: 'Non-UAMS Website Name'
              if:
                parent: 'equals empty'
                external_website_url: 'not empty'
              validate:
                - required
                - sometimes
              localizable: false
  alert:
    display: Alert
    sections:
      -
        fields:
          -
            handle: current_alert
            field:
              type: textarea
              display: 'Current Alert'
              visibility: read_only
              localizable: false
          -
            handle: alert_modification
            field:
              options:
                -
                  key: nothing
                  value: 'No modification'
                -
                  key: suppress
                  value: 'Suppress alert'
                -
                  key: override
                  value: 'Override alert'
                -
                  key: prepend
                  value: 'Insert before alert'
                -
                  key: append
                  value: 'Insert after alert'
              default: nothing
              type: radio
              display: 'Alert Modification'
              instructions: 'How do you want to modify the alert from Find-a-Doc Settings?'
              validate:
                - required
              localizable: false
          -
            handle: alert_body_override_tip
            field:
              type: html
              display: 'Overriding the Alert From Find-a-Doc Settings'
              instructions: 'If you are overriding the system alert, adding values to the Alert Heading or Alert Body fields will replace the value from Find-a-Doc Settings. Leaving them blank will inherit the values from Find-a-Doc Settings.'
              if:
                alert_modification: 'equals override'
              localizable: false
          -
            handle: alert_body_prepend_tip
            field:
              type: html
              display: 'Inserting an Alert Before the Alert From Find-a-Doc Settings'
              instructions: "If you are inserting content before the system alert, make sure the system alert's body begins with a heading (Heading 2). This way, your alert value here will be separated from the system alert in the heading outline."
              if:
                alert_modification: 'equals prepend'
              localizable: false
          -
            handle: alert_body_append_tip
            field:
              type: html
              display: 'Inserting an Alert After the Alert From Find-a-Doc Settings'
              instructions: "If you are inserting content after the system alert, make sure your alert's body begins with a heading (Heading 2). This way, your alert value here will be separated from the system alert in the heading outline."
              if:
                alert_modification: 'equals append'
              localizable: false
          -
            handle: alert_heading
            field:
              type: text
              display: 'Alert Heading'
              if:
                alert_modification: 'equals override'
              localizable: false
          -
            handle: alert_body
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Alert Body'
              if:
                alert_modification: 'contains_any override, prepend, append'
              localizable: false
          -
            handle: alert_color
            field:
              options:
                -
                  key: inherit
                  value: 'Inherit from Find-a-Doc Settings'
                -
                  key: alert-success
                  value: Success
                -
                  key: alert-danger
                  value: Danger
                -
                  key: alert-warning
                  value: Warning
                -
                  key: alert-info
                  value: Info
              type: radio
              display: 'Alert Color'
              default: inherit
              if:
                alert_modification: 'equals override'
              localizable: false
  closing:
    display: Closing
    sections:
      -
        fields:
          -
