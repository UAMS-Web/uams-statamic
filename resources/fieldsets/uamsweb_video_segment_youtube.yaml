title: 'UAMSWeb Video Segment, YouTube'
fields:
  -
    handle: url
    field: uamsweb_common_video.youtube_video_url
    config:
      display: 'YouTube Video URL'
      instructions: 'Choose a video from the UAMS YouTube account. Make sure to include the full URL, starting with <code>https://</code>.'
      validate:
        - required
        - youtube_url
  -
    handle: aspect_ratio
    field: uamsweb_common_video.aspect_ratio
    config:
      validate:
        - required
  -
    import: uamsweb_post_video_segment
  -
    import: uamsweb_post_creator_video
