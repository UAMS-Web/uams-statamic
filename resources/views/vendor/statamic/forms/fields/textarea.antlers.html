<textarea
	class="{{
		[
			'form-control' => true,
			'is-invalid' => error
		] | classes | collapse_whitespace
	}}"
	id="{{ id }}"
	name="{{ handle }}"
	rows="5"
	{{ placeholder | attribute:placeholder }}
	{{ character_limit | attribute:maxlength }}
	{{ if calculation_query == true }}
		{{# See default.antlers.html for the calculation_* wiring rationale.
			Practically only text-mode calc makes sense for a multi-line textarea. #}}
		data-calculation-type="{{ calculation_type ?? 'text' }}"
		data-calculation-formula="{{ calculation_formula ?? calculation_formula_text ?? calculation_formula_math ?? '' }}"
		data-calculation-decimals="{{ calculation_decimals }}"
		readonly
		aria-readonly="true"
	{{ /if }}
	{{# `visibility: read_only` — see README.md in this directory. #}}
	{{ if visibility == 'read_only' && calculation_query !== true }}
		readonly
		aria-readonly="true"
	{{ /if }}
	{{ if js_driver }}{{ js_attributes }}{{ /if }}
	{{ ( validate| contains:required ) | attribute:required }}
	{{ if error }}
		aria-invalid="true" aria-describedby="{{ id }}-error"
	{{ elseif instructions }}
		aria-describedby="{{ id }}-instructions"
	{{ /if }}
>
	{{ value | sanitize }}
</textarea>
