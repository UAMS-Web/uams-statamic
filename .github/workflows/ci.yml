name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow — including the expensive `browser` job — be run on demand
  # against a branch, rather than only on a pull request or a push to main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing more (#391). `GITHUB_TOKEN` is used
# only by `actions/checkout`; private repositories are reached through
# `secrets.COMPOSER_AUTH_TOKEN`, and `actions/cache` and the artifact actions
# authenticate with the runner's own token, which `permissions` does not govern.
# A job that ever needs more gets a job-level block saying why.
permissions:
  contents: read

# RUN_REMOTE_CI — budget kill-switch (UAMS-Web/uams-statamic-archive#980).
# GitHub Actions minutes are billed at the *organization* level (a single pool
# shared by every UAMS-Web repo), not per repo. When that budget is exhausted,
# every job here fails instantly on a billing error. To stop burning the queue
# until the monthly reset, set an Actions variable `RUN_REMOTE_CI` to `false`;
# every job below except the manual-run-only `submodule-access` is gated on
# `if: vars.RUN_REMOTE_CI != 'false'`, so they report `skipped` and consume zero
# runner minutes. Unset (or any value other
# than `false`) = CI runs exactly as before — the default is always-on.
#
#   - Define it as an ORG variable to flip all gated repos at once (matches the
#     org-wide budget); a REPO variable overrides the org value for this repo.
#   - `vars` cannot gate the `on:` triggers, only `if:` — the workflow still
#     evaluates per event, but skipped jobs are never dispatched to a runner.
#   - Skipped jobs do not block merges because no ruleset on `main` requires a
#     status check, NOT because `main` is unprotected. Since 2026-10-05 two
#     organization rulesets govern it, with no bypass list: one refuses
#     deletion and force-pushes, the other requires a pull request, so a
#     direct push is refused as well (docs/runbooks/branch-protection.md,
#     UAMS-Web/uams-statamic-archive#2016). Revisit before adding a required status check: a job skipped
#     by its `if:` reports SUCCESS to a required check, so requiring one of
#     these jobs while `RUN_REMOTE_CI` is `false` lets every merge through with
#     nothing run. A check stays pending only when its whole workflow never
#     runs (a path filter, `[skip ci]`). Decide what the check must mean with
#     the kill switch off before adding it; see UAMS-Web/uams-statamic-archive#980, UAMS-Web/uams-statamic-archive#2016 and UAMS-Web/uams-statamic-archive#3166.
#   - While off, validate branches with `scripts/local-ci.mjs` (no Actions
#     minutes). Flip in Settings -> Secrets and variables -> Actions -> Variables.
#   - An ORG variable whose visibility is "private repositories" does NOT reach
#     this repository, which is public. Measured 2026-10-27, the hour it was made
#     public: the org's `RUN_REMOTE_CI=false` read as 1 org variable from the
#     private `uams-statamic-archive` and 0 from here, and the full chain started
#     on every open pull request. To switch THIS repository off, set a REPO
#     variable; the org value cannot do it.
#
# PARITY: `scripts/local-ci.mjs` reproduces every job below (all but the
# REMOTE-ONLY `submodule-access` and `synced-files`, noted further down) for local runs (no
# Docker, no act, no Actions minutes) — used when GitHub Actions budget is out.
# The two are kept in lockstep BY HAND: when you add, remove, or change a job's
# command here, mirror it in the script (and vice versa). The parity-critical
# surface is each job's final run step, flagged inline with `# PARITY:` below:
#   pest        -> "Run Pest (parallel shard, excluding the serial group)"
#                     (the local command plus `--shard`: CI splits the band
#                     four ways, the local runner runs it whole; #387)
#   pest-serial -> "Run Pest (serial tail for the serial group)"
#   pest-report -> no counterpart: it merges the shards' reports, and its two
#                     band checks are the local pest job's parallel-band checks
#   pint           -> "Determine changed PHP files" + "Run Pint on changed files"
#   rector         -> "Run Rector (gating profile, dry-run)"
#   mutate         -> "Run the mutation-tooling smoke"
#   phpstan       -> "Run Larastan"
#   build          -> "Build site assets" + "Build CP assets"
#   js             -> "Run JS unit tests"
#   spell          -> "Run cspell"
#   no-emoji-guard -> "Run no-emoji guard"
#   content-pointer-guard -> "Run content pointer guard"
#   encoding-guard -> "Run encoding guard"
#   test-isolation-guard -> "Run test isolation guard" + "Run global test symbol check"
#   composer-validate -> "Run composer validate" + "Run PSR-4 class check"
#   browser        -> "Run CP browser smokes + accessibility gate" (mirrored as
#                     `--jobs browser`, and part of local-ci's default `all` set
#                     since UAMS-Web/uams-statamic-archive#1727 — the `browser-tests` label gate was removed in
#                     the same change). Runs the CP smokes and the §504/WCAG
#                     axe-core gate (UAMS-Web/uams-statamic-archive#1046), both in tests/Browser.
# JOB FAN-OUT: every job below runs in parallel. One job declares `needs:`, and
# only on the job whose output it reads: `pest-report` merges the reports of the
# four `pest` shards, so it cannot start before them (#387). Otherwise one job's
# failure neither skips nor delays another, and a run reports every fault it
# found rather than only the first.
# Until #373 these ran as a strict sequential chain, cost-ordered shortest to
# longest, each job entered through `needs:` on the one before it, so an early
# failure never billed Actions minutes for the expensive jobs behind it. That
# protected a metered budget pooled across the whole organization. It does not
# apply here: this repository is public and every job runs on `ubuntu-latest`, a
# standard runner, which GitHub does not meter for a public repository. With
# nothing left to save the trade inverts, and wall-clock is the longest job rather
# than the sum of all of them. Supersedes the 2026-07-15 entry in
# docs/DECISIONS.md, which superseded the UAMS-Web/uams-statamic-archive#1543 spell-only gate.
# DELIBERATELY NOT MIRRORED: `local-ci.mjs` keeps its cost-ordered chain and its
# stop at the first failure. It runs on ONE machine, where the jobs are serial
# whatever any graph says, and stopping early saves the developer's own wall-clock
# rather than a budget. So the parity contract below covers each job's COMMAND and
# the SET of jobs, never the order they run in; `scripts/local-ci.chain.test.mjs`
# asserts that set, and asserts that the only `needs:` edge here is
# `pest-report` on `pest`.
# LOCAL-ONLY (intentionally no job here): `local-ci.mjs` resets a REUSED worktree's
# runtime state (storage/framework, bootstrap caches, Stache) before the framework
# jobs. There is no counterpart here on purpose — every CI run starts from a fresh
# checkout, so there is never stale runtime state to clear. See UAMS-Web/uams-statamic-archive#1164.
# LOCAL-ONLY (intentionally no step here): `local-ci.mjs` also re-applies Composer
# patches when a REUSED worktree's patch set is stale. On reuse `composer install`
# reports "Nothing to install", so no package-install event fires and a newly added
# patch is never applied — the band would validate the OLD patch set and report
# green. Again no counterpart here: the `composer install` below always runs cold
# against a fresh checkout, so patches are applied every time. See UAMS-Web/uams-statamic-archive#1743.
# LOCAL-ONLY (intentionally no step here): `local-ci.mjs` also reconciles the branch
# it is about to validate with `origin/<branch>` and prints the commit under test.
# `git worktree add`/`git checkout` resolve the LOCAL ref, which neither `--fetch`
# nor `--fresh` moves, so a local runner can validate a commit the PR has moved past
# (UAMS-Web/uams-statamic-archive#1710). No counterpart here because `actions/checkout` always lands the requested
# ref — this is a local-runner-only gap. See UAMS-Web/uams-statamic-archive#1746.
# LOCAL-ONLY (intentionally no step here): `local-ci.mjs` also hands the run over to
# the BRANCH's own copy of itself when the two differ, so a PR that adds or removes a
# chain job has that job list executed rather than the base branch's. Observed on
# UAMS-Web/uams-statamic-archive#1878: the `mutate` job it added never ran, and the chain still reported green. The
# child is marked pinned through the LOCAL_CI_RUNNER_PINNED environment variable
# rather than a flag, so a runner predating the change ignores it instead of dying on
# an unknown option. No counterpart here because `actions/checkout` lands the PR's own
# workflow file, so this file IS always the branch's. Locally the runner is loaded
# before the branch is checked out, wherever it is invoked from, which is the gap the
# handoff closes. See UAMS-Web/uams-statamic-archive#1882 and UAMS-Web/uams-statamic-archive#2856.
# LOCAL-ONLY (intentionally no step here): `local-ci.mjs` also verifies that a REUSED
# worktree matches the commit under test before setting any job up, and refuses the
# run when it does not. `git checkout` updates tracked files and removes nothing that
# has become untracked, so a file the validated commit DELETES survives on disk —
# two tests deleted by UAMS-Web/uams-statamic-archive#1847 ran and passed in a reusing run that was validating
# their absence. No counterpart here because every CI run is a fresh checkout, which
# cannot carry residue from a previous one. See UAMS-Web/uams-statamic-archive#1889.
# REMOTE-ONLY (no job in local-ci.mjs until #256): `synced-files` runs the shared
# check that a synced rule or skill was not edited by hand. See UAMS-Web/uams-statamic-archive#3084.
# REMOTE-ONLY (intentionally no job in local-ci.mjs): `submodule-access` runs only on
# a manual `workflow_dispatch` and checks that `secrets.COMPOSER_AUTH_TOKEN` can clone
# the private submodules. That secret exists only on GitHub, and the local runner
# clones them with the developer's own credentials instead. See UAMS-Web/uams-statamic-archive#2497.
# Toolchain pins that must also match: PHP 8.4 (setup-php), Node 22 (setup-node),
# and npm >= 11.10.0 (the `engines.npm` floor `.npmrc`'s engine-strict enforces; UAMS-Web/uams-statamic-archive#1826).
# A pre-commit hook (`.githooks/pre-commit`, auto-wired by composer) blocks a
# commit that stages only one of these two files; bypass with `--no-verify`.
# See `.claude/skills/local-ci/SKILL.md` for the job<->command mapping table.

# `secrets.COMPOSER_AUTH_TOKEN` must be a Personal Access Token (or GitHub App
# installation token) with read access to UAMS-Web/wordpress-importer,
# UAMS-Web/uams-statamic-content, UAMS-Web/uams-statamic-users *and*
# UAMS-Web/uams-statamic-forms. Without the
# first, `composer install` fails on the private `uams-web/wordpress-importer`
# package; without the second, the content submodule clone fails with HTTP 403
# and `statamic:stache:warm` runs against an empty content directory; without
# the third, the users submodule clone fails the same way and the pest job
# stops before it runs (UAMS-Web/uams-statamic-archive#2477); without the fourth, the forms submodule clone
# fails the same way (UAMS-Web/uams-statamic-archive#2818). The default `GITHUB_TOKEN` cannot reach private
# repos in other repositories within the same org.

jobs:
  submodule-access:
    name: Submodule access (manual runs only)
    runs-on: ubuntu-latest
    # Proves that `secrets.COMPOSER_AUTH_TOKEN` can still clone every private
    # submodule the gates read, without switching remote CI back on (UAMS-Web/uams-statamic-archive#2497).
    # Every other job is gated on RUN_REMOTE_CI, so while that is `false` a manual
    # run does nothing; this job is the exception, on purpose.
    #
    # - Runs ONLY when the workflow is started by hand (`workflow_dispatch`), so a
    #   pull request or a push never runs it.
    # - Deliberately NOT gated on RUN_REMOTE_CI, and needs no other job, so a
    #   manual run reaches this step at once instead of after phpstan.
    # - Nothing `needs:` it, so it cannot skip or hold up any gate job. Since
    #   #373 the only `needs:` edge in this file is `pest-report` on `pest`.
    # - Re-run it by hand whenever a private submodule is added. The token is
    #   fine-grained, so a new repository must be added on its settings page
    #   first (the confirmed repository list is recorded on UAMS-Web/uams-statamic-archive#2497).
    #
    # REMOTE-ONLY (intentionally no counterpart in scripts/local-ci.mjs): it
    # checks a secret that exists only on GitHub. The local runner clones the
    # same submodules with the developer's own credentials (the Composer
    # `github-oauth` token, or git's credential helper) whenever a job needs them.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      # Must stay identical to the pest job's step of the same name, so a green
      # run here proves the step the pest job will run.
      # tests/Feature/GatesInitializeUsersSubmoduleTest.php pins that.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

  synced-files:
    name: Synced files (no hand-edited rules or skills)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Adopted from the shared code-quality skill's templates/ci.yml (UAMS-Web/uams-statamic-archive#3084,
    # UAMS-Web/uams-claude-skills#155); the job id and name match the template.
    # Fails, naming the file, when a rule or skill the sync manages was edited
    # by hand rather than in UAMS-Web/uams-claude-skills.
    #
    # It needs nothing and nothing needs it, which since #373 is true of every
    # job here, so it cannot skip or hold up a gate job and reports beside them.
    #
    # REMOTE-ONLY for now (no job in scripts/local-ci.mjs): the local runner's
    # own synced-files job arrives with the shared runner in #256. Until then
    # run `node .claude/skills/synced-files/scripts/check-synced-files.mjs` by
    # hand before a pull request that touches .claude/, .agents/ or .cursor/.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check synced files
        run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

  pest:
    name: Pest (parallel band, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # The parallel band runs as four shards, one runner each (#387). Run whole on
    # one runner it was the longest job in this file by far: about 22 minutes of
    # band plus setup against about 4 for the serial tail, so it decided the
    # workflow's wall-clock alone. Split four ways on recorded timings, the longest
    # shard job took 453s and 506s in two runs of the #384 spike, where the whole
    # band's job took about 1662s on main.
    #
    # Pest assigns test CLASSES to shards (`--shard=<i>/4`), from the per-class
    # timings in tests/.pest/shards.json when that file exists. Every shard here
    # reads the same copy (see "Place shard timings") and lists the band's tests,
    # and `pest-report` merges the four reports, refuses a band no shard ran whole,
    # and runs the two checks that judge the band as a whole. The serial group runs
    # beside the shards as `pest-serial`.
    #
    # Each shard repeats the full setup below, about half a minute per runner.
    # That repeated setup is why four shards and not more: past four, the setup
    # and the longest single class decide the job's length, not the share of the
    # band (#384).
    #
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    strategy:
      # Every shard runs to its end, so one shard's failure does not hide another's.
      fail-fast: false
      matrix:
        # 1 to SHARD_TOTAL below. scripts/local-ci.chain.test.mjs holds the
        # two together, and `pest-report` passes the same total to the merge.
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v7

      # Asset containers, taxonomies, entries, and globals live in the private
      # `content/` submodule. Without it, `statamic:stache:warm` discovers
      # nothing and content-dependent tests fail with null lookups (e.g.
      # `Asset::container()` returning null in the augmented hook).
      #
      # `users/` is checked out too (UAMS-Web/uams-statamic-archive#2477). Since UAMS-Web/uams-statamic-archive#2454 it holds only the two
      # seed accounts and the `.gitignore` allowlist that keeps registrant
      # records out of git -- a 2 KB pack and no user data -- and checking it
      # out is what lets tests/Feature/Users/RegistrantRecordsAreGitIgnoredTest.php
      # run here rather than skip, so a reverted allowlist reds this job instead
      # of passing it.
      #
      # `resources/forms` is checked out too (UAMS-Web/uams-statamic-archive#2818): the form configurations live
      # in the private forms repository, and the tests that read the real forms
      # skip without it.
      #
      # The other two submodules (public/assets, app/private/assets)
      # hold binary assets and user data the PHPUnit suite does not need, so they
      # stay un-initialized to keep checkout cheap. The token reuse works because
      # these submodules live in the same UAMS-Web org as the private composer
      # package COMPOSER_AUTH_TOKEN is already scoped for.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

      # `shivammathur/setup-php` disables OPcache for the CLI by default. For a
      # framework-booted test suite this is the single biggest perf lever — every
      # `Tests\TestCase`-derived class re-bootstraps Laravel + Statamic, and the
      # bulk of that cost is parsing vendor sources. OPcache + JIT bring CI
      # within range of local PHP-with-OPcache wall-clock times.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # imagick: SvgRasterizerTest self-skips without it, and the app runs
          # IMAGE_MANIPULATION_DRIVER=imagick — so without it CI both misses that
          # coverage and skips 2 more than tests/skip-baseline.json records (UAMS-Web/uams-statamic-archive#1744).
          extensions: intl, mbstring, sqlite3, dom, gd, fileinfo, bcmath, imagick
          coverage: none
          tools: composer:v2
          # `zend.assertions` and `pcre.jit` match what the local gate's PHP already
          # runs, because four tests are written to run only under those values and
          # self-skip otherwise: two assert an AssertionError and need assertions
          # compiled in, two induce a PCRE failure the JIT does not produce. The
          # runner's defaults (-1 and 1) made all four skip, which took the parallel
          # band to 5 skips against a baseline of 3 and failed
          # scripts/check-skip-baseline.php. Raising the baseline would have recorded
          # the coverage loss instead of fixing it, which that file's own header
          # forbids; matching the local environment restores the four tests.
          ini-values: opcache.enable_cli=1, opcache.jit_buffer_size=64M, opcache.jit=tracing, zend.assertions=1, pcre.jit=0

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      # Run the Unit+Feature suite in parallel (paratest), turning a ~3h
      # single-process run into ~5 min by using every core. Two pieces keep the
      # split correct:
      #   - config/cache.php gives each worker an isolated per-TEST_TOKEN file
      #     cache, so a concurrent cache clear in one worker can't corrupt another;
      #     the existing per-process stache warm in tests/CreatesApplication.php
      #     then populates each worker's own cache, so no separate
      #     `statamic:stache:warm` step is needed.
      #   - phpunit.xml forces Statamic's NullCacher, whose lock is a no-op, so the
      #     static-cache middleware's per-URL lock can't 503 under cross-worker
      #     contention. It disables the Stache warming lock for the same reason:
      #     that one is a flock over the single, non-tokenized
      #     storage/statamic/stache-locks, held for the duration of a warm or a
      #     Duplicates::find(), so whoever holds it 503s every other worker's
      #     front-end request (UAMS-Web/uams-statamic-archive#1689). The seed step below makes a warm the
      #     fallback rather than the norm here, which narrows that window without
      #     closing it.
      # A few tests are parallel-fragile (an unpinnable race, or a hardcoded shared
      # path); they are tagged `->group('serial')` and run in the serial tail step
      # below rather than the parallel pass — see tests/README.md for the
      # convention. `-d pcov.enabled=0` keeps the gate coverage-free (a no-op here —
      # setup-php installs no coverage driver — but mirrors the local runner, where
      # PCOV is present). paratest auto-detects the runner's (stable) core count;
      # CI's CLI memory_limit is the -1 (unlimited) default, so workers need no
      # tuning.
      # Build the Stache seed once, in the testing env, before the parallel
      # suite. Each of the ~12 paratest workers otherwise runs
      # statamic:stache:warm at startup, and because all warm concurrently they
      # saturate the disk (~168s each vs 21s alone) — the dominant parallel cost
      # (UAMS-Web/uams-statamic-archive#1537). test:seed-stache warms once and snapshots; each worker then
      # copies the snapshot into its own per-worker cache (CreatesApplication)
      # instead of re-warming. Built as APP_ENV=testing so the snapshot matches
      # the env the workers read. DB_DATABASE=:memory: mirrors phpunit.xml: the
      # warm builds computed-field indexes that probe the DB (e.g. Schema::hasTable
      # in the article-engagement computed), so it needs a connectable database —
      # the tests use in-memory SQLite, and a fresh checkout has no sqlite file.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build Stache seed (testing env)
        run: 'DB_DATABASE=:memory: APP_ENV=testing php artisan test:seed-stache'

      # Build the route cache in the testing env before the suite so the URL
      # generator uses the compiled O(1) RouteCollection instead of scanning the
      # full table. mitydigital/sitemapamic registers one sitemap route per site
      # (255 on this multisite), and uncached URL generation scales with route
      # count, ~2x slower on the render-heavy suite (UAMS-Web/uams-statamic-archive#1537). Built as
      # APP_ENV=testing so an env-conditional route (e.g. the local-only dev
      # preview route) is baked exactly as the tests expect; a failure here also
      # surfaces a route the prod deploy's route:cache could not serialize.
      # Built AFTER the Stache seed (UAMS-Web/uams-statamic-archive#3106): routes/web.php registers each site's
      # feed.xml only when `Collection::findByHandle('posts')` resolves as the
      # route file loads, and against a cold Stache it does not, so the compiled
      # table would omit every feed route and PostsFeedRouteTest would 404.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build route cache (testing env)
        run: APP_ENV=testing php artisan route:cache

      # The timings Pest balances the shards on (#387). Each push to main writes
      # them, from that run's merged report, to the Actions cache (see
      # `pest-report`); a pull request reads the newest one main wrote, since a
      # branch can read its base branch's cache. Restored by prefix only: the
      # exact key below is never written, so the newest saved entry always wins.
      # With no entry yet (a new repository, or an evicted cache) the committed
      # copy in .github/pest-shards.json is used instead.
      #
      # REMOTE-ONLY: the local runner runs the parallel band whole, so it reads
      # no timings.
      - name: Restore shard timings
        id: shard-timings
        uses: actions/cache/restore@v6
        with:
          path: tests/.pest/shards.json
          key: pest-shard-timings-never-written
          restore-keys: pest-shard-timings-

      # Logs which timings this shard read, and records their source and hash for
      # `pest-report`. Every shard partitions the band from its own copy, so four
      # shards that read different copies (a main push saving new timings between
      # two shards' restores) can run a class twice or not at all; `pest-report`
      # refuses that by comparing the four notes.
      - name: Place shard timings
        env:
          SHARD: ${{ matrix.shard }}
          MATCHED_KEY: ${{ steps.shard-timings.outputs.cache-matched-key }}
        run: |
          if [ -n "$MATCHED_KEY" ] && [ -s tests/.pest/shards.json ]; then
            source="cache entry $MATCHED_KEY"
          else
            mkdir -p tests/.pest
            cp .github/pest-shards.json tests/.pest/shards.json
            source="committed .github/pest-shards.json"
          fi
          note="source=$source sha256=$(sha256sum tests/.pest/shards.json | cut -d' ' -f1)"
          echo "Shard timings: $note"
          echo "$note" > "shard-timings-$SHARD.txt"

      # What the whole band holds, so `pest-report` can show the shards ran each
      # class exactly once. Listing loads the test files without running them.
      # REMOTE-ONLY: the local runner does not shard, so it has nothing to compare.
      - name: List the parallel band's tests
        env:
          SHARD: ${{ matrix.shard }}
        run: php -d pcov.enabled=0 vendor/bin/pest --list-tests --exclude-group=serial > "pest-list-$SHARD.txt"

      # NO --tia HERE, DELIBERATELY (UAMS-Web/uams-statamic-archive#1717). Pest 5's test-impact-analysis engine
      # replays cached results instead of executing tests it believes a change
      # cannot reach. It is excluded from BOTH bands below for three independent
      # reasons, any one of which is disqualifying:
      #
      #   1. No coverage driver. Tia builds its graph from coverage, and this job
      #      pins `coverage: none` above (local-ci.mjs passes `-d pcov.enabled=0`).
      #      With no driver it records zero edges, and a graph with no edges marks
      #      nothing affected -- so every run replays and reports a green suite
      #      having executed nothing. Pest 5.0.1 does not warn about this.
      #   2. No persistent cache. Tia's graph lives at tests/.pest/tia/, which #192
      #      pins via `pest()->tia()->directory()` instead of the default
      #      ~/.pest/tia/<key>/. Either way every Actions job is a fresh checkout on
      #      a fresh runner, so the graph never survives; Tia here would need the
      #      --baselined artifact-fetch pipeline to do anything at all.
      #   3. The content/ blind spot. `.gitmodules` sets `ignore = dirty` on the
      #      content submodule, so `git status --porcelain` -- Tia's exact change
      #      detection -- reports nothing when content changes, and a submodule
      #      path is a directory, which Tia's watch-pattern fallback drops anyway.
      #      Reproduced: with one content entry added, --tia returned `2 passed,
      #      2 replayed` (exit 0) where --no-tia returned `1 failed` (exit 1).
      #
      # Tia IS available locally, opt-in, behind a guard that refuses to run under
      # conditions 1 and 3: `composer test:tia` (scripts/check-tia-safe.php). The
      # gate deliberately does not use it -- an exhaustive run is the whole point.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # --shard selects this job's share of the classes, and changes nothing about
      # how they run. --log-junit feeds `pest-report`, which merges the four shards'
      # reports before the skip-baseline and slowest-class checks read them.
      - name: Run Pest (parallel shard, excluding the serial group)
        env:
          SHARD: ${{ matrix.shard }}
        run: php -d pcov.enabled=0 vendor/bin/pest --parallel --exclude-group=serial --shard="$SHARD/$SHARD_TOTAL" --display-all-issues --log-junit "junit-parallel-$SHARD.xml"

      # Only a shard whose band passed uploads, and `pest-report` needs all four,
      # so a failed shard leaves the report job skipped rather than merging an
      # incomplete band.
      - name: Upload the shard's report, listing and timings note
        uses: actions/upload-artifact@v7
        with:
          name: pest-shard-${{ matrix.shard }}
          path: |
            junit-parallel-${{ matrix.shard }}.xml
            pest-list-${{ matrix.shard }}.txt
            shard-timings-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 7

      # Every test process holds the content mirror band lock shared, and a child a
      # test spawns inherits that descriptor, so the lock can outlive both bands and
      # refuse every later `test:seed-stache` with nothing naming a lock or a
      # process (UAMS-Web/uams-statamic-archive#3018). Probed only here, after the serial tail: a live band
      # legitimately holds the lock. `if: always()` because a failed band can leave
      # a child behind as easily as a passing one. PHP, not Node, as above.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check the content mirror band lock was released
        if: always()
        run: php scripts/check-band-lock-released.php

      # Clear the cached table so it can't leak into a warm-runner rerun.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Clear route cache
        if: always()
        run: php artisan route:clear

      # A test that persists a fixture into the live content/ submodule strands the
      # file whenever the process does not reach its cleanup — a band killed at its
      # bound, or one that fatals (UAMS-Web/uams-statamic-archive#1873). Locally that dirties the checkout for every
      # later run, and the stray is boot-visible input: `statamic:stache:warm` indexes
      # it and memoizes a collection-structure entry against the real collection, which
      # is the state that produced UAMS-Web/uams-statamic-archive#1845.
      #
      # `if: always()` deliberately: a band that FAILED is exactly the case where
      # cleanup did not run, so skipping the check on failure would hide the litter in
      # the run most likely to have produced it.
      #
      # No before/after diff here, unlike local-ci.mjs — this runner checks out fresh,
      # so anything dirty was written by this run. The runner reuses its worktree and
      # therefore has to tell the two apart.
      #
      # users/ is checked the same way since UAMS-Web/uams-statamic-archive#2477 checked it out: the file user
      # driver writes there, and what this catches is not a test-created account
      # (the allowlist ignores those, and --untracked-files=all lists untracked, not
      # ignored) but a tracked seed account a test deleted or rewrote.
      # resources/forms/ is checked since UAMS-Web/uams-statamic-archive#2818 made it a submodule: a test that saves
      # a form without re-rooting statamic.forms.forms writes its YAML there.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # Nothing is held aside any more. `models/assets/` used to be, mirroring
      # KNOWN_CONTENT_LITTER in scripts/gate-pest.mjs, because app/Models/Asset.php
      # rewrote content/models/assets/{id}.yml through base_path() on model save,
      # outside the Stache, where no store re-root reached it. UAMS-Web/uams-statamic-archive#1919 closed that at the
      # seam — Asset::$skipYamlSync is armed for every test by Tests\TestCase::setUp() —
      # so the exemption came out and this gate now fails on any write at all.
      - name: Check the suite left content/, users/ and resources/forms/ clean
        if: always()
        run: |
          code=0
          for sub in content users resources/forms; do
            dirty=$(git -C "$sub" status --porcelain --untracked-files=all)
            if [ -n "$dirty" ]; then
              echo "::error::The suite wrote into the $sub/ submodule:"
              echo "$dirty"
              if [ "$sub" = resources/forms ]; then
                echo "A test saved a form into the live forms submodule. Point statamic.forms.forms"
                echo "at a throwaway directory for the test, the way the Feature/Forms tests do."
              elif [ "$sub" = content ]; then
                echo "Put the test on Tests\\Support\\CollectionTreeIsolatedTestCase, which re-roots the"
                echo "collection-trees store at a throwaway directory so its writes land in"
                echo "storage/framework/testing/ instead of the live submodule."
              else
                echo "A test deleted or rewrote a tracked seed account. Delete only what the test created,"
                echo "by the email it chose, and never User::all() in bulk; or re-root the users store"
                echo "the way Tests\\Support\\BrowserWriteIsolation does."
              fi
              code=1
            else
              echo "$sub/ litter: none — the suite left the submodule as it found it."
            fi
          done
          exit "$code"

  pest-serial:
    name: Pest (serial group)
    runs-on: ubuntu-latest
    # The serial group, beside the parallel band's shards rather than after them
    # (#387): the two share nothing at run time, since each job has its own
    # checkout, seed and route cache. Its setup is the shards' setup, step for
    # step; scripts/local-ci.chain.test.mjs holds the two together.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7

      # Asset containers, taxonomies, entries, and globals live in the private
      # `content/` submodule. Without it, `statamic:stache:warm` discovers
      # nothing and content-dependent tests fail with null lookups (e.g.
      # `Asset::container()` returning null in the augmented hook).
      #
      # `users/` is checked out too (UAMS-Web/uams-statamic-archive#2477). Since UAMS-Web/uams-statamic-archive#2454 it holds only the two
      # seed accounts and the `.gitignore` allowlist that keeps registrant
      # records out of git -- a 2 KB pack and no user data -- and checking it
      # out is what lets tests/Feature/Users/RegistrantRecordsAreGitIgnoredTest.php
      # run here rather than skip, so a reverted allowlist reds this job instead
      # of passing it.
      #
      # `resources/forms` is checked out too (UAMS-Web/uams-statamic-archive#2818): the form configurations live
      # in the private forms repository, and the tests that read the real forms
      # skip without it.
      #
      # The other two submodules (public/assets, app/private/assets)
      # hold binary assets and user data the PHPUnit suite does not need, so they
      # stay un-initialized to keep checkout cheap. The token reuse works because
      # these submodules live in the same UAMS-Web org as the private composer
      # package COMPOSER_AUTH_TOKEN is already scoped for.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

      # `shivammathur/setup-php` disables OPcache for the CLI by default. For a
      # framework-booted test suite this is the single biggest perf lever — every
      # `Tests\TestCase`-derived class re-bootstraps Laravel + Statamic, and the
      # bulk of that cost is parsing vendor sources. OPcache + JIT bring CI
      # within range of local PHP-with-OPcache wall-clock times.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # imagick: SvgRasterizerTest self-skips without it, and the app runs
          # IMAGE_MANIPULATION_DRIVER=imagick — so without it CI both misses that
          # coverage and skips 2 more than tests/skip-baseline.json records (UAMS-Web/uams-statamic-archive#1744).
          extensions: intl, mbstring, sqlite3, dom, gd, fileinfo, bcmath, imagick
          coverage: none
          tools: composer:v2
          # `zend.assertions` and `pcre.jit` match what the local gate's PHP already
          # runs, because four tests are written to run only under those values and
          # self-skip otherwise: two assert an AssertionError and need assertions
          # compiled in, two induce a PCRE failure the JIT does not produce. The
          # runner's defaults (-1 and 1) made all four skip, which took the parallel
          # band to 5 skips against a baseline of 3 and failed
          # scripts/check-skip-baseline.php. Raising the baseline would have recorded
          # the coverage loss instead of fixing it, which that file's own header
          # forbids; matching the local environment restores the four tests.
          ini-values: opcache.enable_cli=1, opcache.jit_buffer_size=64M, opcache.jit=tracing, zend.assertions=1, pcre.jit=0

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      # Run the Unit+Feature suite in parallel (paratest), turning a ~3h
      # single-process run into ~5 min by using every core. Two pieces keep the
      # split correct:
      #   - config/cache.php gives each worker an isolated per-TEST_TOKEN file
      #     cache, so a concurrent cache clear in one worker can't corrupt another;
      #     the existing per-process stache warm in tests/CreatesApplication.php
      #     then populates each worker's own cache, so no separate
      #     `statamic:stache:warm` step is needed.
      #   - phpunit.xml forces Statamic's NullCacher, whose lock is a no-op, so the
      #     static-cache middleware's per-URL lock can't 503 under cross-worker
      #     contention. It disables the Stache warming lock for the same reason:
      #     that one is a flock over the single, non-tokenized
      #     storage/statamic/stache-locks, held for the duration of a warm or a
      #     Duplicates::find(), so whoever holds it 503s every other worker's
      #     front-end request (UAMS-Web/uams-statamic-archive#1689). The seed step below makes a warm the
      #     fallback rather than the norm here, which narrows that window without
      #     closing it.
      # A few tests are parallel-fragile (an unpinnable race, or a hardcoded shared
      # path); they are tagged `->group('serial')` and run in the serial tail step
      # below rather than the parallel pass — see tests/README.md for the
      # convention. `-d pcov.enabled=0` keeps the gate coverage-free (a no-op here —
      # setup-php installs no coverage driver — but mirrors the local runner, where
      # PCOV is present). paratest auto-detects the runner's (stable) core count;
      # CI's CLI memory_limit is the -1 (unlimited) default, so workers need no
      # tuning.
      # Build the Stache seed once, in the testing env, before the parallel
      # suite. Each of the ~12 paratest workers otherwise runs
      # statamic:stache:warm at startup, and because all warm concurrently they
      # saturate the disk (~168s each vs 21s alone) — the dominant parallel cost
      # (UAMS-Web/uams-statamic-archive#1537). test:seed-stache warms once and snapshots; each worker then
      # copies the snapshot into its own per-worker cache (CreatesApplication)
      # instead of re-warming. Built as APP_ENV=testing so the snapshot matches
      # the env the workers read. DB_DATABASE=:memory: mirrors phpunit.xml: the
      # warm builds computed-field indexes that probe the DB (e.g. Schema::hasTable
      # in the article-engagement computed), so it needs a connectable database —
      # the tests use in-memory SQLite, and a fresh checkout has no sqlite file.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build Stache seed (testing env)
        run: 'DB_DATABASE=:memory: APP_ENV=testing php artisan test:seed-stache'

      # Build the route cache in the testing env before the suite so the URL
      # generator uses the compiled O(1) RouteCollection instead of scanning the
      # full table. mitydigital/sitemapamic registers one sitemap route per site
      # (255 on this multisite), and uncached URL generation scales with route
      # count, ~2x slower on the render-heavy suite (UAMS-Web/uams-statamic-archive#1537). Built as
      # APP_ENV=testing so an env-conditional route (e.g. the local-only dev
      # preview route) is baked exactly as the tests expect; a failure here also
      # surfaces a route the prod deploy's route:cache could not serialize.
      # Built AFTER the Stache seed (UAMS-Web/uams-statamic-archive#3106): routes/web.php registers each site's
      # feed.xml only when `Collection::findByHandle('posts')` resolves as the
      # route file loads, and against a cold Stache it does not, so the compiled
      # table would omit every feed route and PostsFeedRouteTest would 404.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build route cache (testing env)
        run: APP_ENV=testing php artisan route:cache

      # NO --tia HERE, DELIBERATELY (UAMS-Web/uams-statamic-archive#1717). Pest 5's test-impact-analysis engine
      # replays cached results instead of executing tests it believes a change
      # cannot reach. It is excluded from BOTH bands below for three independent
      # reasons, any one of which is disqualifying:
      #
      #   1. No coverage driver. Tia builds its graph from coverage, and this job
      #      pins `coverage: none` above (local-ci.mjs passes `-d pcov.enabled=0`).
      #      With no driver it records zero edges, and a graph with no edges marks
      #      nothing affected -- so every run replays and reports a green suite
      #      having executed nothing. Pest 5.0.1 does not warn about this.
      #   2. No persistent cache. Tia's graph lives at tests/.pest/tia/, which #192
      #      pins via `pest()->tia()->directory()` instead of the default
      #      ~/.pest/tia/<key>/. Either way every Actions job is a fresh checkout on
      #      a fresh runner, so the graph never survives; Tia here would need the
      #      --baselined artifact-fetch pipeline to do anything at all.
      #   3. The content/ blind spot. `.gitmodules` sets `ignore = dirty` on the
      #      content submodule, so `git status --porcelain` -- Tia's exact change
      #      detection -- reports nothing when content changes, and a submodule
      #      path is a directory, which Tia's watch-pattern fallback drops anyway.
      #      Reproduced: with one content entry added, --tia returned `2 passed,
      #      2 replayed` (exit 0) where --no-tia returned `1 failed` (exit 1).
      #
      # Tia IS available locally, opt-in, behind a guard that refuses to run under
      # conditions 1 and 3: `composer test:tia` (scripts/check-tia-safe.php). The
      # gate deliberately does not use it -- an exhaustive run is the whole point.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # The serial tail runs the parallel-fragile `->group('serial')` tests in a
      # single process (no --parallel), where they are reliable.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Run Pest (serial tail for the serial group)
        run: php -d pcov.enabled=0 vendor/bin/pest --group=serial --display-all-issues --log-junit junit-serial.xml

      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check skip baseline (serial band)
        run: php scripts/check-skip-baseline.php --report=junit-serial.xml --band=serial

      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check slowest class (serial band)
        run: php scripts/check-slowest-class.php --report=junit-serial.xml --band=serial

      # Every test process holds the content mirror band lock shared, and a child a
      # test spawns inherits that descriptor, so the lock can outlive both bands and
      # refuse every later `test:seed-stache` with nothing naming a lock or a
      # process (UAMS-Web/uams-statamic-archive#3018). Probed only here, after the serial tail: a live band
      # legitimately holds the lock. `if: always()` because a failed band can leave
      # a child behind as easily as a passing one. PHP, not Node, as above.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check the content mirror band lock was released
        if: always()
        run: php scripts/check-band-lock-released.php

      # Clear the cached table so it can't leak into a warm-runner rerun.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Clear route cache
        if: always()
        run: php artisan route:clear

      # A test that persists a fixture into the live content/ submodule strands the
      # file whenever the process does not reach its cleanup — a band killed at its
      # bound, or one that fatals (UAMS-Web/uams-statamic-archive#1873). Locally that dirties the checkout for every
      # later run, and the stray is boot-visible input: `statamic:stache:warm` indexes
      # it and memoizes a collection-structure entry against the real collection, which
      # is the state that produced UAMS-Web/uams-statamic-archive#1845.
      #
      # `if: always()` deliberately: a band that FAILED is exactly the case where
      # cleanup did not run, so skipping the check on failure would hide the litter in
      # the run most likely to have produced it.
      #
      # No before/after diff here, unlike local-ci.mjs — this runner checks out fresh,
      # so anything dirty was written by this run. The runner reuses its worktree and
      # therefore has to tell the two apart.
      #
      # users/ is checked the same way since UAMS-Web/uams-statamic-archive#2477 checked it out: the file user
      # driver writes there, and what this catches is not a test-created account
      # (the allowlist ignores those, and --untracked-files=all lists untracked, not
      # ignored) but a tracked seed account a test deleted or rewrote.
      # resources/forms/ is checked since UAMS-Web/uams-statamic-archive#2818 made it a submodule: a test that saves
      # a form without re-rooting statamic.forms.forms writes its YAML there.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # Nothing is held aside any more. `models/assets/` used to be, mirroring
      # KNOWN_CONTENT_LITTER in scripts/gate-pest.mjs, because app/Models/Asset.php
      # rewrote content/models/assets/{id}.yml through base_path() on model save,
      # outside the Stache, where no store re-root reached it. UAMS-Web/uams-statamic-archive#1919 closed that at the
      # seam — Asset::$skipYamlSync is armed for every test by Tests\TestCase::setUp() —
      # so the exemption came out and this gate now fails on any write at all.
      - name: Check the suite left content/, users/ and resources/forms/ clean
        if: always()
        run: |
          code=0
          for sub in content users resources/forms; do
            dirty=$(git -C "$sub" status --porcelain --untracked-files=all)
            if [ -n "$dirty" ]; then
              echo "::error::The suite wrote into the $sub/ submodule:"
              echo "$dirty"
              if [ "$sub" = resources/forms ]; then
                echo "A test saved a form into the live forms submodule. Point statamic.forms.forms"
                echo "at a throwaway directory for the test, the way the Feature/Forms tests do."
              elif [ "$sub" = content ]; then
                echo "Put the test on Tests\\Support\\CollectionTreeIsolatedTestCase, which re-roots the"
                echo "collection-trees store at a throwaway directory so its writes land in"
                echo "storage/framework/testing/ instead of the live submodule."
              else
                echo "A test deleted or rewrote a tracked seed account. Delete only what the test created,"
                echo "by the email it chose, and never User::all() in bulk; or re-root the users store"
                echo "the way Tests\\Support\\BrowserWriteIsolation does."
              fi
              code=1
            else
