    handle: certifications
    field:
      collapse: true
      type: replicator
      display: Certifications
      button_label: 'Add Certification'
      localizable: false
      sets:
        certifications_set_group:
          display: 'Certifications Set Group'
          sets:
            board_certification:
              display: 'Board Certification'
              fields:
                -
                  import: uamsweb_common_people_background_certification_board
            other_certification:
              display: 'Other Certification'
              fields:
                -
                  import: uamsweb_common_people_background_certification_general
  -
    handle: professional_and_leadership_development_activities
    field:
      collapse: true
      type: replicator
      display: 'Professional and Leadership Development Activities'
      button_label: 'Add Development Activity'
      localizable: false
      sets:
        professional_and_leadership_development_set_group:
          display: 'Professional and Leadership Development Activities Set Group'
          sets:
            professional_development_activity:
              display: 'Professional Development Activity'
              fields:
                -
                  handle: activity
                  field: uamsweb_common_people_background.professional_and_leadership_development_activities_term
                  config:
                    display: 'Professional Development Activity'
                    localizable: false
                    query_scopes:
                      - professional_development_activity_term
                    validate:
                      - required
