  hours_of_operation:
    display: 'Hours of Operation'
    sections:
      -
        display: 'Regular Hours'
        instructions: "Define this location's recurring weekly hours as a list of rules. Each rule applies a status (and, when open, one or more time spans) to one or more days for a single service mode. Use the day presets (Weekday, Weekend, Daily) to quickly add common patterns, or add a Custom rule. Add a telemedicine-mode rule only when telemedicine hours differ from the in-person hours (see the Telemedicine section)."
        fields:
          -
            handle: hours_variable_query
            field: uamsweb_common.true_false
            config:
              display: "Do this location's hours of operation either vary or follow an irregular schedule?"
              instructions: 'For example, does this location operate only periodically or as needed? If so, describe the schedule in prose below instead of adding hours rules.'
              clearable: true
              validate:
                - required
          -
            handle: variable_hours_description
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: "Description of the Location's Variable Hours of Operation"
              instructions: 'Describe how the hours of operation work for this location.'
              if:
                hours_variable_query: 'equals true'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: regular_hours
            field:
              type: replicator
              display: 'Hours Rules'
              instructions: 'Each rule sets a status (and time spans, when open) for the selected days and service mode.'
              button_label: 'Add Hours Rule'
              if:
                hours_variable_query: 'equals false'
              validate:
                - required
                - sometimes
              localizable: false
              sets:
                rules:
                  display: 'Hours Rules'
                  sets:
                    weekday:
                      display: 'Weekday Rule (Mon-Fri)'
                      instructions: 'Defaults to Monday through Friday; adjust the days if needed.'
                      fields:
                        -
                          handle: days
                          field: uamsweb_common_fad_hours_rule.days
                          config:
                            default:
                              - monday
                              - tuesday
                              - wednesday
                              - thursday
                              - friday
                            replicator_preview: false
                        -
                          handle: service_mode
                          field: uamsweb_common_fad_hours_rule.service_mode
                        -
                          handle: status
                          field: uamsweb_common_fad_hours_rule.status
                        -
                          handle: time_span
                          field: uamsweb_common_fad_hours_rule.time_span
                    weekend:
                      display: 'Weekend Rule (Sat-Sun)'
                      instructions: 'Defaults to Saturday and Sunday; adjust the days if needed.'
                      fields:
                        -
                          handle: days
                          field: uamsweb_common_fad_hours_rule.days
                          config:
                            default:
                              - saturday
                              - sunday
                            replicator_preview: false
                        -
                          handle: service_mode
                          field: uamsweb_common_fad_hours_rule.service_mode
                        -
                          handle: status
                          field: uamsweb_common_fad_hours_rule.status
                        -
                          handle: time_span
                          field: uamsweb_common_fad_hours_rule.time_span
                    daily:
                      display: 'Daily Rule (All Days)'
                      instructions: 'Applies to every day of the week. To cover only some days, use a Weekday, Weekend, or Custom rule instead.'
                      fields:
                        -
                          handle: days
                          field: uamsweb_common_fad_hours_rule.days
                          config:
                            default:
                              - monday
                              - tuesday
                              - wednesday
                              - thursday
                              - friday
                              - saturday
                              - sunday
                            visibility: read_only
                            replicator_preview: false
                            instructions: 'This rule applies to every day of the week. To cover only some days, use a Weekday, Weekend, or Custom rule instead.'
                        -
                          handle: service_mode
                          field: uamsweb_common_fad_hours_rule.service_mode
                        -
                          handle: status
                          field: uamsweb_common_fad_hours_rule.status
                        -
                          handle: time_span
                          field: uamsweb_common_fad_hours_rule.time_span
                    custom:
                      display: 'Custom Rule'
                      instructions: 'Choose the specific days this rule applies to.'
                      fields:
                        -
                          handle: days
                          field: uamsweb_common_fad_hours_rule.days
                        -
                          handle: service_mode
                          field: uamsweb_common_fad_hours_rule.service_mode
                        -
                          handle: status
                          field: uamsweb_common_fad_hours_rule.status
                        -
                          handle: time_span
                          field: uamsweb_common_fad_hours_rule.time_span
          -
            handle: after_hours_description
            field: uamsweb_common.bard_simple_lists_links
            config:
              display: 'Information for When the Location Is Closed'
              instructions: 'Describe what patients should do if they need assistance when this location is closed.'
              localizable: false
      -
        display: 'Special / Modified Hours'
        instructions: 'Add exceptions to the regular schedule here. Use a Holiday Hours entry for a specific holiday or short closure, and a Temporary Change for an extended period when hours differ for an exceptional reason (for example, a renovation or public-health emergency). Each entry overrides the regular hours for its date range.'
        fields:
          -
            handle: system_closures
            field:
              type: radio
              display: 'System-Wide Closures'
              instructions: 'System-wide holiday closures (for example, Thanksgiving) are set once in Find-a-Doc Settings and broadcast to every location. Choose whether this location honors them. Any Holiday Hours or Temporary Change you set below for the same date always takes precedence, so honoring the broadcast is safe.'
              options:
                -
                  key: honor
                  value: 'Honor system-wide closures'
                -
                  key: suppress
                  value: 'Ignore system-wide closures at this location'
              default: honor
              validate:
                - required
              localizable: false
          -
            handle: special_hours
            field:
              type: replicator
              display: 'Special Hours'
              instructions: 'Each entry overrides the regular hours for its date range.'
              button_label: 'Add Special Hours'
              localizable: false
              sets:
                special:
                  display: 'Special Hours'
                  sets:
                    holiday:
                      display: 'Holiday Hours'
                      instructions: 'A named holiday or short closure. Add a rule for each day (or contiguous range of days) whose hours differ from the regular schedule; days that are already correct in the regular schedule need no rule.'
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: Title
                            instructions: 'The name of the holiday (for example, "Thanksgiving").'
                            validate:
                              - required
                            localizable: false
                        -
                          handle: description
                          field: uamsweb_common.bard_simple_lists_links
                          config:
                            display: Description
                            instructions: 'Optionally add a brief note (for example, "Reopening Tuesday at 8 a.m.").'
                            localizable: false
                        -
                          handle: rules
                          field:
                            type: replicator
                            display: 'Hours Rules'
                            instructions: 'Each rule applies a status (and time spans, when open) to a date or a contiguous range of dates within this holiday.'
                            button_label: 'Add Rule'
                            validate:
                              - required
                              - sometimes
                            localizable: false
                            sets:
                              rules:
                                display: 'Hours Rules'
                                sets:
                                  rule:
                                    display: Rule
                                    fields:
                                      -
                                        handle: date
                                        field:
                                          type: date
                                          display: Date
                                          instructions: 'The date this rule applies.'
                                          validate:
                                            - required
                                          localizable: false
                                      -
                                        handle: through
                                        field:
                                          type: date
                                          display: Through
                                          instructions: 'For a contiguous range of days with the same status (for example, Friday through Monday), the last date. Leave blank for a single day.'
                                          localizable: false
                                      -
                                        handle: service_mode
                                        field: uamsweb_common_fad_hours_rule.service_mode
                                      -
                                        handle: status
                                        field: uamsweb_common_fad_hours_rule.status
                                        config:
                                          default: closed
                                      -
                                        handle: time_span
                                        field: uamsweb_common_fad_hours_rule.time_span
                    temporary_change:
                      display: 'Temporary Change'
                      instructions: 'An extended period when hours differ from the regular schedule for an exceptional reason (for example, a renovation or public-health emergency). Set the date range, then add the hours rules that apply during it. Leave the through date blank if the change is ongoing.'
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: Title
                            instructions: 'A short name for this change (for example, "Temporary Closure for Renovation").'
                            validate:
                              - required
                            localizable: false
                        -
                          handle: description
                          field: uamsweb_common.bard_simple_lists_links
                          config:
                            display: Description
                            instructions: 'Explain the reason for the change and what patients should do.'
                            validate:
                              - required
                            localizable: false
                        -
                          handle: valid_from
                          field:
                            type: date
                            display: 'Valid From'
                            instructions: 'The first date this change applies.'
                            validate:
                              - required
                            localizable: false
                        -
                          handle: valid_through
                          field:
                            type: date
                            display: 'Valid Through'
                            instructions: 'The last date this change applies. Leave blank if the change is ongoing or the end date is unknown.'
                            localizable: false
                        -
                          handle: rules
                          field:
                            type: replicator
                            display: 'Hours Rules'
                            instructions: 'Each rule sets a status (and time spans, when open) for the selected days and service mode during this period.'
                            button_label: 'Add Hours Rule'
                            validate:
                              - required
                              - sometimes
                            localizable: false
                            sets:
                              rules:
                                display: 'Hours Rules'
                                sets:
                                  weekday:
                                    display: 'Weekday Rule (Mon-Fri)'
                                    instructions: 'Defaults to Monday through Friday; adjust the days if needed.'
                                    fields:
                                      -
                                        handle: days
                                        field: uamsweb_common_fad_hours_rule.days
                                        config:
                                          default:
                                            - monday
                                            - tuesday
                                            - wednesday
                                            - thursday
                                            - friday
                                          replicator_preview: false
                                      -
                                        handle: service_mode
                                        field: uamsweb_common_fad_hours_rule.service_mode
                                      -
                                        handle: status
                                        field: uamsweb_common_fad_hours_rule.status
                                      -
                                        handle: time_span
                                        field: uamsweb_common_fad_hours_rule.time_span
                                  weekend:
                                    display: 'Weekend Rule (Sat-Sun)'
                                    instructions: 'Defaults to Saturday and Sunday; adjust the days if needed.'
                                    fields:
                                      -
                                        handle: days
                                        field: uamsweb_common_fad_hours_rule.days
                                        config:
                                          default:
                                            - saturday
                                            - sunday
                                          replicator_preview: false
                                      -
                                        handle: service_mode
                                        field: uamsweb_common_fad_hours_rule.service_mode
                                      -
                                        handle: status
                                        field: uamsweb_common_fad_hours_rule.status
                                      -
                                        handle: time_span
                                        field: uamsweb_common_fad_hours_rule.time_span
                                  daily:
                                    display: 'Daily Rule (All Days)'
                                    instructions: 'Applies to every day of the week. To cover only some days, use a Weekday, Weekend, or Custom rule instead.'
                                    fields:
                                      -
                                        handle: days
                                        field: uamsweb_common_fad_hours_rule.days
                                        config:
                                          default:
                                            - monday
                                            - tuesday
                                            - wednesday
                                            - thursday
                                            - friday
                                            - saturday
                                            - sunday
                                          visibility: read_only
                                          replicator_preview: false
                                          instructions: 'This rule applies to every day of the week. To cover only some days, use a Weekday, Weekend, or Custom rule instead.'
                                      -
                                        handle: service_mode
                                        field: uamsweb_common_fad_hours_rule.service_mode
                                      -
                                        handle: status
                                        field: uamsweb_common_fad_hours_rule.status
                                      -
                                        handle: time_span
                                        field: uamsweb_common_fad_hours_rule.time_span
                                  custom:
                                    display: 'Custom Rule'
                                    instructions: 'Choose the specific days this rule applies to.'
                                    fields:
                                      -
                                        handle: days
                                        field: uamsweb_common_fad_hours_rule.days
                                      -
                                        handle: service_mode
                                        field: uamsweb_common_fad_hours_rule.service_mode
                                      -
                                        handle: status
                                        field: uamsweb_common_fad_hours_rule.status
                                      -
                                        handle: time_span
                                        field: uamsweb_common_fad_hours_rule.time_span
  telemedicine:
