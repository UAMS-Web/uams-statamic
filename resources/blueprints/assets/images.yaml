tabs:
  main:
    display: Main
    sections:
      -
        display: 'Alternative Text'
        fields:
          -
            handle: exempt_from_alt
            field: uamsweb_common_images.exempt_from_alt
            config:
              localizable: false
          -
            handle: alt
            field: uamsweb_common_images.alt
            config:
              localizable: false
              focus: true
              if:
                exempt_from_alt: 'equals false'
              validate:
                - required
                - sometimes
      -
        display: Caption
        fields:
          -
            handle: caption
            field: uamsweb_common_images.caption
      -
        display: Creator
        fields:
          -
            handle: creator
            field: uamsweb_common_portraits.creator
            config:
              display: 'Photographer / Creator'
          -
            handle: creator_organization
            field: uamsweb_common_portraits.creator_organization
            config:
              display: 'Organization for Which the Image Was Created'
          -
            handle: country_of_origin_query
            field: uamsweb_common.true_false
            config:
              display: 'Created within the U.S.?'
              validate:
                - required
              localizable: false
      -
        display: Location
        collapsible: true
        fields:
          -
            handle: geographic_location
            field: uamsweb_creativework_location.geographic_location
            config:
              instructions: 'e.g., where a photo was taken'
              max_items: 1
              localizable: false
      -
        display: 'Image Content Origin and Transparency'
        collapsible: true
        fields:
          -
            handle: digital_source_type
            field: digital_source_type.digital_source_type_image
            config:
              hide_display: true
              fullscreen: false
              border: false
              validate:
                - required
