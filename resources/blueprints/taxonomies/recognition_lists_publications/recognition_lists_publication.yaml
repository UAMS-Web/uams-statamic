title: 'Recognition Lists, Publication'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: false
              validate:
                - required
              display: 'Term Title'
              instructions: 'This value is only used for display in the control panel.'
          -
            handle: schema_object
            field:
              collections:
                - schema_objects
              max_items: 1
              query_scopes:
                - entries_by_schema_type_organization
              type: entries
              display: 'Schema Object for the Organization'
              instructions: 'Select a schema object for the organization, if available.'
              localizable: true
              create: false
              validate:
                - 'entry_schema_type_in:Organization'
          -
            handle: name
            field:
              type: text
              display: 'Publication Name'
              instructions: |-
                Name the taxonomy item using only the full official name of the publication (e.g., "Arkansas Times").

                Do not include the word "The" at the beginning of the name.

                Do not follow the full name of the publication with an abbreviation or acronym in parentheses or set off by dashes.
              if:
                schema_object: 'equals empty'
              validate:
                - required
                - sometimes
              localizable: false
          -
            import: uamsweb_schema_basic
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
              localizable: false
