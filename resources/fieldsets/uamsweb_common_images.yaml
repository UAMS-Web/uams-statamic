title: 'UAMSWeb Common Reusable Fields, Images'
fields:
  -
    handle: exempt_from_alt
    field: uamsweb_common.true_false
    config:
      display: 'Exempt From Alt Text'
      instructions: "When enabled, this image won't show up in the control panel dashboard as an image that misses alt text. Images without an alt text will automatically be hidden for screen readers."
      validate:
        - required
      localizable: false
  -
    handle: alt
    field:
      display: 'Alt Text'
      type: textarea
      instructions: |-
        Provide a concise description of the image's content and purpose to ensure users who cannot see it, such as those using screen readers, understand its meaning.

        The alt text remains hidden from sighted users unless the image fails to load.

        Focus on the essential information the image conveys, like "Red apple" for a picture of a red apple. Additionally, well-written alt text improves search engine optimization by helping search engines interpret the image's content.
      localizable: false
      if:
        exempt_from_alt: 'equals false'
      validate:
        - required
        - sometimes
  -
    handle: image_alt_text_override
    field:
      type: textarea
      display: 'Image Alt Text Override'
      instructions: |-
        If you want to specify alt text that differs from the one defined for this image in the asset library, you can do so here.

        Alt text (alternative text) should provide a concise description of the image's content and purpose to ensure users who cannot see it, such as those using screen readers, understand its meaning.
      replicator_preview: false
      localizable: false
  -
    handle: caption
    field:
      display: Caption
      type: textarea
      instructions: |-
        A caption should provide additional context or details about the asset to enhance the user's understanding. Captions complement the alt text and can further support accessibility and engagement for all users.

        Write details such as the subject, location, date, or other relevant information, like "A red apple from our family orchard" for a red apple image.

        The caption will be displayed to everyone below the asset.
      localizable: false
  -
    handle: image_caption_override
    field:
      type: textarea
      display: 'Image Caption Override'
      instructions: |-
        If you want to specify caption text that differs from the one defined for this image in the asset library, you can do so here.

        A caption should provide additional context or details about the asset to enhance the user's understanding. Captions complement the alt text and can further support accessibility and engagement for all users.

        Write details such as the subject, location, date, or other relevant information, like "A red apple from our family orchard" for a red apple image.

        The caption will be displayed to everyone below the asset.
      replicator_preview: false
      localizable: false
  -
    handle: image
    field:
      container: images
      max_files: 1
      type: assets
      localizable: true
      display: Image
      always_save: false
  -
    handle: portrait
