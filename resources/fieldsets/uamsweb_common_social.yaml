title: 'UAMSWeb Common Reusable Fields, Social Media'
fields:
  -
    handle: bluesky
    field:
      type: group
      display: Bluesky
      localizable: false
      fields:
        -
          handle: handle
          field:
            type: text
            prepend: 'https://bsky.app/profile/'
            display: Handle
        -
          handle: prefix
          field:
            type: hidden
            default: 'https://bsky.app/profile/'
            if:
              handle: 'not empty'
        -
          handle: icon
          field:
            type: hidden
            default: 'fab fa-bluesky'
            localizable: false
            if:
              handle: 'not empty'
        -
          handle: name
          field:
            type: hidden
            default: Bluesky
            localizable: false
            if:
              handle: 'not empty'
