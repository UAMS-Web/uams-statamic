tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: 'Term Title'
              instructions: 'This value is only used for display in the control panel.'
              localizable: false
          -
            handle: schema_object
            field:
              collections:
                - schema_objects
              max_items: 1
              query_scopes:
                - entries_by_schema_type_organization
              type: entries
              display: 'Schema Object for the Organization'
              instructions: 'Select a schema object for the organization, if available.'
              localizable: true
              create: false
              validate:
                - 'entry_schema_type_in:Organization'
      -
        display: Details
        collapsible: true
        fields:
          -
            handle: name
            field:
              placeholder: 'e.g., University of Arkansas for Medical Sciences'
              type: text
              display: 'Name for Schema'
              instructions: 'The official name of the education or training organization'
              if:
                schema_object: 'equals empty'
              validate:
                - required
                - sometimes
              localizable: false
          -
            handle: schema_type
            field:
              starting_types:
                - Organization
                - EducationalOrganization
              type: schema_type
              display: 'Schema Type for Organization'
              instructions: 'Select the schema type that most closely matches this education or training organization.'
              localizable: false
              if:
                schema_object: 'equals empty'
              validate:
                - required
                - sometimes
          -
            import: uamsweb_schema_basic
          -
            import: uamsweb_schema_descriptions
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
              localizable: false
title: 'Education or Training Organization'
