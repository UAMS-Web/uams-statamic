tabs:
  main:
    display: 'General Settings'
    sections:
      -
        fields:
          -
            handle: fad_jump_links_title
            field:
              type: text
              display: 'Jump Links Title'
              instructions: "When a page has a list of jump links (a.k.a. anchor links), this title defines the text used in the list's heading."
              placeholder: Content
              default: Content
              validate:
                - required
              localizable: false
      -
        display: 'API Keys'
        fields:
          -
            handle: fad_google_key
            field:
              type: text
              display: 'Google Maps API Key'
              localizable: false
      -
        display: 'Brand Organizations'
        fields:
          -
            handle: fad_default_brand_organization_clinical
            field:
              type: entries
              display: 'Default Clinical UAMS Brand Organization'
              instructions: 'Select the most specific UAMS brand organization to associate with every provider and location in schema data properties relevant to clinical practice by default.'
              max_items: 1
              create: false
              collections:
                - organizations
              query_scopes:
                - entries_by_provenance_first_party
                - entries_by_organization_role_brand
              select_across_sites: true
              localizable: false
          -
            handle: fad_default_brand_organization_affiliation
            field:
              type: entries
              display: 'Default UAMS Brand Organizations as Affiliations'
              instructions: 'Select the most specific UAMS brand organizations to list in the affiliations for every provider and location in schema data properties by default.'
              create: false
              collections:
                - organizations
              query_scopes:
                - entries_by_provenance_first_party
                - entries_by_organization_role_brand
              select_across_sites: true
              localizable: false
          -
            handle: fad_default_brand_organization_credit
            field:
              type: entries
              display: 'Default UAMS Brand Organizations to Credit'
              instructions: 'Select the UAMS brand organizations to credit as the creator for all creative works on the website by default. In order to'
              create: false
              collections:
                - organizations
              query_scopes:
                - entries_by_provenance_first_party
                - entries_by_organization_role_brand
              select_across_sites: true
              localizable: false
          -
            handle: fad_default_brand_organization_locationcreated
            field:
              type: entries
              display: 'Default UAMS Brand Organizations as the Locations Where the Website and Its Contents Were Created'
              instructions: 'Select the UAMS brand organization(s) to credit as the default location(s) where all creative works on the website were created. In order to generate valid schema data, the schema type or subtype of the selected organization(s) must also be a subtype of Location.'
              create: false
              collections:
                - organizations
              query_scopes:
                - entries_by_provenance_first_party
                - entries_by_organization_role_brand
              select_across_sites: true
              localizable: false
          -
            handle: fad_default_brand_organization_copyright
            field:
              type: entries
              display: 'Default UAMS Brand Organizations as Copyright Holder'
              instructions: 'Select the UAMS brand organizations to indicate as the default copyright holder for all creative works on the website.'
              max_items: 1
              create: false
              collections:
                - organizations
              query_scopes:
                - entries_by_provenance_first_party
                - entries_by_organization_role_brand
              select_across_sites: true
              localizable: false
  clinical_providers:
    display: 'Clinical Providers'
    sections:
      -
        display: 'Provider Labels'
        fields:
          -
            handle: provider_single_name
            field:
              type: text
              display: 'Single Item Name'
              placeholder: Provider
              default: Provider
              validate:
                - required
              localizable: false
          -
            handle: provider_plural_name
            field:
              type: text
              display: 'Plural Item Name'
              placeholder: Providers
              default: Providers
              validate:
                - required
              localizable: false
      -
        display: 'Providers Archive Page'
        fields:
          -
            handle: provider_archive_headline
            field:
              type: text
              display: 'Title of Provider Archive'
              instructions: 'Your theme uses accessible headings.'
              placeholder: 'UAMS Health Providers'
              default: 'UAMS Health Providers'
              validate:
                - required
              localizable: false
          -
            handle: provider_archive_featured_image
            field: uamsweb_common_images.image_1280x720_16_9_recommended
            config:
              display: 'Featured Image for the Provider Archive'
      -
        display: 'General Placement'
        fields:
          -
            handle: provider_fpage_title_message_general
            field:
              type: subsection
              display: 'General Information for a Fake Subpage (or Section) for Providers'
              localizable: false
          -
            handle: provider_fpage_title_general
            field:
              type: text
              display: 'General Title of a Fake Subpage (or Section) for Providers'
              instructions: "This value may be overridden by inputs specific to the text element's placement (e.g., title of a fake subpage (or section) for providers in an area of expertise subsection [or profile])."
              placeholder: 'Related Providers'
              default: 'Related Providers'
              validate:
                - required
              localizable: false
          -
            handle: provider_fpage_intro_general
            field:
              type: textarea
              display: 'General Intro Text of a Fake Subpage (or Section) for Providers'
              instructions: "This value may be overridden by inputs specific to the text element's placement (e.g., intro text of a fake subpage (or section) for providers in an area of expertise subsection [or profile])."
              character_limit: 117
              localizable: false
          -
            handle: provider_fpage_featured_image_general
            field: uamsweb_common_images.image_1280x720_16_9_recommended
            config:
              display: 'General Featured Image of a Fake Subpage (or Section) for Providers'
              instructions: |-
                If you leave this blank, the general placement image will be used.

                Recommended image dimensions: 2560x1920. Minimum image dimensions: 1280x720. Recommended aspect ratio: 16:9.
          -
            handle: provider_fpage_ref_main_message_general
            field:
              type: subsection
              display: 'General Reference to the Main Provider Archive'
              localizable: false
          -
            handle: provider_fpage_ref_main_title_general
            field:
              type: text
              display: 'General Title of a Reference to the Main Provider Archive'
              instructions: |-
                Fake subpages for providers contain references linking users back to the main provider archive. This sets the title used in that reference.

                This value may be overridden by inputs specific to the text element's placement (e.g., title in a reference to the main provider archive on a fake subpage for providers in an area of expertise subsection).
              placeholder: 'Full List of Providers'
              default: 'Full List of Providers'
              validate:
                - required
              localizable: false
          -
            handle: provider_fpage_ref_main_intro_general
            field:
              type: textarea
              display: 'General Body Text of a Reference to the Main Provider Archive'
              instructions: |-
                Fake subpages for providers contain references linking users back to the main provider archive. This sets the body text used in that reference.

                This value may be overridden by inputs specific to the text element's placement (e.g., body text in a reference to the main provider archive on a fake subpage for providers in an area of expertise subsection).
              placeholder: 'Explore providers across specialties for top care at UAMS Health.'
              default: 'Explore providers across specialties for top care at UAMS Health.'
              validate:
                - required
              character_limit: 117
              localizable: false
          -
            handle: provider_fpage_ref_main_link_general
            field:
              type: text
              display: 'General Link Text of a Reference to the Main Provider Archive'
              instructions: |-
                Fake subpages for providers contain references linking users back to the main provider archive. This sets the link text used in that reference.

                This value may be overridden by inputs specific to the text element's placement (e.g., link text in a reference to the main provider archive on a fake subpage for providers in an area of expertise subsection).
              placeholder: 'View All Providers'
              default: 'View All Providers'
              validate:
                - required
              localizable: false
          -
            handle: provider_fpage_ref_top_message_general
            field:
              type: subsection
              display: "General Reference to a Top-Level Ontology Item's Fake Subpage for Providers"
              localizable: false
          -
            handle: provider_fpage_ref_top_title_general
            field:
              type: text
              display: "General Title of a Reference to a Top-Level Ontology Item's Fake Subpage for Providers"
              instructions: 'Fake subpages under nested ontology items contain references linking users back to the same type of fake subpage under the top-level ancestor ontology item (e.g., from "Bone Cancer Care Providers" to "Cancer Care Providers"). This sets the title used in that reference.'
              placeholder: 'Full List of Providers'
              default: 'Full List of Providers'
              validate:
                - required
              localizable: false
          -
            handle: provider_fpage_ref_top_intro_general
            field:
              type: textarea
