boilerplate_heading: 'About UAMS'
boilerplate:
  -
    type: paragraph
    content:
      -
        type: text
        text: "UAMS is the state's only health sciences university, with colleges of Medicine, Nursing, Pharmacy, Health Professions and Public Health; a graduate school; a hospital; a main campus in Little Rock; a Northwest Arkansas regional campus in Fayetteville; a statewide network of regional campuses; and eight institutes: the Winthrop P. Rockefeller Cancer Institute, Jackson T. Stephens Spine & Neurosciences Institute, Harvey & Bernice Jones Eye Institute, Psychiatric Research Institute, Donald W. Reynolds Institute on Aging, Translational Research Institute, Institute for Digital Health & Innovation and the Institute for Community Health Innovation. UAMS includes UAMS\_Health, a statewide health system that encompasses all of UAMS' clinical enterprise. UAMS is the only adult Level 1 trauma center in the state. UAMS has 3,485 students, 915 medical residents and fellows, and seven dental residents. It is the state's largest public employer with more than 11,000 employees, including 1,200 physicians who provide care to patients at UAMS, its regional campuses, Arkansas Children's, the VA Medical Center and Baptist Health. Visit "
