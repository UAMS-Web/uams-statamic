name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow — including the expensive `browser` job — be run on demand
  # against a branch, rather than only on a pull request or a push to main.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run, so a pull request keeps
# one group. Every other run (a push to `main`, a manual run) gets a group of its own, keyed on
# the commit, so a later push never cancels it. A shared push group would: GitHub keeps one
# running and one pending run per group and cancels the pending one when another is queued,
# whatever `cancel-in-progress` says, so a merge landing during a long run cancelled the
# previous merge's run before it started a job. Its commit then showed only CodeQL's three
# settled green runs, and the chain never ran on it (#530). Pinned by
# `tests/Feature/Config/CiConcurrencyGroupTest.php`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing more (#391), except where a job-level
# block says otherwise. `GITHUB_TOKEN` is used by `actions/checkout`, and by `gh api`
# in the `pest` job's "Choose shard timings" (#519); private repositories are reached through
# `secrets.COMPOSER_AUTH_TOKEN`, and `actions/cache` and the artifact actions
# authenticate with the runner's own token, which `permissions` does not govern.
# A job that ever needs more gets a job-level block saying why.
permissions:
  contents: read

# Every `run:` step is bash on all three operating systems (#348), so one script
# serves each leg. Named, bash also runs with `-eo pipefail`, which the Linux default
# does not set.
defaults:
  run:
    shell: bash

# RUN_REMOTE_CI — budget kill-switch (UAMS-Web/uams-statamic-archive#980).
# GitHub Actions minutes are billed at the *organization* level (a single pool
# shared by every UAMS-Web repo), not per repo. When that budget is exhausted,
# every job here fails instantly on a billing error. To stop burning the queue
# until the monthly reset, set an Actions variable `RUN_REMOTE_CI` to `false`;
# every job below except the manual-run-only `submodule-access` and the aggregate
# `ci` is gated on
# `if: vars.RUN_REMOTE_CI != 'false'`, so they report `skipped` and consume zero
# runner minutes. Unset (or any value other
# than `false`) = CI runs exactly as before — the default is always-on.
#
#   - Define it as an ORG variable to flip all gated repos at once (matches the
#     org-wide budget); a REPO variable overrides the org value for this repo.
#   - `vars` cannot gate the `on:` triggers, only `if:` — the workflow still
#     evaluates per event, but skipped jobs are never dispatched to a runner.
#   - A ruleset on `main` requires `CI`, `Attribution footer` and `Closing
#     keywords` (#337, docs/runbooks/branch-protection.md). A job skipped by its
#     `if:` reports success to a required check, which is why the ruleset names
#     the aggregate `CI` job at the end of this file and none of the jobs it reads.
#     `CI` carries no `RUN_REMOTE_CI` gate and fails on a skipped job, so setting
#     the variable to `false` fails `CI` and holds every merge, rather than letting
#     each one through with nothing run. A check stays pending only when its whole
#     workflow never runs (a path filter, `[skip ci]`), so a head commit carrying
#     `[skip ci]` cannot merge either.
#   - While off, the shared local CI runner (`node scripts/ci-local.mjs`, configured
#     by `local-ci.json`) still validates a branch (no Actions minutes), but a green
#     local run cannot satisfy `CI`. Flip in Settings ->
#     Secrets and variables -> Actions -> Variables.
#   - An ORG variable whose visibility is "private repositories" does NOT reach
#     this repository, which is public. Measured 2026-10-27, the hour it was made
#     public: the org's `RUN_REMOTE_CI=false` read as 1 org variable from the
#     private `uams-statamic-archive` and 0 from here, and the full chain started
#     on every open pull request. To switch THIS repository off, set a REPO
#     variable; the org value cannot do it. Read 2026-11-01: 0 organization and
#     0 repository variables reach this repository, so every job runs.
#
# PARITY: `local-ci.json` reproduces every job below (all but the
# REMOTE-ONLY `submodule-access` and `ci`, noted further down), and the `checks`
# call's pint, rector and phpstan jobs, for local runs through the shared local CI
# runner (no Docker, no act, no Actions minutes). The jobs that run more than one
# command live in `scripts/ci-job.mjs` and the `scripts/gate-*.mjs` step scripts.
# The two sides are kept in lockstep BY HAND: when you add, remove, or change a job's
# command here, mirror it locally (and vice versa). The parity-critical
# surface is each job's final run step, flagged inline with `# PARITY:` below:
#   pest        -> "Run Pest (parallel shard, excluding the serial group)"
#                     (the local command plus `--shard`: CI splits the band
#                     four ways, six on Windows, the local runner runs it
#                     whole; #387, #516)
#   pest-serial -> "Run Pest (serial tail for the serial group)"
#   pest-report -> no counterpart: it merges the shards' reports, and its two
#                     band checks are the local pest job's parallel-band checks
#   mutate         -> "Run the mutation-tooling smoke"
#   build          -> "Build site assets" + "Build CP assets"
#   js             -> "Run JS unit tests"
#   spell          -> "Run cspell"
#   no-emoji-guard -> "Run no-emoji guard"
#   content-pointer-guard -> "Run content pointer guard"
#   encoding-guard -> "Run encoding guard"
#   test-isolation-guard -> "Run test isolation guard" + "Run global test symbol check"
#   composer-validate -> "Run composer validate" + "Run PSR-4 class check" +
#                     "Run one-class-per-file check"
#   browser        -> "Run CP browser smokes + accessibility gate" (mirrored as
#                     `--jobs browser`, and part of local-ci's default `all` set
#                     since UAMS-Web/uams-statamic-archive#1727 — the `browser-tests` label gate was removed in
#                     the same change). Runs the CP smokes and the §504/WCAG
#                     axe-core gate (UAMS-Web/uams-statamic-archive#1046), both in tests/Browser.
#   checks         -> no step here: the called chain's pint, rector and phpstan jobs
#                     run `composer test:pint`, `composer test:refactor` and
#                     `composer stan`, which the local pint, rector and phpstan
#                     jobs mirror. The local pint job checks the changed files only,
#                     where the called one checks every tracked file: `test:pint`
#                     names the dot-directories Pint's own finder skips (#580).
# THREE LEGS (#348): every job here but `submodule-access`, the `checks` call and the
# aggregate `ci` runs on
# ubuntu-latest, windows-latest and macos-latest, with `fail-fast: false` so one leg's
# failure does not cancel the others, and `ci` needs them all. The `checks` call's
# legs are the chain's own classification; see its comment. Windows differs in
# two places, each marked where it stands: each `pest` shard runs from a list of
# its test files instead of `--shard` (#504), and CLI OPcache stays off.
# JOB FAN-OUT: every job below runs in parallel. Two jobs declare `needs:`, each
# because it reads what the jobs it names leave behind. `pest-report` merges the
# reports of the `pest` shards (#387), and `ci` reads the result of every job
# (#337). Otherwise one job's
# failure neither skips nor delays another, and a run reports every fault it
# found rather than only the first. The `checks` call starts with the others, but
# the chain it calls orders its own jobs, which this file does not control: pint
# needs composer-validate and synced-files, and rector, phpstan and mutate-ignore
# need pint. A failure early in that chain therefore skips the later ones, so a run
# reports a PHPStan error only once a hand-edited synced file, say, is fixed (#580).
# Until #373 these ran as a strict sequential chain, cost-ordered shortest to
# longest, each job entered through `needs:` on the one before it, so an early
# failure never billed Actions minutes for the expensive jobs behind it. That
# protected a metered budget pooled across the whole organization. It does not
# apply here: this repository is public and every job runs on a standard runner,
# which GitHub does not meter for a public repository. With
# nothing left to save the trade inverts, and wall-clock is the longest job rather
# than the sum of all of them. Supersedes the 2026-07-15 entry in
# docs/DECISIONS.md, which superseded the UAMS-Web/uams-statamic-archive#1543 spell-only gate.
# DELIBERATELY NOT MIRRORED: `local-ci.json` sets `chain`, so the local runner stops
# at the first failure. It runs on ONE machine, where the jobs are serial
# whatever any graph says, and stopping early saves the developer's own wall-clock
# rather than a budget. So the parity contract below covers each job's COMMAND and
# the SET of jobs, never the order they run in; `scripts/ci-local.chain.test.mjs`
# asserts that set, and asserts that the only `needs:` edges here are `pest-report`
# on `pest` and the aggregate `ci` job's.
# LOCAL-ONLY (intentionally no job here): the local `dependencies` job
# (`scripts/prepare-dependencies.mjs`) installs into the runner's REUSED slot: it
# initializes the gate submodules, runs `composer install`, re-applies Composer
# patches whose set changed (on reuse `composer install` reports "Nothing to
# install", so a newly added patch is never applied otherwise;
# UAMS-Web/uams-statamic-archive#1743), clears the reused tree's file caches and runs
# `npm ci`. `scripts/gate-pest.mjs` resets the slot's runtime state (storage/framework,
# bootstrap caches, Stache; UAMS-Web/uams-statamic-archive#1164), and the shared
# runner's `prepare.residue` (in local-ci.json) refuses a slot holding files the commit
# under test deleted, in the directories it lists (UAMS-Web/uams-statamic-archive#1889).
# There is no counterpart here on purpose: every CI run starts from a fresh
# checkout, so there is never stale state, a stale patch set or residue to clear.
# LOCAL-ONLY (intentionally no step here): the shared runner fetches the branch
# from origin and checks the commit under test out in its slot, so a local run
# validates the branch's own `local-ci.json` and the commit the pull request
# points at. `actions/checkout` does the same here.
# REMOTE-ONLY (intentionally no job in local-ci.json): `ci` is the aggregate the ruleset
# on `main` requires, and it does nothing but read the other jobs' results (#337).
# EVERY JOB ADDED HERE GOES IN ITS `needs:` IN THE SAME CHANGE, or no check requires it;
# `scripts/ci-local.chain.test.mjs` fails until it does. `submodule-access` alone stays
# out, named with its reason in `.github/aggregate-needs-allow.json`.
# REMOTE-ONLY (no ci.yml job of its own): the `checks` call's synced-files,
# no-emoji, aggregate-needs and mutate-ignore jobs run shared checks. Locally the
# `synced-files` and `no-emoji` jobs run the first two, its composer-validate job
# runs the command the local `validate` job runs, its mutate-ignore job overlaps
# the local `encoding` job's auditor, and the chain test runs the aggregate-needs
# comparison.
# REMOTE-ONLY (intentionally no job in local-ci.json): `submodule-access` runs only on
# a manual `workflow_dispatch` and checks that `secrets.COMPOSER_AUTH_TOKEN` can clone
# the private submodules. That secret exists only on GitHub, and the local runner
# clones them with the developer's own credentials instead. See UAMS-Web/uams-statamic-archive#2497.
# Toolchain pins that must also match: PHP 8.4 (setup-php; `php` in local-ci.json),
# Node 22 (setup-node), and npm >= 11.10.0 (the `engines.npm` floor `.npmrc`'s
# engine-strict enforces, which fails the local `dependencies` job's `npm ci` on an
# older npm; UAMS-Web/uams-statamic-archive#1826).
# A pre-commit hook (`.githooks/pre-commit`, auto-wired by composer) blocks a
# commit that changes a `PARITY:` region on one side only; bypass with `--no-verify`.
# See `.claude/skills/local-ci/SKILL.md` for the shared runner and its configuration.

# `secrets.COMPOSER_AUTH_TOKEN` must be a Personal Access Token (or GitHub App
# installation token) with read access to UAMS-Web/wordpress-importer,
# UAMS-Web/uams-statamic-content, UAMS-Web/uams-statamic-users *and*
# UAMS-Web/uams-statamic-forms. Without the
# first, `composer install` fails on the private `uams-web/wordpress-importer`
# package; without the second, the content submodule clone fails with HTTP 403
# and `statamic:stache:warm` runs against an empty content directory; without
# the third, the users submodule clone fails the same way and the pest job
# stops before it runs (UAMS-Web/uams-statamic-archive#2477); without the fourth, the forms submodule clone
# fails the same way (UAMS-Web/uams-statamic-archive#2818). The default `GITHUB_TOKEN` cannot reach private
# repos in other repositories within the same org.

jobs:
  submodule-access:
    name: Submodule access (manual runs only)
    runs-on: ubuntu-latest
    # Proves that `secrets.COMPOSER_AUTH_TOKEN` can still clone every private
    # submodule the gates read, without switching remote CI back on (UAMS-Web/uams-statamic-archive#2497).
    # Every other job is gated on RUN_REMOTE_CI, so while that is `false` a manual
    # run does nothing; this job is the exception, on purpose.
    #
    # - Runs ONLY when the workflow is started by hand (`workflow_dispatch`), so a
    #   pull request or a push never runs it.
    # - Deliberately NOT gated on RUN_REMOTE_CI, and needs no other job, so a
    #   manual run reaches this step at once instead of after phpstan.
    # - Nothing `needs:` it, the aggregate `ci` job included, so it cannot skip
    #   or hold up any gate job.
    # - Re-run it by hand whenever a private submodule is added. The token is
    #   fine-grained, so a new repository must be added on its settings page
    #   first (the confirmed repository list is recorded on UAMS-Web/uams-statamic-archive#2497).
    #
    # REMOTE-ONLY (intentionally no counterpart in local-ci.json): it
    # checks a secret that exists only on GitHub. The local runner clones the
    # same submodules with the developer's own credentials (the Composer
    # `github-oauth` token, or git's credential helper) whenever a job needs them.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      # Must stay identical to the pest job's step of the same name, so a green
      # run here proves the step the pest job will run.
      # tests/Feature/GatesInitializeUsersSubmoduleTest.php pins that.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

  pest:
    name: Pest (parallel band, shard ${{ matrix.shard }} of ${{ matrix.os == 'windows-latest' && 6 || 4 }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The parallel band runs as four shards, one runner each (#387), and six on
    # Windows (#516). Run whole on
    # one runner it was the longest job in this file by far: about 22 minutes of
    # band plus setup against about 4 for the serial tail, so it decided the
    # workflow's wall-clock alone. Split four ways on recorded timings, the longest
    # shard job took 453s and 506s in two runs of the #384 spike, where the whole
    # band's job took about 1662s on main.
    #
    # Pest assigns test CLASSES to shards (`--shard=<i>/<total>`), from the per-class
    # timings in tests/.pest/shards.json when that file exists. Every shard here
    # reads the same copy (see "Place shard timings") and lists the band's tests,
    # and `pest-report` merges each leg's reports, refuses a band no shard ran whole,
    # and runs the two checks that judge the band as a whole. The serial group runs
    # beside the shards as `pest-serial`.
    #
    # Each shard repeats the full setup below, about half a minute per runner on
    # Linux. That repeated setup is why Linux and macOS run four shards and not
    # more: past four, the setup and the longest single class decide the job's
    # length, not the share of the band (#384).
    #
    # Windows is the exception, at six (#516). Its band takes about twice
    # Ubuntu's time, and its setup about 200s. On #514's run four Windows shards
    # took up to 1,316s, against 988s to 1,788s for the longest Windows job
    # outside the band, and six balanced on Windows timings are predicted at
    # about 895s. The floor is the largest Windows class (644s) plus setup,
    # about 853s, so a seventh shard would save about 40s more.
    #
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    strategy:
      # Every shard runs to its end, so one shard's failure does not hide another's.
      fail-fast: false
      matrix:
        # 1 to SHARD_TOTAL below on each leg. Each `include` entry changes a value
        # of every combination above, so it adds a combination of its own:
        # shards 5 and 6 on Windows only. scripts/local-ci.chain.test.mjs holds
        # the matrix and the totals together, and `pest-report` passes the same
        # total to the merge.
        shard: [1, 2, 3, 4]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            shard: 5
          - os: windows-latest
            shard: 6
    # `actions: read` lets "Choose shard timings" list the timings cache entries and
    # read when this run first started (#519); a job-level block replaces the
    # top-level one, so `contents: read` is restated.
    permissions:
      contents: read
      actions: read
    env:
      SHARD_TOTAL: ${{ matrix.os == 'windows-latest' && 6 || 4 }}
    steps:
      - uses: actions/checkout@v7

      # Asset containers, taxonomies, entries, and globals live in the private
      # `content/` submodule. Without it, `statamic:stache:warm` discovers
      # nothing and content-dependent tests fail with null lookups (e.g.
      # `Asset::container()` returning null in the augmented hook).
      #
      # `users/` is checked out too (UAMS-Web/uams-statamic-archive#2477). Since UAMS-Web/uams-statamic-archive#2454 it holds only the two
      # seed accounts and the `.gitignore` allowlist that keeps registrant
      # records out of git -- a 2 KB pack and no user data -- and checking it
      # out is what lets tests/Feature/Users/RegistrantRecordsAreGitIgnoredTest.php
      # run here rather than skip, so a reverted allowlist reds this job instead
      # of passing it.
      #
      # `resources/forms` is checked out too (UAMS-Web/uams-statamic-archive#2818): the form configurations live
      # in the private forms repository, and the tests that read the real forms
      # skip without it.
      #
      # The other two submodules (public/assets, app/private/assets)
      # hold binary assets and user data the PHPUnit suite does not need, so they
      # stay un-initialized to keep checkout cheap. The token reuse works because
      # these submodules live in the same UAMS-Web org as the private composer
      # package COMPOSER_AUTH_TOKEN is already scoped for.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

      # `shivammathur/setup-php` disables OPcache for the CLI by default. For a
      # framework-booted test suite this is the single biggest perf lever — every
      # `Tests\TestCase`-derived class re-bootstraps Laravel + Statamic, and the
      # bulk of that cost is parsing vendor sources. OPcache + JIT bring CI
      # within range of local PHP-with-OPcache wall-clock times.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # imagick: SvgRasterizerTest self-skips without it, and the app runs
          # IMAGE_MANIPULATION_DRIVER=imagick — so without it CI both misses that
          # coverage and skips 2 more than tests/skip-baseline.json records (UAMS-Web/uams-statamic-archive#1744).
          extensions: intl, mbstring, sqlite3, pdo_sqlite, dom, gd, fileinfo, bcmath, imagick, zip, exif, sockets
          coverage: none
          tools: composer:v2
          # `zend.assertions` and `pcre.jit` match what the local gate's PHP already
          # runs, because four tests are written to run only under those values and
          # self-skip otherwise: two assert an AssertionError and need assertions
          # compiled in, two induce a PCRE failure the JIT does not produce. The
          # runner's defaults (-1 and 1) made all four skip, which took the parallel
          # band to 5 skips against a baseline of 3 and failed
          # scripts/check-skip-baseline.php. Raising the baseline would have recorded
          # the coverage loss instead of fixing it, which that file's own header
          # forbids; matching the local environment restores the four tests.
          # CLI OPcache stays off on Windows (#348): a long run there ended in an access
          # violation with it on, JIT or no JIT.
          ini-values: opcache.enable_cli=${{ runner.os == 'Windows' && 'off' || 'on' }}, opcache.jit_buffer_size=64M, opcache.jit=tracing, zend.assertions=1, pcre.jit=0

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      # Run the Unit+Feature suite in parallel (paratest), turning a ~3h
      # single-process run into ~5 min by using every core. Two pieces keep the
      # split correct:
      #   - config/cache.php gives each worker an isolated per-TEST_TOKEN file
      #     cache, so a concurrent cache clear in one worker can't corrupt another;
      #     the existing per-process stache warm in tests/CreatesApplication.php
      #     then populates each worker's own cache, so no separate
      #     `statamic:stache:warm` step is needed.
      #   - phpunit.xml forces Statamic's NullCacher, whose lock is a no-op, so the
      #     static-cache middleware's per-URL lock can't 503 under cross-worker
      #     contention. It disables the Stache warming lock for the same reason:
      #     that one is a flock over the single, non-tokenized
      #     storage/statamic/stache-locks, held for the duration of a warm or a
      #     Duplicates::find(), so whoever holds it 503s every other worker's
      #     front-end request (UAMS-Web/uams-statamic-archive#1689). The seed step below makes a warm the
      #     fallback rather than the norm here, which narrows that window without
      #     closing it.
      # A few tests are parallel-fragile (an unpinnable race, or a hardcoded shared
      # path); they are tagged `->group('serial')` and run in the serial tail step
      # below rather than the parallel pass — see tests/README.md for the
      # convention. `-d pcov.enabled=0` keeps the gate coverage-free (a no-op here —
      # setup-php installs no coverage driver — but mirrors the local runner, where
      # PCOV is present). paratest auto-detects the runner's (stable) core count;
      # CI's CLI memory_limit is the -1 (unlimited) default, so workers need no
      # tuning.
      # Build the Stache seed once, in the testing env, before the parallel
      # suite. Each of the ~12 paratest workers otherwise runs
      # statamic:stache:warm at startup, and because all warm concurrently they
      # saturate the disk (~168s each vs 21s alone) — the dominant parallel cost
      # (UAMS-Web/uams-statamic-archive#1537). test:seed-stache warms once and snapshots; each worker then
      # copies the snapshot into its own per-worker cache (CreatesApplication)
      # instead of re-warming. Built as APP_ENV=testing so the snapshot matches
      # the env the workers read. DB_DATABASE=:memory: mirrors phpunit.xml: the
      # warm builds computed-field indexes that probe the DB (e.g. Schema::hasTable
      # in the article-engagement computed), so it needs a connectable database —
      # the tests use in-memory SQLite, and a fresh checkout has no sqlite file.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build Stache seed (testing env)
        run: 'DB_DATABASE=:memory: APP_ENV=testing php artisan test:seed-stache'

      # Build the route cache in the testing env before the suite so the URL
      # generator uses the compiled O(1) RouteCollection instead of scanning the
      # full table. mitydigital/sitemapamic registers one sitemap route per site
      # (255 on this multisite), and uncached URL generation scales with route
      # count, ~2x slower on the render-heavy suite (UAMS-Web/uams-statamic-archive#1537). Built as
      # APP_ENV=testing so an env-conditional route (e.g. the local-only dev
      # preview route) is baked exactly as the tests expect; a failure here also
      # surfaces a route the prod deploy's route:cache could not serialize.
      # Built AFTER the Stache seed (UAMS-Web/uams-statamic-archive#3106): routes/web.php registers each site's
      # feed.xml only when `Collection::findByHandle('posts')` resolves as the
      # route file loads, and against a cold Stache it does not, so the compiled
      # table would omit every feed route and PostsFeedRouteTest would 404.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build route cache (testing env)
        run: APP_ENV=testing php artisan route:cache

      # The timings Pest balances the shards on (#387). Each push to main writes
      # them, from that run's merged report, to the Actions cache (see
      # `pest-report`); a pull request reads one main wrote, since a branch can read
      # its base branch's cache. Every shard of a run must read the same entry, so
      # each one chooses it by the same rule: the newest entry created at or before
      # the run's FIRST attempt started. Restoring the newest entry by prefix instead
      # let a main push that saved an entry while a run's shards were starting split
      # them across two entries, and `pest-report` refused the run (#519). The first
      # attempt's start, not this attempt's, because "Re-run failed jobs" re-runs one
      # shard and merges it with the reports the others left in attempt 1.
      #
      # Each operating system chooses among its own timings, saved under
      # pest-shard-timings-<os>- (#516). A Windows runner cannot restore an entry a
      # Linux runner saved (`enableCrossOsArchive` is off), so while only the Ubuntu
      # leg saved, every Windows shard fell back to the committed file ("Cache not
      # found" on #514's run 41440485266).
      #
      # With no entry from before that start (a new repository, or an evicted cache)
      # a committed copy is used instead: .github/pest-shards.<os>.json where one
      # exists, and .github/pest-shards.json otherwise.
      #
      # REMOTE-ONLY: the local runner runs the parallel band whole, so it reads
      # no timings.
      - name: Choose shard timings
        id: choose-timings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PREFIX: pest-shard-timings-${{ matrix.os }}-
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/1" --jq .run_started_at)
          gh api "repos/$REPO/actions/caches?key=$PREFIX&ref=refs/heads/main&sort=created_at&direction=desc&per_page=100" > shard-timings-caches.json
          key=$(php scripts/select-shard-timings.php --caches=shard-timings-caches.json --started="$started" --prefix="$PREFIX")
          echo "Run's first attempt started $started; timings entry: ${key:-none from before the start}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore shard timings
        id: shard-timings
        if: steps.choose-timings.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: tests/.pest/shards.json
          key: ${{ steps.choose-timings.outputs.key }}

      # Logs which timings this shard read, and records their source and hash for
      # `pest-report`. Every shard partitions the band from its own copy, so
      # shards that read different copies (one shard's restore missing the chosen
      # entry, for one) can run a class twice or not at all; `pest-report` refuses
      # that by comparing the notes.
      - name: Place shard timings
        env:
          SHARD: ${{ matrix.shard }}
          MATCHED_KEY: ${{ steps.shard-timings.outputs.cache-matched-key }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          if [ -n "$MATCHED_KEY" ] && [ -s tests/.pest/shards.json ]; then
            source="cache entry $MATCHED_KEY"
          else
            committed=".github/pest-shards.$MATRIX_OS.json"
            [ -f "$committed" ] || committed=".github/pest-shards.json"
            mkdir -p tests/.pest
            cp "$committed" tests/.pest/shards.json
            source="committed $committed"
          fi
          note="source=$source sha256=$(sha256sum tests/.pest/shards.json | cut -d' ' -f1)"
          echo "Shard timings: $note"
          echo "$note" > "shard-timings-$SHARD.txt"

      # What the whole band holds, so `pest-report` can show the shards ran each
      # class exactly once. Listing loads the test files without running them.
      # REMOTE-ONLY: the local runner does not shard, so it has nothing to compare.
      - name: List the parallel band's tests
        env:
          SHARD: ${{ matrix.shard }}
        run: php -d pcov.enabled=0 vendor/bin/pest --list-tests --exclude-group=serial > "pest-list-$SHARD.txt"

      # NO --tia HERE, DELIBERATELY (UAMS-Web/uams-statamic-archive#1717). Pest 5's test-impact-analysis engine
      # replays cached results instead of executing tests it believes a change
      # cannot reach. It is excluded from BOTH bands below for three independent
      # reasons, any one of which is disqualifying:
      #
      #   1. No coverage driver. Tia builds its graph from coverage, and this job
      #      pins `coverage: none` above (scripts/gate-pest.mjs passes `-d pcov.enabled=0`).
      #      With no driver it records zero edges, and a graph with no edges marks
      #      nothing affected -- so every run replays and reports a green suite
      #      having executed nothing. Pest 5.0.1 does not warn about this.
      #   2. No persistent cache. Tia's graph lives at tests/.pest/tia/, which #192
      #      pins via `pest()->tia()->directory()` instead of the default
      #      ~/.pest/tia/<key>/. Either way every Actions job is a fresh checkout on
      #      a fresh runner, so the graph never survives; Tia here would need the
      #      --baselined artifact-fetch pipeline to do anything at all.
      #   3. The content/ blind spot. `.gitmodules` sets `ignore = dirty` on the
      #      content submodule, so `git status --porcelain` -- Tia's exact change
      #      detection -- reports nothing when content changes, and a submodule
      #      path is a directory, which Tia's watch-pattern fallback drops anyway.
      #      Reproduced: with one content entry added, --tia returned `2 passed,
      #      2 replayed` (exit 0) where --no-tia returned `1 failed` (exit 1).
      #
      # Tia IS available locally, opt-in, behind a guard that refuses to run under
      # conditions 1 and 3: `composer test:tia` (scripts/check-tia-safe.php). The
      # gate deliberately does not use it -- an exhaustive run is the whole point.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # --shard selects this job's share of the classes, and changes nothing about
      # how they run. --log-junit feeds `pest-report`, which merges the four shards'
      # reports before the skip-baseline and slowest-class checks read them. On
      # Windows the shard is selected by a configuration instead, in the steps
      # below (#504).
      - name: Run Pest (parallel shard, excluding the serial group)
        if: runner.os != 'Windows'
        env:
          SHARD: ${{ matrix.shard }}
        run: php -d pcov.enabled=0 vendor/bin/pest --parallel --exclude-group=serial --shard="$SHARD/$SHARD_TOTAL" --display-all-issues --log-junit "junit-parallel-$SHARD.xml"

      # Windows cannot pass `--shard` to the workers (#504): Pest turns the shard's
      # classes into a --filter of about 9,000 characters, paratest starts each
      # worker through cmd.exe, and cmd.exe refuses a command past 8,191. So the
      # shard is listed in this one process, where the same partition applies, and
      # handed to the workers as a configuration that names its files.
      # scripts/pest-shard-config.php fails on an empty listing or a class with no
      # file, and `pest-report` still checks the shards ran every class once.
      - name: List this shard's tests on Windows
        if: runner.os == 'Windows'
        env:
          SHARD: ${{ matrix.shard }}
        run: php -d pcov.enabled=0 vendor/bin/pest --list-tests --exclude-group=serial --shard="$SHARD/$SHARD_TOTAL" > "pest-shard-list-$SHARD.txt"

      - name: Write this shard's configuration on Windows
        if: runner.os == 'Windows'
        env:
          SHARD: ${{ matrix.shard }}
        run: php scripts/pest-shard-config.php --listing="pest-shard-list-$SHARD.txt" --out="phpunit.shard-$SHARD.xml"

      # PARITY: mirrored by scripts/gate-pest.mjs, less the configuration.
      - name: Run Pest (parallel shard on Windows, from its file list)
        if: runner.os == 'Windows'
        env:
          SHARD: ${{ matrix.shard }}
        run: php -d pcov.enabled=0 vendor/bin/pest --parallel --exclude-group=serial --configuration="phpunit.shard-$SHARD.xml" --display-all-issues --log-junit "junit-parallel-$SHARD.xml"

      # Only a shard whose band passed uploads, and `pest-report` needs all of them,
      # so a failed shard leaves the report job skipped rather than merging an
      # incomplete band.
      - name: Upload the shard's report, listing and timings note
        uses: actions/upload-artifact@v7
        with:
          name: pest-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            junit-parallel-${{ matrix.shard }}.xml
            pest-list-${{ matrix.shard }}.txt
            shard-timings-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 7

      # Every test process holds the content mirror band lock shared, and a child a
      # test spawns inherits that descriptor, so the lock can outlive both bands and
      # refuse every later `test:seed-stache` with nothing naming a lock or a
      # process (UAMS-Web/uams-statamic-archive#3018). Probed only here, after the serial tail: a live band
      # legitimately holds the lock. `if: always()` because a failed band can leave
      # a child behind as easily as a passing one. PHP, not Node, as above.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check the content mirror band lock was released
        if: always()
        run: php scripts/check-band-lock-released.php

      # Clear the cached table so it can't leak into a warm-runner rerun.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Clear route cache
        if: always()
        run: php artisan route:clear

      # A test that persists a fixture into the live content/ submodule strands the
      # file whenever the process does not reach its cleanup — a band killed at its
      # bound, or one that fatals (UAMS-Web/uams-statamic-archive#1873). Locally that dirties the checkout for every
      # later run, and the stray is boot-visible input: `statamic:stache:warm` indexes
      # it and memoizes a collection-structure entry against the real collection, which
      # is the state that produced UAMS-Web/uams-statamic-archive#1845.
      #
      # `if: always()` deliberately: a band that FAILED is exactly the case where
      # cleanup did not run, so skipping the check on failure would hide the litter in
      # the run most likely to have produced it.
      #
      # No before/after diff here, unlike scripts/gate-pest.mjs: this runner checks out
      # fresh, so anything dirty was written by this run. The local runner reuses its
      # slot and therefore has to tell the two apart.
      #
      # users/ is checked the same way since UAMS-Web/uams-statamic-archive#2477 checked it out: the file user
      # driver writes there, and what this catches is not a test-created account
      # (the allowlist ignores those, and --untracked-files=all lists untracked, not
      # ignored) but a tracked seed account a test deleted or rewrote.
      # resources/forms/ is checked since UAMS-Web/uams-statamic-archive#2818 made it a submodule: a test that saves
      # a form without re-rooting statamic.forms.forms writes its YAML there.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # Nothing is held aside any more. `models/assets/` used to be, mirroring
      # KNOWN_CONTENT_LITTER in scripts/gate-pest.mjs, because app/Models/Asset.php
      # rewrote content/models/assets/{id}.yml through base_path() on model save,
      # outside the Stache, where no store re-root reached it. UAMS-Web/uams-statamic-archive#1919 closed that at the
      # seam — Asset::$skipYamlSync is armed for every test by Tests\TestCase::setUp() —
      # so the exemption came out and this gate now fails on any write at all.
      - name: Check the suite left content/, users/ and resources/forms/ clean
        if: always()
        run: |
          code=0
          for sub in content users resources/forms; do
            dirty=$(git -C "$sub" status --porcelain --untracked-files=all)
            if [ -n "$dirty" ]; then
              echo "::error::The suite wrote into the $sub/ submodule:"
              echo "$dirty"
              if [ "$sub" = resources/forms ]; then
                echo "A test saved a form into the live forms submodule. Point statamic.forms.forms"
                echo "at a throwaway directory for the test, the way the Feature/Forms tests do."
              elif [ "$sub" = content ]; then
                echo "Put the test on Tests\\Support\\CollectionTreeIsolatedTestCase, which re-roots the"
                echo "collection-trees store at a throwaway directory so its writes land in"
                echo "storage/framework/testing/ instead of the live submodule."
              else
                echo "A test deleted or rewrote a tracked seed account. Delete only what the test created,"
                echo "by the email it chose, and never User::all() in bulk; or re-root the users store"
                echo "the way Tests\\Support\\BrowserWriteIsolation does."
              fi
              code=1
            else
              echo "$sub/ litter: none — the suite left the submodule as it found it."
            fi
          done
          exit "$code"

  pest-serial:
    name: Pest (serial group)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # The serial group, beside the parallel band's shards rather than after them
    # (#387): the two share nothing at run time, since each job has its own
    # checkout, seed and route cache. Its setup is the shards' setup, step for
    # step; scripts/local-ci.chain.test.mjs holds the two together.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7

      # Asset containers, taxonomies, entries, and globals live in the private
      # `content/` submodule. Without it, `statamic:stache:warm` discovers
      # nothing and content-dependent tests fail with null lookups (e.g.
      # `Asset::container()` returning null in the augmented hook).
      #
      # `users/` is checked out too (UAMS-Web/uams-statamic-archive#2477). Since UAMS-Web/uams-statamic-archive#2454 it holds only the two
      # seed accounts and the `.gitignore` allowlist that keeps registrant
      # records out of git -- a 2 KB pack and no user data -- and checking it
      # out is what lets tests/Feature/Users/RegistrantRecordsAreGitIgnoredTest.php
      # run here rather than skip, so a reverted allowlist reds this job instead
      # of passing it.
      #
      # `resources/forms` is checked out too (UAMS-Web/uams-statamic-archive#2818): the form configurations live
      # in the private forms repository, and the tests that read the real forms
      # skip without it.
      #
      # The other two submodules (public/assets, app/private/assets)
      # hold binary assets and user data the PHPUnit suite does not need, so they
      # stay un-initialized to keep checkout cheap. The token reuse works because
      # these submodules live in the same UAMS-Web org as the private composer
      # package COMPOSER_AUTH_TOKEN is already scoped for.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

      # `shivammathur/setup-php` disables OPcache for the CLI by default. For a
      # framework-booted test suite this is the single biggest perf lever — every
      # `Tests\TestCase`-derived class re-bootstraps Laravel + Statamic, and the
      # bulk of that cost is parsing vendor sources. OPcache + JIT bring CI
      # within range of local PHP-with-OPcache wall-clock times.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # imagick: SvgRasterizerTest self-skips without it, and the app runs
          # IMAGE_MANIPULATION_DRIVER=imagick — so without it CI both misses that
          # coverage and skips 2 more than tests/skip-baseline.json records (UAMS-Web/uams-statamic-archive#1744).
          extensions: intl, mbstring, sqlite3, pdo_sqlite, dom, gd, fileinfo, bcmath, imagick, zip, exif, sockets
          coverage: none
          tools: composer:v2
          # `zend.assertions` and `pcre.jit` match what the local gate's PHP already
          # runs, because four tests are written to run only under those values and
          # self-skip otherwise: two assert an AssertionError and need assertions
          # compiled in, two induce a PCRE failure the JIT does not produce. The
          # runner's defaults (-1 and 1) made all four skip, which took the parallel
          # band to 5 skips against a baseline of 3 and failed
          # scripts/check-skip-baseline.php. Raising the baseline would have recorded
          # the coverage loss instead of fixing it, which that file's own header
          # forbids; matching the local environment restores the four tests.
          # CLI OPcache stays off on Windows (#348): a long run there ended in an access
          # violation with it on, JIT or no JIT.
          ini-values: opcache.enable_cli=${{ runner.os == 'Windows' && 'off' || 'on' }}, opcache.jit_buffer_size=64M, opcache.jit=tracing, zend.assertions=1, pcre.jit=0

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      # Run the Unit+Feature suite in parallel (paratest), turning a ~3h
      # single-process run into ~5 min by using every core. Two pieces keep the
      # split correct:
      #   - config/cache.php gives each worker an isolated per-TEST_TOKEN file
      #     cache, so a concurrent cache clear in one worker can't corrupt another;
      #     the existing per-process stache warm in tests/CreatesApplication.php
      #     then populates each worker's own cache, so no separate
      #     `statamic:stache:warm` step is needed.
      #   - phpunit.xml forces Statamic's NullCacher, whose lock is a no-op, so the
      #     static-cache middleware's per-URL lock can't 503 under cross-worker
      #     contention. It disables the Stache warming lock for the same reason:
      #     that one is a flock over the single, non-tokenized
      #     storage/statamic/stache-locks, held for the duration of a warm or a
      #     Duplicates::find(), so whoever holds it 503s every other worker's
      #     front-end request (UAMS-Web/uams-statamic-archive#1689). The seed step below makes a warm the
      #     fallback rather than the norm here, which narrows that window without
      #     closing it.
      # A few tests are parallel-fragile (an unpinnable race, or a hardcoded shared
      # path); they are tagged `->group('serial')` and run in the serial tail step
      # below rather than the parallel pass — see tests/README.md for the
      # convention. `-d pcov.enabled=0` keeps the gate coverage-free (a no-op here —
      # setup-php installs no coverage driver — but mirrors the local runner, where
      # PCOV is present). paratest auto-detects the runner's (stable) core count;
      # CI's CLI memory_limit is the -1 (unlimited) default, so workers need no
      # tuning.
      # Build the Stache seed once, in the testing env, before the parallel
      # suite. Each of the ~12 paratest workers otherwise runs
      # statamic:stache:warm at startup, and because all warm concurrently they
      # saturate the disk (~168s each vs 21s alone) — the dominant parallel cost
      # (UAMS-Web/uams-statamic-archive#1537). test:seed-stache warms once and snapshots; each worker then
      # copies the snapshot into its own per-worker cache (CreatesApplication)
      # instead of re-warming. Built as APP_ENV=testing so the snapshot matches
      # the env the workers read. DB_DATABASE=:memory: mirrors phpunit.xml: the
      # warm builds computed-field indexes that probe the DB (e.g. Schema::hasTable
      # in the article-engagement computed), so it needs a connectable database —
      # the tests use in-memory SQLite, and a fresh checkout has no sqlite file.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build Stache seed (testing env)
        run: 'DB_DATABASE=:memory: APP_ENV=testing php artisan test:seed-stache'

      # Build the route cache in the testing env before the suite so the URL
      # generator uses the compiled O(1) RouteCollection instead of scanning the
      # full table. mitydigital/sitemapamic registers one sitemap route per site
      # (255 on this multisite), and uncached URL generation scales with route
      # count, ~2x slower on the render-heavy suite (UAMS-Web/uams-statamic-archive#1537). Built as
      # APP_ENV=testing so an env-conditional route (e.g. the local-only dev
      # preview route) is baked exactly as the tests expect; a failure here also
      # surfaces a route the prod deploy's route:cache could not serialize.
      # Built AFTER the Stache seed (UAMS-Web/uams-statamic-archive#3106): routes/web.php registers each site's
      # feed.xml only when `Collection::findByHandle('posts')` resolves as the
      # route file loads, and against a cold Stache it does not, so the compiled
      # table would omit every feed route and PostsFeedRouteTest would 404.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Build route cache (testing env)
        run: APP_ENV=testing php artisan route:cache

      # NO --tia HERE, DELIBERATELY (UAMS-Web/uams-statamic-archive#1717). Pest 5's test-impact-analysis engine
      # replays cached results instead of executing tests it believes a change
      # cannot reach. It is excluded from BOTH bands below for three independent
      # reasons, any one of which is disqualifying:
      #
      #   1. No coverage driver. Tia builds its graph from coverage, and this job
      #      pins `coverage: none` above (scripts/gate-pest.mjs passes `-d pcov.enabled=0`).
      #      With no driver it records zero edges, and a graph with no edges marks
      #      nothing affected -- so every run replays and reports a green suite
      #      having executed nothing. Pest 5.0.1 does not warn about this.
      #   2. No persistent cache. Tia's graph lives at tests/.pest/tia/, which #192
      #      pins via `pest()->tia()->directory()` instead of the default
      #      ~/.pest/tia/<key>/. Either way every Actions job is a fresh checkout on
      #      a fresh runner, so the graph never survives; Tia here would need the
      #      --baselined artifact-fetch pipeline to do anything at all.
      #   3. The content/ blind spot. `.gitmodules` sets `ignore = dirty` on the
      #      content submodule, so `git status --porcelain` -- Tia's exact change
      #      detection -- reports nothing when content changes, and a submodule
      #      path is a directory, which Tia's watch-pattern fallback drops anyway.
      #      Reproduced: with one content entry added, --tia returned `2 passed,
      #      2 replayed` (exit 0) where --no-tia returned `1 failed` (exit 1).
      #
      # Tia IS available locally, opt-in, behind a guard that refuses to run under
      # conditions 1 and 3: `composer test:tia` (scripts/check-tia-safe.php). The
      # gate deliberately does not use it -- an exhaustive run is the whole point.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # The serial tail runs the parallel-fragile `->group('serial')` tests in a
      # single process (no --parallel), where they are reliable.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Run Pest (serial tail for the serial group)
        run: php -d pcov.enabled=0 vendor/bin/pest --group=serial --display-all-issues --log-junit junit-serial.xml

      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check skip baseline (serial band)
        run: php scripts/check-skip-baseline.php --report=junit-serial.xml --band=serial

      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check slowest class (serial band)
        run: php scripts/check-slowest-class.php --report=junit-serial.xml --band=serial

      # Every test process holds the content mirror band lock shared, and a child a
      # test spawns inherits that descriptor, so the lock can outlive both bands and
      # refuse every later `test:seed-stache` with nothing naming a lock or a
      # process (UAMS-Web/uams-statamic-archive#3018). Probed only here, after the serial tail: a live band
      # legitimately holds the lock. `if: always()` because a failed band can leave
      # a child behind as easily as a passing one. PHP, not Node, as above.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check the content mirror band lock was released
        if: always()
        run: php scripts/check-band-lock-released.php

      # Clear the cached table so it can't leak into a warm-runner rerun.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Clear route cache
        if: always()
        run: php artisan route:clear

      # A test that persists a fixture into the live content/ submodule strands the
      # file whenever the process does not reach its cleanup — a band killed at its
      # bound, or one that fatals (UAMS-Web/uams-statamic-archive#1873). Locally that dirties the checkout for every
      # later run, and the stray is boot-visible input: `statamic:stache:warm` indexes
      # it and memoizes a collection-structure entry against the real collection, which
      # is the state that produced UAMS-Web/uams-statamic-archive#1845.
      #
      # `if: always()` deliberately: a band that FAILED is exactly the case where
      # cleanup did not run, so skipping the check on failure would hide the litter in
      # the run most likely to have produced it.
      #
      # No before/after diff here, unlike scripts/gate-pest.mjs: this runner checks out
      # fresh, so anything dirty was written by this run. The local runner reuses its
      # slot and therefore has to tell the two apart.
      #
      # users/ is checked the same way since UAMS-Web/uams-statamic-archive#2477 checked it out: the file user
      # driver writes there, and what this catches is not a test-created account
      # (the allowlist ignores those, and --untracked-files=all lists untracked, not
      # ignored) but a tracked seed account a test deleted or rewrote.
      # resources/forms/ is checked since UAMS-Web/uams-statamic-archive#2818 made it a submodule: a test that saves
      # a form without re-rooting statamic.forms.forms writes its YAML there.
      # PARITY: mirrored by scripts/gate-pest.mjs.
      # Nothing is held aside any more. `models/assets/` used to be, mirroring
      # KNOWN_CONTENT_LITTER in scripts/gate-pest.mjs, because app/Models/Asset.php
      # rewrote content/models/assets/{id}.yml through base_path() on model save,
      # outside the Stache, where no store re-root reached it. UAMS-Web/uams-statamic-archive#1919 closed that at the
      # seam — Asset::$skipYamlSync is armed for every test by Tests\TestCase::setUp() —
      # so the exemption came out and this gate now fails on any write at all.
      - name: Check the suite left content/, users/ and resources/forms/ clean
        if: always()
        run: |
          code=0
          for sub in content users resources/forms; do
            dirty=$(git -C "$sub" status --porcelain --untracked-files=all)
            if [ -n "$dirty" ]; then
              echo "::error::The suite wrote into the $sub/ submodule:"
              echo "$dirty"
              if [ "$sub" = resources/forms ]; then
                echo "A test saved a form into the live forms submodule. Point statamic.forms.forms"
                echo "at a throwaway directory for the test, the way the Feature/Forms tests do."
              elif [ "$sub" = content ]; then
                echo "Put the test on Tests\\Support\\CollectionTreeIsolatedTestCase, which re-roots the"
                echo "collection-trees store at a throwaway directory so its writes land in"
                echo "storage/framework/testing/ instead of the live submodule."
              else
                echo "A test deleted or rewrote a tracked seed account. Delete only what the test created,"
                echo "by the email it chose, and never User::all() in bulk; or re-root the users store"
                echo "the way Tests\\Support\\BrowserWriteIsolation does."
              fi
              code=1
            else
              echo "$sub/ litter: none — the suite left the submodule as it found it."
            fi
          done
          exit "$code"

  pest-report:
    name: Pest (parallel band report)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Merges each leg's shard reports into the one parallel band report the two
    # band checks read, and refuses a band the shards did not run exactly once
    # (#387). Both checks judge the WHOLE band: the skip baseline is a count for
    # the whole band, and the slowest class is judged by its share of the whole
    # band's time. Fed one shard's report, the first compares a fraction of the
    # band with a whole-band baseline and the second divides by a fraction of the
    # band, so neither runs in a shard.
    #
    # One of the two `needs:` lists in this file, and the reason it is allowed: this job
    # reads the shards' output, so it cannot run before them. It skips when any
    # shard fails, as the checks below skipped in the single job when the band
    # failed; the failed shard already fails the run.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    needs: pest
    if: vars.RUN_REMOTE_CI != 'false'
    env:
      SHARD_TOTAL: ${{ matrix.os == 'windows-latest' && 6 || 4 }}
    steps:
      - uses: actions/checkout@v7

      # Reading XML only: no extensions beyond setup-php's defaults, which include
      # dom, and no Composer install.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Download the shards' reports
        uses: actions/download-artifact@v8
        with:
          pattern: pest-shard-${{ matrix.os }}-*
          path: shards
          merge-multiple: true

      # Writes junit-parallel.xml, the band report the checks below read, and the
      # per-class timings the next run balances its shards on. Fails, naming what
      # it found, when a shard's files are missing, the shards read different
      # timings or listed different tests, a case ran in two shards, or a class's
      # case count differs from the listing. PHP, not Node, like the checks.
      # REMOTE-ONLY: the local runner writes junit-parallel.xml from one band.
      - name: Merge the shard reports into the parallel band report
        run: php scripts/merge-shard-reports.php --dir=shards --total="$SHARD_TOTAL" --report=junit-parallel.xml --timings=tests/.pest/shards.json

      # A band that silently skips tests reports PASS having tested less than it
      # should have. Skips are how this suite degrades when content or Stache state
      # is unavailable (UAMS-Web/uams-statamic-archive#1738, UAMS-Web/uams-statamic-archive#1740) — deliberate, but invisible to the gate until
      # now. During UAMS-Web/uams-statamic-archive#1726's validation three tests self-skipped and the band still
      # passed, caught only because the count had been predicted by hand. The
      # baseline lives in tests/skip-baseline.json so raising it is a reviewable act.
      # PHP, not Node: this job sets up PHP but not Node. (scripts/gate-pest.mjs additionally
      # tolerates the guard being absent, since it validates older branches too; CI
      # only ever runs a branch's own workflow, so no counterpart is needed here.)
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check skip baseline (parallel band)
        run: php scripts/check-skip-baseline.php --report=junit-parallel.xml --band=parallel

      # Nothing pinned what the parallel band COSTS, so a change that reclaimed it
      # passed in silence — the gate reports PASS on any duration. It has happened
      # twice: UAMS-Web/uams-statamic-archive#1348 added one `sitemap.xml` route per site (255 on this multisite)
      # and uncached URL generation taxed the render-heavy suite ~2x (UAMS-Web/uams-statamic-archive#1521 →
      # UAMS-Web/uams-statamic-archive#1573), and one class grew to 1085.3s of a 1306s band while eleven of twelve
      # workers idled (UAMS-Web/uams-statamic-archive#1797). Both were found by hand, long after the fact.
      #
      # Guards the slowest CLASS by its SHARE of the band's summed class time, plus
      # a generous absolute backstop. A JUnit `time` is wall-clock per test, so raw
      # class seconds inflate with runner load exactly as band wall time does
      # (UAMS-Web/uams-statamic-archive#2530); a share cancels that inflation, and is what decides whether a class
      # bounds the band, since paratest distributes by class. Reads the reports
      # the two steps above already produced, so it costs no extra run. PHP, not
      # Node, for the same reason as the skip guard: this job sets up PHP only.
      # (scripts/gate-pest.mjs additionally tolerates the guard being absent, since it
      # validates older branches too.)
      # On these GitHub-hosted runners a share over the ceiling is printed as a
      # warning and passes: one hosted sample read 8.62% against a usual 4.4% to
      # 5.4%, and the ceiling is calibrated on the gate host, where it
      # still fails. The backstop still fails here (#584, #586).
      # PARITY: mirrored by scripts/gate-pest.mjs.
      - name: Check slowest class (parallel band)
        run: php scripts/check-slowest-class.php --report=junit-parallel.xml --band=parallel

      # The timings a pull request's shards read: written on each push to main,
      # by each leg under a key naming its operating system and unique to the run,
      # and chosen by its creation time (see "Choose shard timings", #519, #516).
      # Never written by a pull request, so a branch cannot change the partition
      # another branch reads. The committed fallbacks, .github/pest-shards.json and
      # .github/pest-shards.windows-latest.json, are refreshed by hand from this
      # artifact when the cache is empty for long enough to matter.
      # REMOTE-ONLY: the local runner does not shard.
      - name: Save shard timings for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: tests/.pest/shards.json
          key: pest-shard-timings-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the band report and timings
        uses: actions/upload-artifact@v7
        with:
          name: pest-parallel-band-${{ matrix.os }}
          path: |
            junit-parallel.xml
            tests/.pest/shards.json
          if-no-files-found: error
          retention-days: 14

  mutate:
    name: Mutation tooling smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: after Rector. Cheap (~9s of work) so it sits ahead
    # of the two 2-min+ jobs there.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # This gates the mutation TOOLING, not the mutants. UAMS-Web/uams-statamic-archive#1728 was not a mutant
    # escaping a weak test — it was `pest-plugin-mutate` silently reporting
    # `0 Mutations for 0 Files created` after a `php-code-coverage` bump, which
    # Pest exits 0 on, so nothing anywhere went red. The adversarial-review rule
    # leans on this tool, and until now no gate exercised it at all.
    #
    # Runs one narrowly-scoped mutation pass over a pure, fully-covered class:
    # vendor/ but no .env, no app key, no database, no Node, no content/
    # submodule. Real, diff-scoped mutation runs stay AUTHOR-SIDE by design —
    # see tests/README.md and .claude/rules/adversarial-review.md.
    steps:
      - uses: actions/checkout@v7

      # `coverage: pcov` is the one line that separates this job from rector's
      # setup, and it is not optional: --mutate needs a coverage driver, and
      # without one the plugin reports 0 mutations — the exact false green this
      # job exists to catch. PCOV over Xdebug for speed (coverage-only driver).
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sqlite3, pdo_sqlite, dom, gd, fileinfo, bcmath, imagick, zip, exif, sockets
          coverage: pcov
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      # PARITY: mirrored by the mutate job in local-ci.json (same test, same
      # --path/--class scoping; its `mutation.minScore` of 100 makes the runner fail a
      # run that created no mutations or scored below 100, the two assertions below).
      # The local job runs it at `-d memory_limit=4G`, as the gate scripts run PHP:
      # setup-php leaves the limit unlimited here, and a local CLI caps it (#3212).
      #
      # The exit code alone is NOT sufficient. Pest exits 0 on
      # `0 Mutations for 0 Files created`, so the count and the score are both
      # parsed out of the plugin's own summary. ANSI is stripped before matching
      # because those lines are color-wrapped and an escape-anchored grep reads
      # as a clean miss rather than a parse failure.
      #
      # WHY THIS CLASS: AlertSiteKeyResolver is small, pure, fully covered, and
      # has a mutable surface (8 mutants across ternaries, a foreach, boolean
      # operators and an early return) that a refactor is unlikely to drain to
      # zero — and if one ever does, the count assertion turns this red instead
      # of letting it pass as a silent no-op. It is also the class UAMS-Web/uams-statamic-archive#1730 used to
      # verify the fix for UAMS-Web/uams-statamic-archive#1728, so these numbers are comparable to that ticket.
      - name: Run the mutation-tooling smoke
        run: |
          set -o pipefail

          # Refuse before Pest when no coverage driver is active (UAMS-Web/uams-statamic-archive#3213), with a
          # message that names it rather than the generic no-summary line. The
          # local mutate job has no probe: a run without a driver creates no mutations,
          # which its `mutation.minScore` fails.
          DRIVER="$(php -r 'echo extension_loaded("pcov") && filter_var(ini_get("pcov.enabled"), FILTER_VALIDATE_BOOLEAN) ? "pcov" : (extension_loaded("xdebug") && str_contains((string) ini_get("xdebug.mode"), "coverage") ? "xdebug" : "none");')"
          if [ "$DRIVER" = none ]; then
            echo "::error::No coverage driver is active in this PHP (PCOV, or Xdebug with xdebug.mode including coverage), so the mutation run cannot start. This is a workstation condition, not a branch defect, and it is not a pass. See .claude/skills/pcov-setup/SKILL.md."
            exit 1
          fi

          vendor/bin/pest tests/Unit/Support/UamsAlert/AlertSiteKeyResolverTest.php \
            --mutate --path=app/Support/UamsAlert \
            --class="App\Support\UamsAlert\AlertSiteKeyResolver" \
            --covered-only 2>&1 | tee mutate.log
          PLAIN="$(sed -r 's/\x1b\[[0-9;]*m//g' mutate.log)"

          if ! grep -qiE '[1-9][0-9]* Mutations? for [1-9][0-9]* Files? created' <<<"$PLAIN"; then
            echo "::error::The mutation tooling found nothing to mutate. This is the UAMS-Web/uams-statamic-archive#1728 false green, not a pass."
            grep -iE 'Mutations? for .* Files? created' <<<"$PLAIN" || echo "No mutation summary line was printed at all."
            exit 1
          fi

          if ! grep -qE 'Score:[[:space:]]+100\.00%' <<<"$PLAIN"; then
            echo "::error::Mutation score is below 100% on the smoke's subject."
            grep -E 'Score:' <<<"$PLAIN" || true
            exit 1
          fi

  build:
    name: Vite build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: after the JS unit tests.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7

      # `vite.config.js` imports `@statamic/cms/vite-plugin`, which is provided
      # by the Statamic vendor (under vendor/statamic/cms/packages/cms after
      # `composer install`). The build job therefore needs PHP + composer too.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # `ext-imagick` is a declared platform requirement in composer.json, so
          # every `composer install` below platform-checks it (UAMS-Web/uams-statamic-archive#1830). See
          # README_Imagick.md for the manual developer install.
          extensions: intl, mbstring, sqlite3, pdo_sqlite, dom, gd, fileinfo, bcmath, imagick, zip, exif, sockets
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by `.npmrc` engine-strict in the local dependencies job's npm ci
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # PARITY: mirrored by the build job in local-ci.json
      - name: Build site assets
        run: npm run build

      - name: Build CP assets
        run: npm run cp:build

  js:
    name: JS unit tests (Vitest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: after spell.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Framework-free: the unit suite (e.g. the coordinate parser) runs on a
    # standalone vitest.config.js, so it needs Node + `npm ci` but no PHP,
    # Composer, or content submodule.
    steps:
      - uses: actions/checkout@v7

      # scripts/worktree-slots.test.mjs spawns `php`, which only the Linux image ships.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by `.npmrc` engine-strict in the local dependencies job's npm ci
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # PARITY: mirrored by the js job in local-ci.json
      - name: Run JS unit tests
        run: npm run test:js

  spell:
    name: Spell check (cspell)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: after the encoding guard.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Blocking gate (UAMS-Web/uams-statamic-archive#1541): the dictionary is clean (0 hits), so a spelling issue
    # fails the job. Locally, where `local-ci.json` chains the jobs in cost
    # order, a typo skips (and never bills) js, build, pint, phpstan, Pest and the
    # browser smoke; here every job runs in parallel, so it fails this job alone.
    # Framework-free and cheap: Node + the
    # cspell CLI, no PHP, Composer, or content submodule. It supersedes the earlier
    # advisory (`continue-on-error`) phase from UAMS-Web/uams-statamic-archive#1018.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by `.npmrc` engine-strict in the local dependencies job's npm ci
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # PARITY: mirrored by the spell job in local-ci.json (advisory).
      - name: Run cspell
        run: npm run spell

  browser:
    name: CP browser smoke (Pest + Playwright)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: LAST, the most expensive job. Here it runs in
    # parallel with the rest.
    # Runs on every PR, like every other job here. The `browser-tests` label gate
    # this job used to carry was REMOVED in UAMS-Web/uams-statamic-archive#1727, along with the opt-in framing
    # in the local-ci mirror.
    #
    # WHY: four CP smokes sat red on `main` for eleven days (2026-07-17 ->
    # 07-28) and no gate reported it. The cause was not cost — the opt-in worked
    # exactly as designed; it just needed a human to remember, and for eleven
    # days nobody did. A label is the same bet on memory, so keeping it here
    # would leave the remote path able to reproduce the identical gap the moment
    # RUN_REMOTE_CI is switched back on. Budget is already handled by the
    # kill-switch below, which is the right lever for cost — a per-suite label
    # is not.
    #
    # `workflow_dispatch` is kept (see the `on:` block) so the job can still be
    # run on demand against a branch; it is no longer the only way in.
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v7

      # The served application boots from the same three submodules the `pest`
      # job checks out: collection and asset-container configs in `content/`, the
      # Control Panel login user in `users/`, and the form configurations in
      # `resources/forms/`. Without them every smoke stops at the login screen
      # and fails on whatever it reaches first (#378); tests/Pest.php now refuses
      # the run and names what is missing instead. Same token wiring as `pest`.
      - name: Check out the content, users and forms submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --depth 1 content users resources/forms

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sqlite3, pdo_sqlite, dom, gd, fileinfo, bcmath, imagick, zip, exif, sockets
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      # The framework has to be booted: `.env` + app key, plus `statamic:install`
      # (run by post-autoload-dump) to publish the Statamic core CP assets the
      # served Control Panel loads.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Composer post-autoload-dump scripts
        run: composer run-script post-autoload-dump --no-interaction

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor, and `.npmrc` sets
      # `engine-strict=true` — so `npm ci` refuses to run without this pin. Note the
      # cooldown itself is resolution-time: `npm ci` reifies the lockfile and never
      # applies `min-release-age`. The guard is earned wherever the lock is WRITTEN;
      # here the pin exists to satisfy engine-strict and keep CI on one npm (UAMS-Web/uams-statamic-archive#1826).
      # PARITY: mirrored by `.npmrc` engine-strict in the local dependencies job's npm ci
      - name: Pin npm to the min-release-age floor
        run: npm install -g npm@^11.10.0

      - name: Install npm dependencies
        run: npm ci

      # `--with-deps` also installs the Linux system libraries Chromium needs on
      # the runner. (scripts/gate-browser.mjs omits `--with-deps`: it is a no-op off Linux.)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # tests/Browser also holds front-end theme smokes (the KB rating
      # active-state, the uams_2020 runtime-JS smoke) that load the compiled
      # `public/build` bundle from its Vite manifest. Each CI job is a fresh
      # runner — the `build` job's `public/build` is not shared here — so this
      # job builds the front-end bundle itself, not only the CP bundle below.
      - name: Build front-end assets
        run: npm run build

      # Our custom CP fieldtype components live in this bundle; without it the
      # smoked fieldtype would be unregistered and error in the Control Panel.
      - name: Build CP assets
        run: npm run cp:build

      # PARITY: mirrored by scripts/gate-browser.mjs, which the local browser job runs
      # with --skip-build after the build job, as this job builds its own bundles above.
      # tests/Browser holds the CP smokes and the axe-core accessibility gate
      # (UAMS-Web/uams-statamic-archive#1046), which fails on serious/critical WCAG violations.
      - name: Run CP browser smokes + accessibility gate
        run: vendor/bin/pest tests/Browser

  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain position: second. `composer validate` measured ~1.5s against the
    # isolation guard's ~0.8s. The PSR-4 class check added in #322 scans `vendor/`
    # on a local run and took 23s on a loaded Windows machine, so the job is no
    # longer second by cost, and it stays second as recorded in docs/DECISIONS.md.
    # Here every job runs in parallel and nothing is gated.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when `composer.lock` no longer matches `composer.json` —
    # the content-hash drift a `composer.json` edit leaves behind when the lock
    # is not refreshed (UAMS-Web/uams-statamic-archive#1726 renamed the root package, UAMS-Web/uams-statamic-archive#1728 added an
    # `extra.patches` entry; both shipped a lock keyed to the pre-change file).
    # Nothing breaks outright, but every `composer install` on every machine then
    # warns "The lock file is not up to date with the latest changes in
    # composer.json" forever, and warning noise is how real warnings get ignored.
    # The second step fails on a class whose file does not match its PSR-4 path,
    # and the third on a file that declares more than one type.
    # Dependency-free: composer reads the two files and scans the source trees
    # directly, so this needs no `composer install`, no content submodule, and no
    # framework boot.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # `--no-check-publish --no-check-all` scopes this to the checks that apply
      # to an application rather than a published package. They do NOT change
      # pass/fail: bare `composer validate` also exits 0 here and 2 on a stale
      # lock, because warnings only fail under `--strict`. What they change is the
      # OUTPUT — `--no-check-all` drops the "exact version constraints should be
      # avoided" advice against the `statamic/cms`, `statamic/eloquent-driver`,
      # and `studio1902/statamic-peak-tools` pins the dependency-update chore sets
      # deliberately, and `--no-check-publish` declares this a project rather than
      # a package so publish-readiness can never start failing it. Warning noise
      # against deliberate choices is what trains people to ignore gate output,
      # which is the failure this job exists to prevent.
      # Deliberately NOT `--strict`: it exits 1 on a clean checkout even with both
      # flags, because "No license specified" is a general warning that
      # `--no-check-publish` does not suppress. Exit codes verified here: 0 on a
      # clean checkout, 2 once the lock hash goes stale.
      # PARITY: mirrored by the validate job in local-ci.json
      - name: Run composer validate
        run: composer validate --no-check-publish --no-check-all

      # PARITY: mirrored by the validate job in local-ci.json
      # Fails on a file under a PSR-4 root that declares a class but none matching
      # its path: an inline class in a Pest test file, or a misnamed one in `app/`.
      # Pest loads such a class only because the file happens to run, and Composer
      # drops it from the optimized class map with a warning that fails nothing
      # (#322). It does NOT report a second class beside one that matches: Composer
      # drops that class silently. `--dev` is required: with no `vendor/` Composer
      # treats the install as non-dev and skips `autoload-dev`, so `tests/` is never
      # scanned and the check passes on anything. `--dry-run` writes no autoload
      # files.
      - name: Run PSR-4 class check
        run: composer dump-autoload --optimize --dev --strict-psr --dry-run --no-scripts

      # PARITY: mirrored by the validate job in local-ci.json
      # Fails on a file declaring more than one class, enum, interface or trait,
      # naming the file and each extra type: the second class the step above drops
      # silently (#449, #555). A token scan of the files git lists, which needs only
      # PHP. It exits 2, failing the step, when its committed two-class control
      # fixture is not reported, so a blind scan cannot pass.
      - name: Run one-class-per-file check
        run: php scripts/check-one-class-per-file.php

  no-emoji-guard:
    name: No-emoji guard (durable records)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: after the composer.lock validation and BEFORE the
    # encoding guard, which is the first job that costs real time (it runs
    # `composer install`). This one is a pure file scan needing only Node, so
    # locally a glyph fails the build without ever billing an install.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when a durable record carries an emoji code point, per
    # .claude/rules/no-emoji-in-durable-records.md (UAMS-Web/uams-statamic-archive#2234). The rule was
    # documented and unenforced: no job looked for a glyph, so the corpus could
    # drift with nothing reporting it. Scope is the paths the rule names --
    # .claude/, docs/ and README.md -- and deliberately not app/, tests/ or
    # resources/, which the rule does not reach in this repository.
    #
    # The scanner is Node rather than a shell one-liner on purpose: a `perl -ne`
    # range scan matches NOTHING without `-CSD` -- no error, exit 0, an accurate
    # file count -- which is how the local-CI glyph probe read zero on every pull
    # request for a night. Node decodes UTF-8 natively, so that class cannot arise.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # PARITY: mirrored by the no-emoji job in local-ci.json
      - name: Run no-emoji guard
        run: node scripts/check-no-emoji.mjs

  content-pointer-guard:
    name: Submodule pointer guard (each on its main)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: after the no-emoji guard and BEFORE the encoding
    # guard, the first job that runs `composer install`. It needs only git and Node.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when any submodule gitlink of the validated commit names a
    # commit that is not on that submodule's `main` (UAMS-Web/uams-statamic-archive#2965; every declared
    # submodule since UAMS-Web/uams-statamic-archive#3115, the asset ones included). Such a pointer resolves for
    # whoever has the companion branch fetched and fails for everyone else, a
    # fresh clone and this workflow's pest job included, and it silently undoes
    # itself when the branch is deleted. UAMS-Web/uams-statamic-archive#2863 merged that way. An unchanged
    # pointer passes without a fetch; a moved one costs a bare clone of its
    # repository.
    # Exit 1 is "not on main", 3 is "not present at all", 2 is "could not run",
    # and every one of them fails the step.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The base the pointer is compared with: the pull request's base branch, the
      # previous commit on a push to main (a squash merge is one commit), and main
      # on a manual run, which can be on a branch several commits past its bump.
      # HEAD~1 there would read an earlier bump as unchanged; local-ci compares
      # with origin/main, so the two agree.
      - name: Determine the base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Each moved submodule's clone authenticates through an insteadOf rewrite, as
      # the pest job's submodule checkout does; `gh` uses the same token to name the
      # submodule pull request to land first.
      # PARITY: mirrored by the content-pointer job in local-ci.json
      - name: Run content pointer guard
        env:
          SUBMODULE_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
        run: |
          git config --global "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf" https://github.com/
          node scripts/check-content-pointer.mjs --base "${{ steps.base.outputs.ref }}"

  encoding-guard:
    name: Encoding guard (Windows-1252 double-encoding)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Local-chain cost rank: after the content pointer guard, though the shared breadth
    # check below makes it slower than that place implies (UAMS-Web/uams-statamic#403).
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails fast if any tracked file contains the cp1252-double-encoded UTF-8
    # byte sequences that produced PRs UAMS-Web/uams-statamic-archive#739, UAMS-Web/uams-statamic-archive#740, UAMS-Web/uams-statamic-archive#741, UAMS-Web/uams-statamic-archive#742 (see
    # joshdaugherty/ipa-unicode-inventory#1 for the full pattern). The script
    # ships with the inventory composer package as of v1.6.2 (see
    # joshdaugherty/ipa-unicode-inventory#4) — we invoke the vendored copy
    # so its detection logic stays in lockstep with the package version we
    # pin. content/ is not initialized — git ls-files does not descend into
    # submodules, so this job naturally scopes to the umbrella repo.
    # Despite the name, the job also runs the other sub-second guards below, ending
    # with the release-notes generator suite (UAMS-Web/uams-statamic-archive#2850), so read the failing step's name.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # `ext-imagick` is a declared platform requirement in composer.json, so
          # every `composer install` below platform-checks it (UAMS-Web/uams-statamic-archive#1830). See
          # README_Imagick.md for the manual developer install.
          extensions: intl, mbstring, sqlite3, pdo_sqlite, dom, gd, fileinfo, bcmath, imagick, zip, exif, sockets
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Composer auth for private GitHub packages
        run: composer config --global --auth github-oauth.github.com "${{ secrets.COMPOSER_AUTH_TOKEN }}"

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # PARITY: mirrored by the encoding job in local-ci.json
      - name: Run encoding guard
        run: node vendor/joshdaugherty/ipa-unicode-inventory/scripts/check-double-encoding.mjs

      # PARITY: mirrored by the encoding job in local-ci.json.
      # Added here rather than as a thirteenth job (UAMS-Web/uams-statamic-archive#2236): it reads one tracked
      # file, needs no install, and belongs beside the other file-content guard.
      - name: Run decision-log order guard
        run: node scripts/check-decision-log-order.mjs

      # PARITY: mirrored by the encoding job in local-ci.json.
      # Reports `@pest-mutate-ignore` annotations that suppress nothing (UAMS-Web/uams-statamic-archive#2316).
      # An inert one is invisible by construction: the mutant simply keeps
      # surviving, which reads as a wrong reason rather than as an annotation
      # that never applied, so nothing is ever red to point at it.
      #
      # Here rather than in a fourteenth job, extending UAMS-Web/uams-statamic-archive#2236's reasoning rather
      # than contradicting it. That note declined a job for a guard needing no
      # install; this one DOES read `vendor/pestphp/pest-plugin-mutate` for the
      # mutator names it validates against — and this job has already installed,
      # so folding it in costs nothing while a separate job would duplicate the
      # whole setup-php-cache-auth-install preamble to run a sub-second script.
      # Third of thirteen in a chain that is explicitly cost-ordered, so it still
      # fails before spell, js, build, pint, rector, mutate, phpstan and pest.
      #
      # Non-zero of ANY kind fails the step, which is the point rather than an
      # incidental: the auditor exits 2 when it cannot run at all (the plugin
      # missing), and treating that as a pass would restore exactly the silent
      # false-clean this guard exists to close.
      #
      # It tokenizes every file under app and tests, which needs more than 128M.
      # This CLI's memory_limit is the -1 (unlimited) default, so the step passes
      # no limit; the local runner gives this and every other PHP process it
      # starts LOCAL_CI_PHP_MEMORY_LIMIT, because a local PHP may cap lower (UAMS-Web/uams-statamic-archive#3212).
      - name: Run mutate-ignore auditor
        run: php scripts/check-mutate-ignore.php app tests

      # Counts how many mutants each `@pest-mutate-ignore` annotation removes (UAMS-Web/uams-statamic-archive#3160),
      # which the auditor above cannot see: breadth is a property of the AST, not of the
      # line. Fails on an annotation that removes more than one mutant of a named mutator
      # or none at all, unless the committed baseline lists it, and on a baseline entry
      # that no longer occurs. Exits 2 when it cannot run, which fails the step too. The
      # check is the shared one from the pest-testing skill (UAMS-Web/uams-statamic#403);
      # it also measures each mention of the marker against every mutator, so it is slower
      # than the private copy it replaced: 499s against 134s over app and tests, measured on
      # Windows 11. It reuses this job's install.
      # PARITY: mirrored by the encoding job in local-ci.json.
      - name: Run mutate-ignore breadth check
        run: php .claude/skills/pest-testing/scripts/check-mutate-ignore-breadth.php --baseline=tests/mutate-ignore-breadth.baseline.json app tests

      # Rejects a raw 0x0D that is not part of a CRLF pair (UAMS-Web/uams-statamic-archive#2495). `eol=lf` normalizes
      # CRLF and never sees a lone CR, and Pint passes it through untouched, so the class
      # reaches `main` past both. Beside the other file-content guards by UAMS-Web/uams-statamic-archive#2236's
      # reasoning: tracked files only, no install, sub-second.
      - name: Run lone-CR guard
        run: node scripts/check-lone-cr.mjs

      # PARITY: mirrored by the encoding job in local-ci.json.
      # Runs the unittest suite the shared `writing-release-notes` skill ships beside
      # `gen_release_notes.py` (UAMS-Web/uams-statamic-archive#2850). Nothing ran it, so release-notes coverage rested
      # on repo-local Pest guards written against an interface the shared script no
      # longer has. Beside the other guards by UAMS-Web/uams-statamic-archive#2236's reasoning: offline, no install,
      # no content, about a second. `python3` comes with the runner image, so no setup
      # step. unittest exits 1 on any failure or error, which fails the step.
      - name: Run release-notes generator suite
        run: python3 .claude/skills/writing-release-notes/gen_release_notes.test.py

  test-isolation-guard:
    name: Test isolation guard (parallel-safety)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # An early link in local-ci.json's cost-ordered chain, where a failure here
    # skips the entire rest of the pipeline. Here
    # it runs in parallel with every other job; see the fan-out note in the header.
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    # Fails the build when a test uses a parallel-unsafe, shared-state pattern
    # (a `Storage::persistentFake` disk, or a hardcoded `framework/testing` path with no
    # per-worker uniqueness token) without quarantining it into the `serial`
    # group — the flake class that keeps surfacing under `pest --parallel`
    # (UAMS-Web/uams-statamic-archive#1136, UAMS-Web/uams-statamic-archive#1149). A pure static scan of tests/, dependency-free: it needs
    # only PHP — no composer install, no content submodule, no framework boot.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # PARITY: mirrored by the isolation job in local-ci.json
      - name: Run test isolation guard
        run: php scripts/check-parallel-safe-tests.php

      # Global-scope test symbols (UAMS-Web/uams-statamic-archive#3112): a `const` or `function` declared in more
      # than one namespace-less file, and a single-segment `use X;` with no named
      # namespace. The shared pest-testing script; formerly Rules C and D above.
      # PARITY: mirrored by the isolation job in local-ci.json
      - name: Run global test symbol check
        run: php .claude/skills/pest-testing/scripts/check-global-test-symbols.php tests

  # The shared job chain (#580), called from UAMS-Web/uams-ci-workflows at a release
  # tag, so this file takes a change to it only when the tag below moves. It runs
  # composer-validate, synced-files, no-emoji, aggregate-needs, pint, rector, phpstan
  # and mutate-ignore, and reports each check as `checks / <job> (<os>)`, ending in
  # `checks / Chain result`. Each job checks out THIS repository; pint, rector,
  # phpstan and mutate-ignore install through `.github/actions/setup`, which this
  # repository carries, and the others set up PHP or Node themselves.
  #
  # The chain's own classification decides the legs: pint, rector, phpstan,
  # composer-validate, synced-files, no-emoji and aggregate-needs run on Linux only
  # (UAMS-Web/uams-claude-skills#454), and mutate-ignore on all three. Nothing here
  # overrides it, so `linux-only`, `all-platform-jobs` and `windows-jobs` are left
  # at their defaults.
  #
  # Switched off, each for a reason the chain cannot meet here:
  # - `pest: false`. The suite needs the private content, users and forms
  #   submodules, which only `secrets.COMPOSER_AUTH_TOKEN` can check out, and it
  #   runs sharded with its own reports; the `pest`, `pest-serial` and `pest-report`
  #   jobs above stay (UAMS-Web/uams-ci-workflows#5).
  # - `mutate: false`. A mutation run executes the suite to find the covering
  #   tests, so it needs those submodules too. The `mutate` job above keeps the
  #   tooling smoke, which runs one Unit test and needs none of them.
  # The optional jobs (encoding-guard, vitest, vite-build, mutation-smoke) stay
  # off: the `encoding-guard`, `js`, `build` and `mutate` jobs above run this
  # repository's own commands for them.
  #
  # The jobs the chain also runs keep their own copies above where those check more:
  # `composer-validate` adds the PSR-4 and one-class-per-file checks, and
  # `no-emoji-guard` runs this repository's sweep with its fixture exclusions.
  checks:
    # Budget kill-switch (see RUN_REMOTE_CI note in the header).
    if: vars.RUN_REMOTE_CI != 'false'
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.8.0
    with:
      pest: false
      mutate: false

  # The merge gate (#337). The ruleset on `main` requires this job's name and none of
  # the names above, so renaming a job never touches the ruleset, and the job set
  # lives in this one list. `submodule-access` is out because it runs only on a
  # manual run and would skip here on every pull request. No `RUN_REMOTE_CI` gate,
  # deliberately: with the switch off this job fails, where a gated one would skip and
  # a skip counts as success on a required check.
  ci:
    name: CI
    needs: [checks, encoding-guard, test-isolation-guard, no-emoji-guard, content-pointer-guard, composer-validate, spell, js, build, mutate, pest, pest-report, pest-serial, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # REMOTE-ONLY: the local runner stops at the first failure (`chain` in
      # local-ci.json), so it has no set of results to read. The chain test names this job in REMOTE_ONLY.
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      # An empty list fails too, or a broken expression above would pass with nothing read.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::No needed job results to read"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
