tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: first_name
            field:
              type: text
              display: 'First Name'
              localizable: false
              width: 50
              validate:
                - required
          -
            handle: last_name
            field:
              type: text
              display: 'Last Name'
              localizable: false
              width: 50
              validate:
                - required
          -
            handle: request_date
            field: uamsweb_common.date_field
            config:
              localizable: false
              validate:
                - required
          -
            handle: email_address
            field: uamsweb_common_contact.email_address
            config:
              validate:
                - required
          -
            handle: phone
            field: uamsweb_common_contact.phone
            config:
              validate:
                - required
          -
            handle: files_field
            field:
              max_files: 1
              type: files
              display: 'Upload your video here (.mp4 format)'
              instructions: 'Upload your .mp4 file. The maximum size is 70 MB (15-20 minute video).'
              localizable: false
              validate:
                - required
                - 'mimes:video/mp4'
                - null
                - 'max_filesize:73000'
